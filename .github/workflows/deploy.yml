# Publie le jeu sur GitHub Pages à chaque push sur main ou dev :
#   main -> https://zodiacfbo.github.io/bousier/
#   dev  -> https://zodiacfbo.github.io/bousier/dev/
# Le site assemblé est poussé sur la branche gh-pages (ne pas la modifier à la main).
name: Publier le jeu

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Récupérer dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Assembler le site
        run: |
          mkdir -p site/dev
          cp -r main/. site/
          cp -r dev/. site/dev/
          rm -rf site/.git site/.github site/dev/.git site/dev/.github
          # La version de test s'installe à part, avec un nom distinct
          sed -i 's/"name": "Bousier"/"name": "Bousier (dev)"/; s/"short_name": "Bousier"/"short_name": "Bousier dev"/' site/dev/manifest.webmanifest || true
          sed -i 's/<title>Bousier<\/title>/<title>Bousier (dev)<\/title>/; s/content="Bousier">/content="Bousier dev">/' site/dev/index.html
          touch site/.nojekyll

      - name: Publier sur gh-pages
        working-directory: site
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publication depuis ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
