# Vérifie la syntaxe du jeu à chaque push (toutes les branches) : croix rouge sur GitHub si un script est cassé.
# Ne publie rien : la publication reste faite par deploy.yml.
name: Vérifier le jeu

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntaxe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe des scripts
        run: node scripts/check-syntax.mjs
