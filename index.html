/* Chiffres plus lisibles : seuls 0-9 viennent de VT323, les lettres restent en Pixelify */
@font-face {
  font-family: 'Chiffres'; src: url(fonts/vt323-latin.woff2) format('woff2');
  unicode-range: U+0030-0039; size-adjust: 125%; font-display: swap;
}
:root {
  --u: 2px;
  --bg: #120a16; --panel: rgba(43, 28, 51, 0.92); --panel2: #4a3258; --ink: #fff6e6; --muted: #cdb8cf;

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; }
body {
  display: flex; align-items: center; justify-content: center;
  font-family: 'Chiffres', 'Pixelify Sans', ui-monospace, monospace;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: none;
  background: radial-gradient(ellipse at 50% 30%, #3a1f3a 0%, #120a16 70%);
}
#app { position: relative; overflow: hidden; box-shadow: 0 0 0 calc(var(--u)) #000, 0 0 40px rgba(0,0,0,.6); }
#screen { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
img.pix, canvas.pix { image-rendering: pixelated; image-rendering: crisp-edges; display: inline-block; vertical-align: middle; }

/* Semaine Halloween : couleurs des menus et décor de l'accueil */

@keyframes hwflap { 50% { transform: scaleY(.5); } }

  transform: translateY(-60px); transition: transform 2.6s ease-in-out; }

<script>
'use strict';
// ---------------------------------------------------------------------------
// Utilitaires : hasard déterministe, dates, police pixel 3x5
// ---------------------------------------------------------------------------

function mulberry32(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function hashStr(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function makeRng(seed) {
  const r = mulberry32(seed);
  return {
    next: r,
    range: (a, b) => a + (b - a) * r(),
    int: (a, b) => Math.floor(a + (b - a + 1) * r()),
    pick: arr => arr[Math.floor(r() * arr.length)],
    chance: p => r() < p,
  };
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;

// --- Dates (jour local) ----------------------------------------------------
const LAUNCH_DAY = '2026-10-20';

function dayKey(d = new Date()) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}
function dayFromKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function dayNumber(k) { return Math.round((dayFromKey(k) - dayFromKey(LAUNCH_DAY)) / 86400000) + 1; }
function addDays(k, n) { const d = dayFromKey(k); d.setDate(d.getDate() + n); return dayKey(d); }
function weekKey(k) { const d = dayFromKey(k); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return dayKey(d); }
function weekDays(wk) { return [0, 1, 2, 3, 4, 5, 6].map(i => addDays(wk, i)); }
function fmtDayLong(k) {
  return dayFromKey(k).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
}
function msToMidnight() {
  const n = new Date(), m = new Date(n); m.setHours(24, 0, 0, 0); return m - n;
}
function fmtCountdown(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60;
  return `${h}h${String(m).padStart(2, '0')}m${String(ss).padStart(2, '0')}s`;
}

// Taille de la boule (rayon en pixels) -> centimètres affichés
function radiusToCm(r) { return r * r * 0.4; }
function fmtTime(t) { const s = Math.floor(t); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function fmtSize(cm) {
  if (cm >= 100) return (cm / 100).toFixed(2).replace('.', ',') + ' m';
  return cm.toFixed(1).replace('.', ',') + ' cm';
}

// --- Police bitmap 3x5 -----------------------------------------------------
const FONT = {
  'A': '.#./#.#/###/#.#/#.#', 'B': '##./#.#/##./#.#/##.', 'C': '.##/#../#../#../.##', 'D': '##./#.#/#.#/#.#/##.',
  'E': '###/#../##./#../###', 'F': '###/#../##./#../#..', 'G': '.##/#../#.#/#.#/.##', 'H': '#.#/#.#/###/#.#/#.#',
  'I': '###/.#./.#./.#./###', 'J': '..#/..#/..#/#.#/.#.', 'K': '#.#/#.#/##./#.#/#.#', 'L': '#../#../#../#../###',
  'M': '#.#/###/###/#.#/#.#', 'N': '##./#.#/#.#/#.#/#.#', 'O': '.#./#.#/#.#/#.#/.#.', 'P': '##./#.#/##./#../#..',

function normText(t) { return String(t).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }
function textWidth(t, s = 1) { return normText(t).length * 4 * s - s; }

function drawText(ctx, text, x, y, color = '#fff', s = 1, outline = '#1d1416', align = 'left') {
  const t = normText(text);
  let ox = Math.round(align === 'center' ? x - textWidth(t, s) / 2 : align === 'right' ? x - textWidth(t, s) : x);
  y = Math.round(y);
  const pass = (col, dx, dy) => {
    ctx.fillStyle = col;
    for (let i = 0; i < t.length; i++) {
      const g = GLYPHS[t[i]] || GLYPHS['?'];
      for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++)
        if (g[r][c] === '#') ctx.fillRect(ox + i * 4 * s + c * s + dx, y + r * s + dy, s, s);

function newCanvas(w, h) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false;
  return [c, x];

function spriteFromRows(rows, pal = PAL) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const [c, x] = newCanvas(w, h);
  rows.forEach((row, j) => {
    for (let i = 0; i < row.length; i++) {

      if (ch === '.' || ch === ' ') continue;
      x.fillStyle = pal[ch] || '#f0f'; x.fillRect(i, j, 1, 1);
    }
  });
  return c;
}

// Grille de couleurs -> canvas, avec contour automatique optionnel
function gridToCanvas(grid, w, h, outline) {
  const [c, x] = newCanvas(w, h);
  if (outline) {
    const out = [];
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      if (grid[j * w + i]) continue;
      const n = (i > 0 && grid[j * w + i - 1]) || (i < w - 1 && grid[j * w + i + 1]) ||
        (j > 0 && grid[(j - 1) * w + i]) || (j < h - 1 && grid[(j + 1) * w + i]);
      if (n) out.push(j * w + i);
    }
    out.forEach(p => grid[p] = outline);
  }
  for (let p = 0; p < w * h; p++) if (grid[p]) { x.fillStyle = grid[p]; x.fillRect(p % w, (p / w) | 0, 1, 1); }
  return c;
}

function flipCanvas(src) {
  const [c, x] = newCanvas(src.width, src.height);
  x.translate(src.width, 0); x.scale(-1, 1); x.drawImage(src, 0, 0); return c;

// Rocher procédural
function makeRock(R, seed) {
  const rng = makeRng(seed);
  const w = Math.ceil(R * 2) + 3, h = Math.ceil(R * 1.7) + 3;
  const cx = w / 2, cy = h / 2, s1 = rng.range(0, 6), s2 = rng.range(0, 6);
  const cols = ['#5a4a3d', '#7f6a55', '#a89277', '#d6c3a5'];
  const grid = new Array(w * h).fill(null);
  for (let j = 1; j < h - 1; j++) for (let i = 1; i < w - 1; i++) {
    const dx = (i + 0.5 - cx) / R, dy = (j + 0.5 - cy) / (R * 0.82);
    const ang = Math.atan2(dy, dx);
    const rr = 1 + 0.1 * Math.sin(ang * 3 + s1) + 0.07 * Math.sin(ang * 5 + s2);
    const d = Math.hypot(dx, dy);
    if (d > rr * 0.95) continue;
    const nz = Math.sqrt(Math.max(0, 1 - (d / rr) ** 2));
    const L = -dx * 0.45 - dy * 0.65 + nz * 0.55 + bayer(i, j) * 0.3;
    grid[j * w + i] = cols[L > 0.85 ? 3 : L > 0.45 ? 2 : L > 0.1 ? 1 : 0];
  }
  // petites fissures
  for (let k = 0; k < Math.floor(R / 4); k++) {
    let i = Math.floor(cx + rng.range(-R * 0.5, R * 0.5)), j = Math.floor(cy + rng.range(-R * 0.3, R * 0.3));
    for (let s = 0; s < R * 0.4; s++) {
      if (grid[j * w + i]) grid[j * w + i] = cols[0];
      i += rng.int(-1, 1); j += rng.chance(0.5) ? 1 : 0;
    }
  }
  return gridToCanvas(grid, w, h, '#2a1d18');
}

// Palmier procédural (vu de dessus)
function makePalm(seed) {
  const rng = makeRng(seed);
  const w = 34, h = 30, cx = 17, cy = 14;
  const grid = new Array(w * h).fill(null);
  const n = 7, a0 = rng.range(0, Math.PI * 2);
  for (let f = 0; f < n; f++) {
    const a = a0 + f * Math.PI * 2 / n + rng.range(-0.2, 0.2), L = rng.range(12, 15);
    for (let t = 0; t < L; t += 0.5) {
      const x = cx + Math.cos(a) * t, y = cy + Math.sin(a) * t * 0.8 + t * t * 0.015;
      const rad = 2.4 * (1 - t / L) + 0.6;
      for (let j = Math.floor(y - rad); j <= y + rad; j++) for (let i = Math.floor(x - rad); i <= x + rad; i++) {
        if (i < 1 || j < 1 || i >= w - 1 || j >= h - 1) continue;
        const dd = Math.hypot(i - x, j - y);
        if (dd > rad) continue;
        const side = (i - x) * -Math.sin(a) + (j - y) * Math.cos(a);
        grid[j * w + i] = side < -0.6 ? '#9ad86a' : side > 0.8 ? '#2f6b33' : '#5fae4a';
      }
    }
  }
  for (const [dx, dy] of [[-1, 0], [1, 0], [0, 1]]) {
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++)
      if (i * i + j * j <= 1) grid[(cy + dy + j) * w + cx + dx + i] = (i === -1 || j === -1) ? '#8f5a32' : '#4a2c19';
  }
  return gridToCanvas(grid, w, h, '#14301a');
}

function makeParasol() {
  const w = 17, h = 15, cx = 8.5, cy = 7.5;
  const grid = new Array(w * h).fill(null);
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    const dx = (i + 0.5 - cx) / 7.5, dy = (j + 0.5 - cy) / 6.5;
    if (dx * dx + dy * dy > 1) continue;
    const sec = Math.floor(((Math.atan2(dy, dx) + Math.PI) / (Math.PI * 2)) * 8);
    let col = sec % 2 ? '#d8463a' : '#ffffff';
    if (dx * dx + dy * dy < 0.04) col = '#f2d65c';
    grid[j * w + i] = col;
  }
  return gridToCanvas(grid, w, h, '#1d1416');
}

// --- Boules (skins) --------------------------------------------------------
const BALL_CACHE = {};

function ballBase(skin, R) {
  R = Math.max(1, Math.round(R));
  const key = skin.id + '_' + R;
  if (BALL_CACHE[key]) return BALL_CACHE[key];
  const S = R * 2 + 1;
  const [c, x] = newCanvas(S, S);
  const cols = [skin.dark, skin.base, skin.light, skin.hi];
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const dx = i - R, dy = j - R, d2 = dx * dx + dy * dy;
    if (d2 > R * R + R * 0.6) continue;
    let col;
    if (d2 > (R - 1) * (R - 1) + R * 0.6 - 0.5 && R > 1) col = skin.out;
    else {
      const nx = dx / R, ny = dy / R, nz = Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
      const L = -nx * 0.5 - ny * 0.6 + nz * 0.62 + (bayer(i, j) - 0.5) * 0.25;
      col = cols[L > 0.9 ? 3 : L > 0.5 ? 2 : L > 0.12 ? 1 : 0];
    }
    x.fillStyle = col; x.fillRect(i, j, 1, 1);
  }
  BALL_CACHE[key] = c;
  return c;
}

// Points de texture sur la sphère (tournent quand la boule roule)
function genSpecks(skin) {
  const rng = makeRng(hashStr('specks' + skin.id));
  const pts = [];
  const randDir = () => {
    const u = rng.range(-1, 1), a = rng.range(0, Math.PI * 2), s = Math.sqrt(1 - u * u);
    return [s * Math.cos(a), s * Math.sin(a), u];
  };
  if (skin.pattern === 'stripes') {
    for (let k = 0; k < 8; k++) {
      const lon = k * Math.PI / 4;
      for (let lat = -1.45; lat <= 1.45; lat += 0.09)
        pts.push({ p: [Math.sin(lat), Math.cos(lat) * Math.cos(lon), Math.cos(lat) * Math.sin(lon)], col: skin.specks[0], big: true });
    }
  } else if (skin.pattern === 'planet') {
    for (let k = 0; k < 6; k++) {
      const c0 = randDir();
      for (let m = 0; m < 26; m++) {
        const p = c0.map(v => v + rng.range(-0.35, 0.35)), l = Math.hypot(...p);
        pts.push({ p: p.map(v => v / l), col: rng.chance(0.3) ? skin.specks[1] : skin.specks[0], big: true });
      }
    }
    for (let k = 0; k < 18; k++) pts.push({ p: randDir(), col: skin.specks[2], big: false });
  } else if (skin.pattern === 'bands') {
    // bandes de gaz (Saturne) : anneaux à x constant, stables quand la boule roule
    [-0.72, -0.4, -0.08, 0.26, 0.58].forEach((x0, k) => {
      for (let n = 0; n < 70; n++) {
        const x = x0 + rng.range(-0.07, 0.07), a = rng.range(0, Math.PI * 2), r = Math.sqrt(1 - x * x);
        pts.push({ p: [x, r * Math.cos(a), r * Math.sin(a)], col: skin.specks[k % 2], big: true });
      }
    });
  } else {
    for (let k = 0; k < (skin.count || 70); k++) pts.push({ p: randDir(), col: rng.pick(skin.specks), big: !!skin.bigSpecks });
  }
  return pts;
}

// Effets autour de certaines boules : anneau (Saturne), orbites (atome), halo (uranium).
// layer 'back' = derrière la boule, 'front' = devant.
function drawBallFx(ctx, skin, x, y, R, t, layer) {
  if (!skin.fx || R < 2) return;
  x = Math.round(x); y = Math.round(y);
  if (skin.fx === 'ring') {
    const rx = Math.round(R * 1.75), ry = Math.max(1, Math.round(R * 0.42));
    for (let i = -rx; i <= rx; i++) {
      const e = Math.sqrt(Math.max(0, 1 - (i / rx) ** 2)), dy = Math.round(ry * e);
      // inclinaison légère de l'anneau
      const tilt = Math.round(i * 0.18);
      if (layer === 'back') { ctx.fillStyle = skin.ring[1]; ctx.fillRect(x + i, y - dy + tilt, 1, 1); }
      else { ctx.fillStyle = skin.ring[0]; ctx.fillRect(x + i, y + dy + tilt, 1, 1); if (Math.abs(i) > R * 0.9) { ctx.fillStyle = skin.ring[1]; ctx.fillRect(x + i, y + dy + tilt - 1, 1, 1); } }
    }
  } else if (skin.fx === 'orbits' && layer === 'front') {
    const rx = R * 1.55, ry = R * 0.38;
    for (let k = 0; k < 3; k++) {
      const rot = k * Math.PI / 3 + 0.3, c = Math.cos(rot), sn = Math.sin(rot);
      ctx.fillStyle = 'rgba(220,245,255,0.85)';
      for (let a = 0; a < Math.PI * 2; a += 0.04) {
        const ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
        ctx.fillRect(Math.round(x + ex * c - ey * sn), Math.round(y + ex * sn + ey * c), 1, 1);
      }
      const a = t * 3 + k * 2.1, ex = Math.cos(a) * rx, ey = Math.sin(a) * ry;
      ctx.fillStyle = '#fff27a';
      ctx.fillRect(Math.round(x + ex * c - ey * sn) - 1, Math.round(y + ex * sn + ey * c) - 1, 2, 2);
    }
  } else if (skin.fx === 'glow' && layer === 'back') {
    const g = Math.round(R + 3 + Math.sin(t * 4));
    ctx.fillStyle = 'rgba(120,255,140,0.22)';
    for (let j = -g; j <= g; j++) { const w = Math.round(Math.sqrt(g * g - j * j)); ctx.fillRect(x - w, y + j, w * 2 + 1, 1); }
  }
}

// Bousier habillé : on recolore sa carapace (+ quelques pixels en plus)
const BEETLE_CACHE = {};
function beetleSprite(outfit, frame) {
  const base = frame ? 'beetleB' : 'beetleA';
  if (!outfit || !outfit.pal) return SPR[base];
  const key = outfit.id + base;
  if (!BEETLE_CACHE[key]) {
    const c = spriteFromRows(ROWS[base], { ...PAL, ...outfit.pal }), x = c.getContext('2d');
    for (const [px, py, col] of outfit.pixels || []) { x.fillStyle = col; x.fillRect(px, py, 1, 1); }
    BEETLE_CACHE[key] = c;
  }
  return BEETLE_CACHE[key];
}
// Cape qui flotte derrière le bousier (vers le haut de l'écran)
function drawCape(ctx, bx, btop, t) {
  for (let j = 0; j < 9; j++) {
    const w = 3 + Math.floor(j / 3), off = Math.round(Math.sin(t * 6 + j * 0.7) * (j / 5));
    ctx.fillStyle = j === 0 ? '#ffd25a' : (j + Math.floor(t * 4)) % 4 === 0 ? '#a8202a' : '#d8463a';
    ctx.fillRect(bx - w + off, btop + 3 - j, w * 2 + 1, 1);
  }
}

// Traînées : particules émises derrière le bousier, ou ruban (arc-en-ciel)
const RAINBOW = ['#ff4a4a', '#ff9a3a', '#ffe14a', '#5ad85a', '#4aa8ff', '#9a5ad8'];
function emitTrail(game, trail, b) {
  const x = b.x + (Math.random() - 0.5) * b.r * 1.2, y = b.y - b.r - 10, P = game.particles, f = game.frame;
  switch (trail.fx) {
    case 'sparkle': if (f % 3 === 0) P.push({ x, y, vx: (Math.random() - 0.5) * 20, vy: -10, g: 0, life: 0.7, spr: 'trEtoile' }); break;
    case 'bubbles': if (f % 6 === 0) P.push({ x, y, vx: (Math.random() - 0.5) * 10, vy: -25, g: 0, life: 1.1, spr: 'trBulle' }); break;
    case 'flames': if (f % 1 === 0) P.push({ x, y: y + 4, vx: (Math.random() - 0.5) * 16, vy: -30 - Math.random() * 20, g: 0, life: 0.45, col: ['#ffe14a', '#ff9a3a', '#ff4a2a'][f % 3], s: 2 }); break;
    case 'smoke': if (f % 3 === 0) P.push({ x, y, vx: (Math.random() - 0.5) * 14, vy: -14, g: 0, life: 1.2, col: f % 2 ? 'rgba(110,230,110,0.55)' : 'rgba(60,170,70,0.5)', s: 3 }); break;
    case 'notes': if (f % 10 === 0) P.push({ x, y, vx: (Math.random() - 0.5) * 16, vy: -22, g: 0, life: 1.2, spr: 'trNote' }); break;
    case 'dust': if (f % 2 === 0) P.push({ x, y: y + 6, vx: (Math.random() - 0.5) * 40, vy: -20 - Math.random() * 20, g: 30, life: 0.6, col: f % 4 ? '#ffd25a' : '#fff4a8', s: 2 }); break;
    case 'binary': if (f % 5 === 0) P.push({ x, y, vx: 0, vy: -18, g: 0, life: 1.1, txt: Math.random() < 0.5 ? '0' : '1', col: '#5aff7a' }); break;
  }
}
function drawRainbow(ctx, pts, r, t) {
  const bw = Math.max(1, Math.round(r * 0.28)), w = bw * RAINBOW.length;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], wave = Math.round(Math.sin(t * 8 + i * 0.5));
    const y0 = Math.round(Math.min(a.y, b.y)), h = Math.max(1, Math.round(Math.abs(a.y - b.y)) + 1);
    ctx.globalAlpha = Math.min(1, i / pts.length * 1.6);
    RAINBOW.forEach((col, k) => { ctx.fillStyle = col; ctx.fillRect(Math.round(b.x - w / 2) + k * bw + wave, y0, bw, h); });
  }
  ctx.globalAlpha = 1;
}
// Aperçu figé d'une traînée (menus)
function drawTrailStatic(ctx, trail, x, yTop, yBot, r) {
  if (!trail || !trail.fx) return;
  const rng = makeRng(hashStr('trail' + trail.id));
  if (trail.fx === 'rainbow') {
    const pts = [];
    for (let y = yTop; y <= yBot; y += 2) pts.push({ x, y });
    drawRainbow(ctx, pts, r, 0);
    return;
  }
  for (let k = 0; k < 7; k++) {
    const px = Math.round(x + rng.range(-r * 0.7, r * 0.7)), py = Math.round(yTop + (yBot - yTop) * k / 7);
    if (trail.fx === 'sparkle') ctx.drawImage(SPR.trEtoile, px - 1, py);
    else if (trail.fx === 'bubbles' && k % 2 === 0) ctx.drawImage(SPR.trBulle, px - 2, py);
    else if (trail.fx === 'notes' && k % 2 === 0) ctx.drawImage(SPR.trNote, px - 2, py);
    else if (trail.fx === 'flames') { ctx.fillStyle = ['#ff4a2a', '#ff9a3a', '#ffe14a'][k % 3]; ctx.fillRect(px, py, 2, 2); }
    else if (trail.fx === 'smoke') { ctx.fillStyle = 'rgba(90,210,100,0.6)'; ctx.fillRect(px - 1, py, 3, 3); }
    else if (trail.fx === 'dust') { ctx.fillStyle = k % 2 ? '#ffd25a' : '#fff4a8'; ctx.fillRect(px - 1, py, 2, 2); }
    else if (trail.fx === 'binary' && k % 2 === 0) drawText(ctx, rng.chance(0.5) ? '0' : '1', px, py, '#5aff7a', 1, null);
  }
}

// Masque d'obscurité (météo nuit) — trou de lumière tramé
const LIGHT_CACHE = {};
function lightMask(LR) {
  LR = Math.round(LR);
  if (LIGHT_CACHE[LR]) return LIGHT_CACHE[LR];
  const S = LR * 2 + 1;
  const [c, x] = newCanvas(S, S);
  x.fillStyle = 'rgba(8,8,28,0.9)';
  for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
    const d = Math.hypot(i - LR, j - LR) / LR;
    const a = clamp((d - 0.55) / 0.45, 0, 1);
    if (a > bayer(i, j)) x.fillRect(i, j, 1, 1);
  }
  LIGHT_CACHE[LR] = c;
  return c;
}

function buildSprites() {
  for (const k in ROWS) SPR[k] = spriteFromRows(ROWS[k]);
  SPR.lezardF = flipCanvas(SPR.lezard);
  SPR.kevinF = flipCanvas(SPR.kevin);
  SPR.scorpionF = flipCanvas(SPR.scorpion);
  SPR.tortueF = flipCanvas(SPR.tortue);
  SPR.grenouilleF = SPR.grenouille;
  SPR.palmier = makePalm(7);
  SPR.palmier2 = makePalm(99);
  SPR.parasol = makeParasol();
  for (const r of ROCK_SIZES) for (let v = 0; v < 2; v++) SPR[`rock_${r}_${v}`] = makeRock(r, r * 31 + v * 7);
}
const ROCK_SIZES = [3, 4, 5, 6, 7, 8, 10, 12, 14, 16, 18, 20];

// Rendu du personnage (boule + bousier + chapeau) en image pour les menus
function renderMascot(skin, hat, R = 9, scale = 1, outfit = null, trail = null) {
  const w = R * 2 + 16, h = R * 2 + 18 + (trail && trail.fx ? 14 : 0);
  const [c, x] = newCanvas(w, h);
  const bx = Math.floor(w / 2), by = h - R - 3;
  drawTrailStatic(x, trail, bx, 0, by - R - 12, R);
  // ombre
  x.fillStyle = 'rgba(60,30,10,0.3)';
  x.fillRect(bx - R + 2, by + R - 1, R * 2 - 2, 2);
  if (outfit && outfit.cape) drawCape(x, bx, by - R - 12, 0);
  x.drawImage(beetleSprite(outfit, 0), bx - 5, by - R - 12);
  drawHat(x, hat, bx, by - R - 12);
  drawBallFx(x, skin, bx, by, R, 1, 'back');
  const base = ballBase(skin, R);
  x.drawImage(base, bx - R, by - R);
  const specks = genSpecks(skin), th = 0.6;
  for (const s of specks) {
    const [px, py, pz] = s.p;
    const y2 = py * Math.cos(th) + pz * Math.sin(th), z2 = -py * Math.sin(th) + pz * Math.cos(th);
    if (z2 < 0.25) continue;
    x.fillStyle = s.col;
    const sz = s.big && R > 6 ? 2 : 1;
    x.fillRect(Math.round(bx + px * (R - 1.5)), Math.round(by + y2 * (R - 1.5)), sz, sz);
  }
  drawBallFx(x, skin, bx, by, R, 1, 'front');
  if (scale === 1) return c;
  const [c2, x2] = newCanvas(w * scale, h * scale);
  x2.drawImage(c, 0, 0, w * scale, h * scale);
  return c2;
}

// Chapeau posé sur la tête du bousier (tête en bas du sprite, vers la boule)
function drawHat(ctx, hat, cx, beetleTop) {
  if (!hat || !hat.sprite) return;
  const s = SPR[hat.sprite];
  ctx.drawImage(s, Math.round(cx - s.width / 2), beetleTop + 7 - Math.floor(s.height / 2) + 1 + (hat.dy || 0));
}

  load() {
    let d = null;
    try { d = JSON.parse(safeStorageGet(SAVE_KEY) || 'null'); } catch (e) { d = null; }
    if (!d || d.version !== 1) d = { version: 1, current: null, profiles: {}, settings: { sound: true } };
    for (const k in d.profiles) this.normalize(d.profiles[k]);
    this.data = d;
    return d;
  },
  save() {
    const p = this.profile();
    if (p) p.savedAt = Date.now();
    safeStorageSet(SAVE_KEY, JSON.stringify(this.data));
    if (p) Online.queueSync(p);
  },

  profile() { return this.data.profiles[this.data.current] || null; },

  newProfile(name) {
    return this.normalize({
      name, created: dayKey(), coins: 0, streak: 0, bestStreak: 0, lastDay: null,
      badges: {}, owned: { ball: [], hat: [], theme: [] },
      equip: { ball: 'classique', hat: 'aucun', theme: 'doree' },
      collection: {}, legends: {}, weathers: {},
      stats: { runs: 0, absorbed: 0, best: 0, terriers: 0, camels: 0 },
      days: {}, team: '', uid: null, account: false, counters: {},
    });
  },

  // Complète un profil créé avec une ancienne version (nouveaux emplacements, compteurs)
  normalize(p) {
    if (!p) return p;
    p.owned = { ball: [], hat: [], outfit: [], trail: [], theme: [], ...p.owned };
    p.equip = { outfit: 'aucune', trail: 'aucune', ...p.equip };
    p.counters = p.counters || {};
    p.survival = p.survival || { best: 0, runs: 0 };
    p.weeks = p.weeks || {};  // { semaine: place (0 = hors podium) }
    return p;
  },

  // Débloque ce qui vient d'être mérité ; renvoie la liste des nouveautés
  checkUnlocks(p) {
    const fresh = [];
    for (const type in COSMETICS) for (const item of COSMETICS[type])
      if (!this.owns(p, type, item) && unlockReached(p, item)) { p.owned[type].push(item.id); fresh.push({ type, item }); }
    return fresh;
  },

  createProfile(name) {
    name = name.trim().slice(0, 14);
    if (!name) return null;
    if (!this.data.profiles[name]) this.data.profiles[name] = this.newProfile(name);
    this.data.current = name;
    this.save();
    return this.data.profiles[name];
  },

  switchProfile(name) { if (this.data.profiles[name]) { this.data.current = name; this.save(); } },

  dayPeek(p, day) { return p.days[day] || { attempts: 0, runs: [], best: 0, bestRun: null, ghost: null, quests: {}, legend: false }; },
  dayData(p, day) { return p.days[day] || (p.days[day] = this.dayPeek(p, day)); },

  // On ne garde les fantômes que pour aujourd'hui et hier (place limitée)
  prune(today) {
    const limit = addDays(today, -1);
    for (const p of Object.values(this.data.profiles))
      for (const k in p.days) if (k < limit && p.days[k].ghost) p.days[k].ghost = null;
  },

  streakOf(p, today) {
    return p.lastDay === today || p.lastDay === addDays(today, -1) ? p.streak : 0;
  },

  owns(p, type, item) {
    return item.price === 0 || p.owned[type].includes(item.id) || (item.badge && p.badges[item.badge]);
  },

  discovered(p) {
    return OBJECTS.filter(o => p.collection[o.id]).length + LEGENDS.filter(l => p.legends[l.id]).length;
  },
};

// Classement de la semaine : somme des WEEK_BEST meilleurs jours de chacun
// (on n'est pas pénalisé si on ne joue pas tous les jours)
const WEEK_BEST = 3;
// Podium de la semaine : pièces pour les 3 premiers ; première semaine comptée
const PODIUM_COINS = [200, 100, 50];
const FIRST_WEEK = '2026-10-19';
function fmtWeek(wk) {
  const f = k => dayFromKey(k).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  return `du ${f(wk)} au ${f(addDays(wk, 6))}`;
}
function placeTxt(i) { return i === 0 ? '1er' : (i + 1) + 'e'; }
function weekTotal(scores) {
  const top = scores.slice().sort((a, b) => b - a).slice(0, WEEK_BEST);
  return Math.round(top.reduce((a, b) => a + b, 0) * 10) / 10;
}

// À score égal, le plus rapide passe devant
function sortBoard(list) {
  return list.sort((a, b) => b.score - a.score || (a.time ?? Infinity) - (b.time ?? Infinity));
}

// Résumé d'une partie tel qu'il est stocké (sert aussi aux titres du jour)
function runSummary(run) {
  return {
    score: run.score, sizeCm: Math.round(run.sizeCm * 10) / 10, terrier: run.terrier, legend: run.legend,
    time: Math.round(run.time * 10) / 10, absorbed: run.absorbed, bumps: run.bumps, wallHits: run.wallHits,
    pricks: run.pricks, weather: run.weather,
    // distance au centre du terrier (réussi) ou au bord (raté), pour les titres du jour
    holeOff: run.holeOff != null ? Math.round(run.holeOff * 10) / 10 : null,
    missBy: run.missBy != null ? Math.round(run.missBy * 10) / 10 : null,
  };
}
// Les 3 essais du jour, en résumé (titres liés au terrier)
const runsBrief = runs => (runs || []).map(r => ({ terrier: !!r.terrier, holeOff: r.holeOff ?? null, missBy: r.missBy ?? null }));

// Fantômes à affronter : le premier du jour et le rival (juste au-dessus de moi,
// ou le dernier du classement si je n'ai pas encore de score)
function pickGhostTargets(lb, me) {
  const i = lb.findIndex(e => e.name === me), out = [];
  if (lb.length && i !== 0) out.push({ ...lb[0], role: 'leader' });
  const rival = i > 1 ? lb[i - 1] : i < 0 && lb.length > 1 ? lb[lb.length - 1] : null;
  if (rival) out.push({ ...rival, role: 'rival' });
  return out;
}

// Regroupe le total de la semaine par équipe (moyenne des joueurs qui ont joué)
function teamBoard(week) {
  const by = {};
  for (const e of week) {
    if (!e.team) continue;
    const t = by[nameKey(e.team)] || (by[nameKey(e.team)] = { team: e.team, players: 0, total: 0 });
    t.players++; t.total += e.total;
    if (t.team === t.team.toLowerCase() && e.team !== e.team.toLowerCase()) t.team = e.team;  // garde l'orthographe avec majuscules
  }
  return Object.values(by).map(t => ({ ...t, avg: Math.round(t.total / t.players * 10) / 10 })).sort((a, b) => b.avg - a.avg);
}

// --- Classement local : tous les profils créés sur cet appareil ---------------
const LocalBoard = {
  async day(day) {
    return sortBoard(Object.values(Store.data.profiles)
      .map(p => { const d = p.days[day]; return d && d.best > 0 ? { id: p.name, name: p.name, score: d.best, time: d.bestRun && d.bestRun.time, run: d.bestRun, runs: runsBrief(d.runs), team: p.team || '' } : null; })
      .filter(Boolean));
  },
  async week(wk) {
    const days = weekDays(wk);
    return Object.values(Store.data.profiles).map(p => {
      const scores = days.map(k => p.days[k]).filter(d => d && d.best > 0).map(d => d.best);
      return { name: p.name, team: p.team || '', total: weekTotal(scores), played: scores.length };
    }).filter(e => e.played > 0).sort((a, b) => b.total - a.total);
  },
  async records() {
    return Object.values(Store.data.profiles).map(p => ({
      name: p.name, best: p.stats.best, bestStreak: p.bestStreak, legends: Object.keys(p.legends).length, badges: Object.keys(p.badges).length,
    })).sort((a, b) => b.best - a.best);
  },
  async ghosts(day, targets) {
    return targets.map(t => {
      const p = Store.data.profiles[t.name], d = p && p.days[day];
      return d && d.ghost ? { ...t, ghost: d.ghost } : null;
    }).filter(Boolean);
  },
};

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
}

// --- En ligne (Firestore) ----------------------------------------------------
// Chaque appareil a un compte anonyme, qu'on peut protéger par un mot de passe.
// Un joueur = un pseudo réservé (names/{pseudo en minuscules} -> uid).
//   names/{pseudo}                      propriétaire de chaque pseudo
//   envs/{env}/days/{jour}/scores/{id}  meilleur score du jour
//   envs/{env}/days/{jour}/ghosts/{id}  fantôme de ce meilleur score
//   envs/{env}/days/{jour}/reacts/{id}  réactions (👏 😂 💩 🔥) sur les scores
//   envs/{env}/players/{id}             records de tous les temps
//   envs/{env}/profiles/{id}            progression complète (pièces, badges…)
// avec id = « uid_pseudo ».
const REACTIONS = ['👏', '😂', '💩', '🔥'];

// Économie de lectures (quota gratuit de Firebase : 50 000 par jour) :
// - le classement du jour est gardé en mémoire 30 s, et mon propre score y est
//   ajouté directement après une partie au lieu de tout relire ;
// - les jours passés ne changent plus : lus une seule fois, puis gardés sur
//   l'appareil (14 jours) ; la semaine et le champion se calculent avec ;
// - records et réactions gardés en mémoire quelques minutes.
const DAY_TTL = 30 * 1000, RECORDS_TTL = 5 * 60 * 1000, REACT_TTL = 30 * 1000;
const PAST_KEY = `bousier_lb_${ONLINE_ENV}_`;

const Online = {
  conn: null,   // promesse -> { fb, auth, db } ou null
  live: false,  // vrai quand le dernier échange avec le serveur a réussi
  mem: {},      // cache en mémoire : clé -> { val, at }

  async cached(key, ttl, fn) {
    const c = this.mem[key];
    if (c && Date.now() - c.at < ttl) return c.val;
    const val = await fn();
    if (val) this.mem[key] = { val, at: Date.now() };
    return val;
  },
  pastGet(day) {
    try { return JSON.parse(safeStorageGet(PAST_KEY + day) || 'null'); } catch (e) { return null; }
  },
  pastSet(day, lb) {
    safeStorageSet(PAST_KEY + day, JSON.stringify(lb));
    // on ne garde que les 14 derniers jours
    const limit = PAST_KEY + addDays(dayKey(), -14);
    try { for (let i = localStorage.length - 1; i >= 0; i--) { const k = localStorage.key(i); if (k.startsWith(PAST_KEY) && k < limit) localStorage.removeItem(k); } } catch (e) { }
  },

  connect() {
    if (!this.conn) {
      this.conn = (async () => {
        if (!FIREBASE_CONFIG || !location.protocol.startsWith('http')) return null;
        // numéro de version : à changer à chaque reconstruction de vendor/firebase.js,
        // sinon un téléphone peut garder l'ancien module en cache avec la nouvelle page
        const fb = await import('./vendor/firebase.js?v=' + VENDOR_VERSION);
        const app = fb.initializeApp(FIREBASE_CONFIG);
        if (APPCHECK_SITE_KEY && !window.BOUSIER_EMULATOR)
          fb.initializeAppCheck(app, { provider: new fb.ReCaptchaV3Provider(APPCHECK_SITE_KEY), isTokenAutoRefreshEnabled: true });
        const auth = fb.getAuth(app), db = fb.getFirestore(app);
        if (window.BOUSIER_EMULATOR) {
          fb.connectAuthEmulator(auth, 'http://' + BOUSIER_EMULATOR.auth, { disableWarnings: true });
          const [host, port] = BOUSIER_EMULATOR.firestore.split(':');
          fb.connectFirestoreEmulator(db, host, +port);
        }
        // On attend la session enregistrée sur l'appareil : sans ça, chaque
        // ouverture créerait un nouveau compte (et un doublon au classement)
        await auth.authStateReady();
        if (!auth.currentUser) await fb.signInAnonymously(auth);
        return { fb, auth, db };
      })().catch(e => { console.warn('Classement en ligne indisponible', e); this.conn = null; return null; });
    }
    return this.conn;
  },

  // Lance une opération en ligne ; null si hors ligne, lent ou en erreur
  async run(fn, ms = 5000) {
    try {
      const c = await withTimeout(this.connect(), ms);
      if (!c) return null;
      const r = await withTimeout(fn(c), ms);
      this.live = true;
      return r;
    } catch (e) {
      console.warn('Classement en ligne', e);
      this.live = false;
      return null;
    }
  },

  uid(c) { return c.auth.currentUser ? c.auth.currentUser.uid : null; },
  id(c, name) { return this.uid(c) + '_' + encodeURIComponent(nameKey(name)); },
  ref(c, ...path) { return c.fb.doc(c.db, 'envs', ONLINE_ENV, ...path); },
  nameRef(c, name) { return c.fb.doc(c.db, 'names', nameKey(name)); },
  async list(c, path, field, n) {
    const { fb } = c;
    const snap = await fb.getDocs(fb.query(fb.collection(c.db, 'envs', ONLINE_ENV, ...path), fb.orderBy(field, 'desc'), fb.limit(n)));
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  // Le profil peut-il écrire en ligne ? Il doit appartenir au compte connecté
  // et son pseudo doit être réservé à son nom.
  async ready(c, p) {
    const uid = this.uid(c);
    if (!uid) return false;
    if (!p.uid) { p.uid = uid; Store.save(); }
    if (p.uid !== uid) return false;
    if (p.nameOk === uid) return true;
    const snap = await c.fb.getDoc(this.nameRef(c, p.name));
    if (snap.exists() && snap.data().uid !== uid) { p.nameTaken = true; return false; }
    if (!snap.exists()) await c.fb.setDoc(this.nameRef(c, p.name), { uid, name: p.name, at: Date.now() });
    p.nameOk = uid; p.nameTaken = false;
    return true;
  },

  // --- Lectures ---
  async day(day) {
    const past = day < dayKey();
    if (past) { const saved = this.pastGet(day); if (saved) { this.live = true; return saved; } }
    const lb = await this.cached('day:' + day, DAY_TTL, () => this.run(async c => sortBoard((await this.list(c, ['days', day, 'scores'], 'score', 200))
      .map(e => ({ id: e.id, name: e.name, score: e.score, time: e.time, run: e.run || null, runs: e.runs || null, team: e.team || '' })))));
    if (lb && past) this.pastSet(day, lb);
    return lb ? lb.slice() : lb;
  },
  async week(wk) {
    const today = dayKey(), days = await Promise.all(weekDays(wk).filter(k => k <= today).map(k => this.day(k)));
    if (days.some(d => !d)) return null;
    const by = {};
    for (const list of days) for (const e of list) {
      const t = by[e.name] || (by[e.name] = { name: e.name, team: '', scores: [] });
      t.scores.push(e.score); if (e.team) t.team = e.team;
    }
    return Object.values(by).map(e => ({ name: e.name, team: e.team, total: weekTotal(e.scores), played: e.scores.length })).sort((a, b) => b.total - a.total);
  },
  records() {
    return this.cached('records', RECORDS_TTL, () => this.run(async c => (await this.list(c, ['players'], 'best', 100))
      .map(e => ({ name: e.name, best: e.best, bestStreak: e.bestStreak, legends: e.legends, badges: e.badges, team: e.team || '' }))));
  },
  ghosts(day, targets) {
    return this.run(async c => (await Promise.all(targets.map(async t => {
      const snap = await c.fb.getDoc(this.ref(c, 'days', day, 'ghosts', t.id));
      if (!snap.exists()) return null;
      const g = snap.data();
      return { ...t, ghost: { x: g.x, y: g.y, r: g.r } };
    }))).filter(Boolean), 8000);
  },
  // { [id du score]: { '👏': 2, … } } + mes réactions { [id du score]: '👏' }
  reactions(day) {
    return this.cached('rx:' + day, REACT_TTL, () => this.run(async c => {
      const list = await this.list(c, ['days', day, 'reacts'], 'at', 500), uid = this.uid(c);
      const counts = {}, mine = {};
      for (const r of list) {
        const t = counts[r.target] || (counts[r.target] = {});
        t[r.e] = (t[r.e] || 0) + 1;
        if (r.id.startsWith(uid + '_')) mine[r.target] = r.e;
      }
      return { counts, mine };
    }));
  },

  // --- Écritures ---
  submitScore(p, day) {
    const d = p.days[day];
    if (!d || !(d.best > 0)) return Promise.resolve(null);
    return this.run(async c => {
      if (!await this.ready(c, p)) return false;
      const id = this.id(c, p.name), at = Date.now(), team = p.team || '';
      const time = d.bestRun && d.bestRun.time != null ? d.bestRun.time : null;
      const runs = runsBrief(d.runs);
      const writes = [c.fb.setDoc(this.ref(c, 'days', day, 'scores', id), { name: p.name, score: d.best, time, run: d.bestRun, runs, team, at })];
      if (d.ghost) writes.push(c.fb.setDoc(this.ref(c, 'days', day, 'ghosts', id), { name: p.name, score: d.best, x: d.ghost.x, y: d.ghost.y, r: d.ghost.r, at }));
      await Promise.all(writes);
      // mon score remplace l'ancien dans le classement en mémoire (sans relecture)
      const c0 = this.mem['day:' + day];
      if (c0) {
        const entry = { id, name: p.name, score: d.best, time, run: d.bestRun, runs, team };
        c0.val = sortBoard(c0.val.filter(e => e.id !== id).concat(entry));
      }
      return true;
    }, 8000);
  },
  submitPlayer(p) {
    return this.run(async c => {
      if (!await this.ready(c, p)) return false;
      await c.fb.setDoc(this.ref(c, 'players', this.id(c, p.name)), {
        name: p.name, best: p.stats.best, bestStreak: p.bestStreak, team: p.team || '',
        legends: Object.keys(p.legends).length, badges: Object.keys(p.badges).length, at: Date.now(),
        account: !!p.account, runs: p.stats.runs || 0,
      });
      return true;
    }, 8000);
  },
  react(day, p, target, e) {
    return this.run(async c => {
      if (!await this.ready(c, p)) return false;
      await c.fb.setDoc(this.ref(c, 'days', day, 'reacts', this.uid(c) + '_' + target), { target, e, by: p.name, at: Date.now() });
      delete this.mem['rx:' + day];
      return true;
    });
  },

  // Cadeaux de l'organisateur (page admin) : appliqués puis effacés
  claimGifts(p) {
    return this.run(async c => {
      if (!await this.ready(c, p)) return null;
      const ref = this.ref(c, 'gifts', this.id(c, p.name)), snap = await c.fb.getDoc(ref);
      if (!snap.exists()) return null;
      const g = snap.data();
      p.coins += g.coins || 0;
      for (const key of g.items || []) {
        const [type, id] = key.split(':'), item = COSMETICS[type] && COSMETICS[type].find(it => it.id === id);
        if (item && !Store.owns(p, type, item)) p.owned[type].push(id);
      }
      await c.fb.deleteDoc(ref);
      return g;
    }, 8000);
  },
  // La Grande Fuite : record de distance
  submitSurvival(p) {
    return this.run(async c => {
      if (!await this.ready(c, p)) return false;
      await c.fb.setDoc(this.ref(c, 'survival', this.id(c, p.name)), { name: p.name, best: Math.floor(p.survival.best), at: Date.now() });
      delete this.mem.survival;
      return true;
    }, 8000);
  },
  survivalTop() {
    return this.cached('survival', DAY_TTL, () => this.run(async c => (await this.list(c, ['survival'], 'best', 50)).map(e => ({ name: e.name, best: e.best }))));
  },

  // Boîte à idées
  sendIdea(p, type, text) {
    return this.run(async c => {
      if (!await this.ready(c, p)) return false;
      const uid = this.uid(c);
      await c.fb.setDoc(this.ref(c, 'suggestions', uid + '_' + Date.now()), { uid, name: p.name, type, text, status: 'new', at: Date.now() });
      delete this.mem['ideas'];
      return true;
    }, 8000);
  },
  myIdeas() {
    return this.cached('ideas', 60 * 1000, () => this.run(async c => {
      const { fb } = c, uid = this.uid(c);
      const snap = await fb.getDocs(fb.query(fb.collection(c.db, 'envs', ONLINE_ENV, 'suggestions'), fb.where('uid', '==', uid), fb.limit(50)));
      return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => b.at - a.at);
    }));
  },

  // Annonce de l'organisateur affichée sur l'accueil
  announce() {
    return this.cached('announce', 10 * 60 * 1000, () => this.run(async c => {
      const snap = await c.fb.getDoc(this.ref(c, 'config', 'announce'));
      return snap.exists() ? snap.data() : { text: '' };
    }));
  },

  // --- Progression en ligne ---
  // Copie du profil sans les fantômes (lourds) ni les jours anciens
  packProfile(p) {
    const limit = addDays(dayKey(), -30), days = {};
    for (const k in p.days) if (k >= limit) days[k] = { ...p.days[k], ghost: null };
    return JSON.stringify({ ...p, days, nameOk: undefined, nameTaken: undefined });
  },
  queueSync(p) {
    if (!FIREBASE_CONFIG) return;
    clearTimeout(this._sync);
    this._sync = setTimeout(() => this.syncProfile(p), 3000);
  },
  syncProfile(p) {
    return this.run(async c => {
      if (!await this.ready(c, p)) return false;
      await c.fb.setDoc(this.ref(c, 'profiles', this.id(c, p.name)), { name: p.name, at: p.savedAt || Date.now(), data: this.packProfile(p) });
      return true;
    }, 8000);
  },
  // Récupère la progression en ligne si elle est plus récente (joué sur un autre appareil)
  pullProfile(p) {
    return this.run(async c => {
      if (!await this.ready(c, p)) return false;
      const snap = await c.fb.getDoc(this.ref(c, 'profiles', this.id(c, p.name)));
      if (!snap.exists() || !(snap.data().at > (p.savedAt || 0))) return false;
      const cloud = JSON.parse(snap.data().data);
      for (const k in cloud.days) if (p.days[k] && p.days[k].ghost) cloud.days[k].ghost = p.days[k].ghost;
      Object.assign(p, cloud, { savedAt: snap.data().at });
      Store.normalize(p);
      safeStorageSet(SAVE_KEY, JSON.stringify(Store.data));
      return true;
    }, 8000);
  },

  // --- Comptes ---
  async currentUid() {
    try { const c = await withTimeout(this.connect(), 5000); return c ? this.uid(c) : null; } catch (e) { return null; }
  },

  // Création de profil : crée le compte si le pseudo est libre, ou protège un
  // ancien profil sans mot de passe de cet appareil
  async create(name, password) {
    name = name.trim();
    try {
      const c = await withTimeout(this.connect(), 8000);
      if (!c) return { error: 'Pas de connexion internet : il en faut une pour créer ou retrouver ton profil.' };
      const { fb, auth } = c, user = auth.currentUser;
      const owner = await withTimeout(fb.getDoc(this.nameRef(c, name)), 8000);
      const cred = () => fb.EmailAuthProvider.credential(accountEmail(name), password);
      // ancien profil sans mot de passe, sur cet appareil : on le protège
      if (owner.exists() && user.isAnonymous && owner.data().uid === user.uid) {
        await withTimeout(fb.linkWithCredential(user, cred()), 10000);
        const p = Store.data.profiles[owner.data().name] || Store.newProfile(owner.data().name);
        Object.assign(p, { uid: user.uid, account: true, nameOk: user.uid });
        Store.data.profiles[p.name] = p; Store.data.current = p.name; Store.save();
        this.live = true;
        return { name: p.name, isNew: false };
      }
      if (owner.exists()) return { error: 'Ce pseudo existe déjà. Si c\'est le tien, connecte-toi.' };
      try {
        if (user.isAnonymous) await withTimeout(fb.linkWithCredential(user, cred()), 10000);
        else await withTimeout(fb.createUserWithEmailAndPassword(auth, accountEmail(name), password), 10000);
      } catch (e) {
        // compte existant dont le pseudo a été libéré à la main : il faut s'y connecter
        if (String(e.code).includes('already-in-use')) return { error: 'Ce pseudo existe déjà. Si c\'est le tien, connecte-toi.' };
        throw e;
      }
      const uid = this.uid(c);
      await withTimeout(fb.setDoc(this.nameRef(c, name), { uid, name, at: Date.now() }), 8000);
      const p = Object.assign(Store.newProfile(name), { uid, account: true, nameOk: uid });
      Store.data.profiles[name] = p; Store.data.current = name; Store.save();
      this.live = true;
      return { name, isNew: true };
    } catch (e) { return { error: this.authError(e) }; }
  },

  // Déconnexion : la progression est d'abord envoyée en ligne, puis l'appareil
  // repart sur un compte anonyme vierge
  async logout(p) {
    try {
      if (await this.syncProfile(p) !== true) return 'Connecte-toi à internet pour te déconnecter sans perdre ta progression.';
      const c = await withTimeout(this.connect(), 8000);
      await withTimeout(c.fb.signOut(c.auth), 8000);
      this.mem = {};
      await withTimeout(c.fb.signInAnonymously(c.auth), 8000);
      return null;
    } catch (e) { console.warn('Déconnexion', e); return 'Déconnexion impossible pour le moment (réseau ?).'; }
  },

  // Protège le profil actuel par un mot de passe (le compte anonyme devient un vrai compte)
  async secure(p, password) {
    try {
      const c = await withTimeout(this.connect(), 8000);
      if (!c) return 'Pas de connexion.';
      const user = c.auth.currentUser;
      if (!user.isAnonymous) return 'Cet appareil est déjà connecté à un autre compte.';
      if (!await withTimeout(this.ready(c, p), 8000)) return p.nameTaken ? 'Ce pseudo appartient à un autre joueur.' : 'Ce profil appartient à une autre session.';
      await withTimeout(c.fb.linkWithCredential(user, c.fb.EmailAuthProvider.credential(accountEmail(p.name), password)), 10000);
      p.account = true; Store.save();
      await this.syncProfile(p);
      return null;
    } catch (e) { return this.authError(e); }
  },
  // Se connecte à un compte et récupère sa progression sur cet appareil
  async login(name, password) {
    try {
      const c = await withTimeout(this.connect(), 8000);
      if (!c) return { error: 'Pas de connexion.' };
      const cred = await withTimeout(c.fb.signInWithEmailAndPassword(c.auth, accountEmail(name), password), 10000);
      const uid = cred.user.uid;
      if (DEV_LOCKED && uid !== ADMIN_UID) return { error: 'Version de test réservée à l\'organisateur.' };
      const owner = await c.fb.getDoc(this.nameRef(c, name));
      const realName = owner.exists() ? owner.data().name : name.trim();
      if (!owner.exists()) await c.fb.setDoc(this.nameRef(c, name), { uid, name: realName, at: Date.now() });
      const snap = await c.fb.getDoc(this.ref(c, 'profiles', uid + '_' + encodeURIComponent(nameKey(realName))));
      const p = snap.exists() ? Object.assign(Store.newProfile(realName), JSON.parse(snap.data().data)) : Store.newProfile(realName);
      Object.assign(p, { name: realName, uid, account: true, nameOk: uid, nameTaken: false });
      Store.normalize(p);
      Store.data.profiles[realName] = p;
      Store.data.current = realName;
      Store.save();
      this.live = true;
      return { name: realName };
    } catch (e) { return { error: this.authError(e) }; }
  },
  authError(e) {
    const code = e && e.code || '';
    console.warn('Compte', e);
    if (code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found') || code.includes('invalid-email')) return 'Pseudo ou mot de passe incorrect.';
    if (code.includes('weak-password')) return 'Mot de passe trop court (6 caractères minimum).';
    if (code.includes('email-already-in-use') || code.includes('credential-already-in-use')) return 'Ce pseudo a déjà un compte : connecte-toi.';
    if (code.includes('too-many-requests')) return 'Trop d\'essais, réessaie dans quelques minutes.';
    if (code.includes('operation-not-allowed')) return 'Les comptes ne sont pas encore activés sur le serveur.';
    return 'Impossible pour le moment (réseau ?).';
  },
};

// --- Classement utilisé par le jeu : en ligne si possible, sinon local ---------
const Leaderboard = {
  async day(day) {
    const online = await Online.day(day);
    const lb = online || await LocalBoard.day(day);
    lb.online = !!online;
    return lb;
  },
  async week(wk) { return (await Online.week(wk)) || LocalBoard.week(wk); },
  async teams(wk) { return teamBoard(await this.week(wk)); },
  async records() { return (await Online.records()) || LocalBoard.records(); },
  // Le premier, le rival et mon propre record du jour
  async ghosts(day, p) {
    const lb = await this.day(day), targets = pickGhostTargets(lb, p.name);
    const list = targets.length ? (lb.online ? await Online.ghosts(day, targets) : await LocalBoard.ghosts(day, targets)) || [] : [];
    const mine = Store.dayPeek(p, day).ghost;
    if (mine) list.push({ name: p.name, role: 'self', ghost: mine });
    return list;
  },
  // Podium d'une semaine terminée (3 premiers, 2 joueurs min.), gardé sur l'appareil
  async podium(wk) {
    const key = `bousier_wk_${ONLINE_ENV}_${wk}`;
    try { const saved = JSON.parse(safeStorageGet(key) || 'null'); if (saved) return saved; } catch (e) { }
    const lb = await Online.week(wk);
    if (!lb) return null;
    const res = { wk, players: lb.length, top: lb.length >= 2 ? lb.slice(0, 3).map(e => ({ name: e.name, total: e.total })) : [] };
    safeStorageSet(key, JSON.stringify(res));
    return res;
  },
  // Toutes les semaines terminées, de la plus récente à la plus ancienne
  async palmares(today) {
    const weeks = [];
    for (let wk = addDays(weekKey(today), -7); wk >= FIRST_WEEK; wk = addDays(wk, -7)) weeks.push(wk);
    return (await Promise.all(weeks.map(wk => this.podium(wk)))).filter(w => w && w.top.length);
  },
  // Champion de la semaine précédente (couronne 👑)
  async champion(today) {
    const pod = await this.podium(addDays(weekKey(today), -7));
    return pod && pod.top.length ? pod.top[0].name : null;
  },
};

</script>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Moteur : génération de la dune du jour, simulation de la boule, rendu
// ---------------------------------------------------------------------------

const W = 180;
const NEW_EVENTS_FROM = '2026-11-02';
const COURSE_LEN = 5800, HOLE_Y = 5500, HOLE_TOL = 11, START_AREA = 25;
const TICK = 1 / 60, GHOST_EVERY = 3;
const GHOST_SKIN = { id: 'ghost', base: '#d8d0f8', light: '#f0ecff', hi: '#ffffff', dark: '#a69ad8', out: '#4a3a8a' };

// --- Sons (bips synthétisés, aucun fichier) --------------------------------
const Sound = {
  ctx: null, on: true, lastPop: 0,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(freq, dur, type = 'square', vol = 0.05, slide = 0, delay = 0) {
    if (!this.on || !this.ctx) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), t0 + dur);
    g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  },
  play(name, v = 0) {
    if (!this.on || !this.ctx) return;
    switch (name) {
      case 'pop': {
        const now = performance.now(); if (now - this.lastPop < 35) return; this.lastPop = now;
        this.tone(950 - Math.min(750, v * 60), 0.07, 'square', 0.03, 1.6); break;
      }
      case 'bump': this.tone(150, 0.16, 'triangle', 0.14, 0.5); break;
      case 'prick': this.tone(1300, 0.07, 'sawtooth', 0.04, 0.5); this.tone(150, 0.16, 'triangle', 0.12, 0.5); break;
      case 'legend': [660, 880, 1100, 1320].forEach((f, i) => this.tone(f, 0.12, 'square', 0.04, 1, i * 0.07)); break;
      case 'count': this.tone(440, 0.1, 'square', 0.05); break;
      case 'go': this.tone(880, 0.22, 'square', 0.05); break;
      case 'win': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.16, 'square', 0.05, 1, i * 0.1)); break;
      case 'miss': [392, 330, 262].forEach((f, i) => this.tone(f, 0.2, 'triangle', 0.09, 1, i * 0.15)); break;
      case 'unlock': this.tone(700, 0.08, 'square', 0.04, 1.5); this.tone(1050, 0.12, 'square', 0.04, 1.3, 0.08); break;
      case 'click': this.tone(620, 0.04, 'square', 0.025); break;
    }
  },
};

// --- Défi du jour ----------------------------------------------------------
function baseWeatherIdx(day) { return Math.floor(makeRng(hashStr(day + '|meteo')).next() * WEATHERS.length); }

// Météo du jour : jamais la même que la veille. On la calcule de proche en
// proche depuis le lancement pour comparer avec la météo réellement tirée.
const WX_CACHE = {};
function rerollWeather(day, prev) {
  const wi = baseWeatherIdx(day);
  return wi !== prev ? wi : (wi + 1 + Math.floor(makeRng(hashStr(day + '|m2')).next() * (WEATHERS.length - 1))) % WEATHERS.length;
}
// Semaine Halloween : environ une nuit sur deux (jamais deux de suite), nuit le 31
const NIGHT_IDX = WEATHERS.findIndex(w => w.id === 'nuit');
function dayWeather(day, prev) {
  const wi = rerollWeather(day, prev);
  if (!isHalloween(day)) return wi;
  if (day === HALLOWEEN.night) return NIGHT_IDX;
  if (addDays(day, 1) === HALLOWEEN.night || prev === NIGHT_IDX) {
    if (wi !== NIGHT_IDX) return wi;
    const others = WEATHERS.map((_, i) => i).filter(i => i !== NIGHT_IDX && i !== prev);
    return others[Math.floor(makeRng(hashStr(day + '|hw2')).next() * others.length)];
  }
  return makeRng(hashStr(day + '|hw')).next() < 0.75 ? NIGHT_IDX : wi;
}
function weatherIdx(day) {
  // jusqu'au lancement : l'ancienne règle, pour ne pas changer une dune déjà jouée
  if (day <= LAUNCH_DAY) return rerollWeather(day, baseWeatherIdx(addDays(day, -1)));
  if (WX_CACHE[day] == null) {
    let d = LAUNCH_DAY, prev = weatherIdx(d);
    while (d < day) {
      d = addDays(d, 1);
      if (WX_CACHE[d] == null) WX_CACHE[d] = dayWeather(d, prev);
      prev = WX_CACHE[d];
    }
  }
  return WX_CACHE[day];
}

function dailyConfig(day) {
  const wi = weatherIdx(day);
  const legend = day === HALLOWEEN.night ? SUGAR_SKULL : LEGENDS[Math.floor(makeRng(hashStr(day + '|legend')).next() * LEGENDS.length)];
  const seed = hashStr('bousier|' + day);
  const weather = WEATHERS[wi];
  const course = generateCourse(seed, weather, legend, day);
  const qr = makeRng(hashStr(day + '|quests'));
  const pool = QUEST_GEN.slice(), quests = [];
  while (quests.length < 3) quests.push(pool.splice(Math.floor(qr.next() * pool.length), 1)[0](qr, course));
  return { day, num: dayNumber(day), seed, weather, legend, course, quests, mode: 'daily' };
}

function practiceConfig() {
  const seed = (Math.random() * 1e9) >>> 0, rng = makeRng(seed);
  const weather = rng.pick(WEATHERS), legend = rng.pick(LEGENDS);
  return { seed, weather, legend, course: generateCourse(seed, weather, legend), quests: [], mode: 'practice' };
}

// --- Génération de la dune --------------------------------------------------
function generateCourse(seed, weather, legend, day = dayKey()) {
  const rng = makeRng(seed);
  const len = COURSE_LEN, holeY = HOLE_Y;
  const p = [0, 0, 0, 0, 0].map(() => rng.range(0, Math.PI * 2));
  const Lx = new Float32Array(len), Rx = new Float32Array(len);
  for (let y = 0; y < len; y++) {
    const t = Math.min(1, y / holeY);
    const cx = W / 2 + 22 * Math.sin(y * 0.0021 + p[0]) + 10 * Math.sin(y * 0.0057 + p[1]);
    let hw = 50 + 24 * t + 12 * Math.sin(y * 0.0033 + p[2]) + 5 * Math.sin(y * 0.011 + p[3]);
    if (y < 300) hw = lerp(72, hw, y / 300);
    Lx[y] = Math.max(5, cx - hw); Rx[y] = Math.min(W - 5, cx + hw);
  }
  const hl = Lx[holeY], hr = Rx[holeY];
  const holeX = clamp((hl + hr) / 2 + rng.range(-28, 28), hl + 22, hr - 22);
  for (let y = holeY; y < len; y++) {
    const k = clamp((y - holeY - 70) / 120, 0, 1);
    Lx[y] = lerp(Lx[y], holeX - 30, k); Rx[y] = lerp(Rx[y], holeX + 30, k);
  }

  const types = OBJECTS.filter(o => !o.weather || o.weather === weather.id).concat(isHalloween(day) ? SEASON_OBJECTS : []);
  const objs = [], recent = [];
  const mk = (def, x, y, r, sprite) => {
    const o = { def, x, x0: x, y, r, sprite: sprite || def.sprite, dead: false, hitT: -9, phase: rng.range(0, 6.28), amp: 0, w: 0 };
    if (def.move === 'side') { o.amp = rng.range(8, 16); o.w = rng.range(1.1, 2); }
    if (def.move === 'slow') { o.amp = rng.range(4, 8); o.w = rng.range(0.3, 0.5); }
    return o;
  };
  const place = (o) => {
    for (const q of recent) if (Math.hypot(q.x - o.x, q.y - o.y) < q.r + o.r + 3 + q.amp + o.amp) return false;
    objs.push(o); recent.push(o); if (recent.length > 12) recent.shift();
    return true;
  };
  const rockDef = OBJ.rocher;
  const makeRockObj = (x, y, t) => {
    const want = clamp(3 + t * 16 + rng.range(-4, 5), 3, 20);
    const R = ROCK_SIZES.reduce((a, b) => Math.abs(b - want) < Math.abs(a - want) ? b : a);
    return mk(rockDef, x, y, R * 0.9, `rock_${R}_${rng.int(0, 1)}`);
  };

  let y = 170;
  while (y < holeY - 170) {
    const t = y / holeY;
    y += rng.range(6, 13) * (1 + t * 0.55);
    const L = Lx[y | 0], R = Rx[y | 0];
    if (rng.chance(0.07)) { // traînée de petits objets : récompense la bonne trajectoire
      const maxR = 1.5 + t * 5.5;
      const cand = types.filter(o => !o.rock && !o.move && !o.prickly && o.r <= maxR && o.r >= maxR - 3);
      const def = cand.length ? rng.pick(cand) : OBJ.grain;
      const n = rng.int(5, 9), x0 = rng.range(L + 15, R - 15), amp = rng.range(4, 14), f = rng.range(0.4, 0.8);
      for (let i = 0; i < n; i++) {
        const xx = clamp(x0 + Math.sin(i * f) * amp, L + def.r + 2, R - def.r - 2);
        place(mk(def, xx, y + i * (def.r * 2 + 4), def.r));
      }
      y += n * (def.r * 2 + 4);
      continue;
    }
    let tot = 0;
    const ws = types.map(o => { const w = o.w * Math.exp(-(((t - o.tp) / o.s) ** 2)); tot += w; return w; });
    let pick = rng.next() * tot, def = types[0];
    for (let i = 0; i < types.length; i++) { pick -= ws[i]; if (pick <= 0) { def = types[i]; break; } }
    const x = rng.range(L + 8, R - 8);
    const o = def.rock ? makeRockObj(x, y, t) : mk(def, x, y, def.r);
    o.x = o.x0 = clamp(o.x, L + o.r + o.amp + 2, R - o.r - o.amp - 2);
    place(o);
  }

  // Objet légendaire : caché entre deux cactus, au milieu de la dune
  const ly = Math.round(holeY * rng.range(0.35, 0.72));
  const lc = (Lx[ly] + Rx[ly]) / 2, lw = (Rx[ly] - Lx[ly]) / 2;
  const lx = clamp(lc + rng.range(-lw * 0.6, lw * 0.6), Lx[ly] + 24, Rx[ly] - 24);
  for (const o of objs) if (Math.hypot(o.x - lx, o.y - ly) < 30) o.removed = true;
  const ldef = { id: legend.id, name: legend.name, legendary: true, r: 4 };
  objs.push(mk(ldef, lx, ly, 4, legend.sprite));
  objs.push(mk(OBJ.cactus, lx - 15, ly - 2, OBJ.cactus.r));
  objs.push(mk(OBJ.cactus, lx + 15, ly + 3, OBJ.cactus.r));

  // Abords du terrier dégagés + drapeaux
  for (const o of objs) if (Math.abs(o.y - holeY) < 80 && Math.abs(o.x - holeX) < 34 && !o.def.legendary) o.removed = true;
  const final = objs.filter(o => !o.removed);
  final.push({ deco: true, def: { id: 'flag' }, x: holeX - 24, y: holeY - 4, r: 2, sprite: 'drapeau', amp: 0 });
  final.push({ deco: true, def: { id: 'flag' }, x: holeX + 24, y: holeY - 4, r: 2, sprite: 'drapeau', amp: 0 });
  final.sort((a, b) => a.y - b.y);

  const counts = {};
  for (const o of final) if (!o.deco) counts[o.def.id] = (counts[o.def.id] || 0) + 1;
  return {
    seed, weather, legend, len, holeY, holeX, Lx, Rx, objects: final, counts,
    windPh: [rng.range(0, 6.28), rng.range(0, 6.28)],
    events: generateEvents(seed, holeY, day),
  };
}

// --- Événements surprise -----------------------------------------------------
// Tirés au sort avec la dune (graine à part pour ne pas changer les objets) :
// mêmes événements, au même endroit, pour tout le monde. Annoncés juste avant.
// name : grande alerte (court, écrit en gros) ; hint : précision en petit
const EVENTS = {
  mirror: { name: 'INVERSION !', hint: 'GAUCHE ET DROITE INVERSEES', dur: 5 },
  camels: { name: 'CHAMEAUX !', hint: 'UN TROUPEAU TRAVERSE', dur: 0 },
  tornado: { name: 'TORNADE !', hint: 'TIENS BON TA BOULE', dur: 3.5 },
  kevin: { name: 'KEVIN !', hint: 'IL ARRIVE EN TROTTINETTE', dur: 3 },
  meeting: { name: 'MESSAGE !', hint: 'UNE POP-UP VA TE GENER', dur: 3.5 },
  poop: { name: 'CROTTES !', hint: 'IL EN PLEUT : MIAM', dur: 0 },
  quake: { name: 'SEISME !', hint: 'LE SOL TREMBLE', dur: 3 },
  mirage: { name: 'MIRAGE ?', hint: 'UN DES DEUX TERRIERS EST FAUX', dur: 0 },
  // à partir du 2 novembre 2026 (avant, les dunes restent identiques)
  power: { name: 'COUPURE !', hint: 'PLUS DE COURANT : TIENS LE CAP', dur: 2.5, from: NEW_EVENTS_FROM },
  copier: { name: 'PHOTOCOPIEUSE !', hint: 'TOUT EN DOUBLE DEVANT TOI', dur: 0, from: NEW_EVENTS_FROM },
  coffee: { name: 'PAUSE CAFE !', hint: 'ATTRAPE LES TASSES : TURBO', dur: 0, from: NEW_EVENTS_FROM },
  alarm: { name: 'ALARME INCENDIE !', hint: 'MOUSSE GLISSANTE DEVANT', dur: 0, from: NEW_EVENTS_FROM },
  chaser: { name: 'SCORPION !', hint: 'IL TE POURSUIT : ESQUIVE', dur: 5, from: NEW_EVENTS_FROM },
  magnet: { name: 'AIMANT !', hint: 'LES PETITS OBJETS VIENNENT A TOI', dur: 4, from: NEW_EVENTS_FROM },
  // semaine Halloween : une fois par dune, en plus des autres
  spooky: { name: 'FANTÔMES !', hint: 'ATTENTION !', dur: 4, season: 'halloween' },
};
// Événements tirables ce jour-là
const eventKinds = day => Object.keys(EVENTS).filter(k => k !== 'mirage' && !EVENTS[k].season && (!EVENTS[k].from || day >= EVENTS[k].from));
const CAFE = { id: 'cafe', name: 'Café', sprite: 'cafe', r: 2.5, boost: true, glow: true };
// Un objet se mange s'il est assez petit par rapport à la boule (sauf obstacles indestructibles)
function edible(o, b) { return !o.def.hazard && (o.def.legendary || o.r <= b.r * 0.8); }

function generateEvents(seed, holeY, day) {
  const rng = makeRng((seed ^ 0x5eed1e) >>> 0);
  const pool = eventKinds(day), n = rng.int(2, 3), evs = [];
  for (let i = 0; i < n; i++) {
    const type = pool.splice(rng.int(0, pool.length - 1), 1)[0];
    evs.push({ type, y: Math.round(holeY * (0.18 + (i + rng.range(0.15, 0.85)) * 0.6 / n)), seed: rng.int(1, 1e6) });
  }
  if (rng.chance(0.35)) evs.push({ type: 'mirage', y: holeY - 650, seed: rng.int(1, 1e6) });
  if (isHalloween(day)) {
    // fantômes : là où ils gênent le moins les autres événements
    const hr = makeRng(hashStr(day + '|spooky'));
    let best = 0, bestGap = -1;
    for (let k = 0; k < 8; k++) {
      const y = Math.round(holeY * hr.range(0.25, 0.75)), gap = Math.min(...evs.map(e => Math.abs(e.y - y)), 9999);
      if (gap > bestGap) { bestGap = gap; best = y; }
    }
    evs.push({ type: 'spooky', y: best, seed: hr.int(1, 1e6) });
  }
  return evs;
}

// --- La Grande Fuite (mode survie) -------------------------------------------------
// Dune sans fin qui accélère ; la taille de la boule sert de vie (sous 10 cm,
// c'est perdu) et elle fond avec la faim. Halte tous les 250 m : 1 bonus au choix
// parmi 3. Objets propres au mode (hors Bousipédia) :
const SURV_OBJ = {
  pics: { id: 'pics', name: 'Pics', sprite: 'pics', r: 5, hazard: true, prickly: true },
  baril: { id: 'baril', name: 'Baril toxique', sprite: 'baril', r: 6, hazard: true },
  tube: { id: 'tube', name: 'Tube à essai', sprite: 'tube', r: 3, pickup: true, glow: true },
};
const SURV = {
  len: 120000,           // 12 km de dune
  startArea: 100,        // boule de départ : 40 cm
  deathArea: START_AREA, // sous la taille de départ du mode classique (10 cm) : perdu
  haltEvery: 2500,       // 250 m
};

function survivalConfig() {
  const seed = ((Math.random() * 1e9) >>> 0) || 1, rng = makeRng(seed);
  const weather = rng.pick(WEATHERS.filter(w => w.id !== 'nuit'));
  return { seed, weather, legend: LEGENDS[0], course: generateSurvivalCourse(seed, weather), quests: [], mode: 'survival' };
}

function generateSurvivalCourse(seed, weather) {
  const rng = makeRng(seed), len = SURV.len;
  const p = [0, 0, 0, 0].map(() => rng.range(0, Math.PI * 2));
  const Lx = new Float32Array(len), Rx = new Float32Array(len);
  for (let y = 0; y < len; y++) {
    const cx = W / 2 + 24 * Math.sin(y * 0.0021 + p[0]) + 10 * Math.sin(y * 0.0057 + p[1]);
    // la dune se resserre un peu avec la distance
    let hw = Math.max(48, 74 - y / 2500) + 12 * Math.sin(y * 0.0033 + p[2]) + 5 * Math.sin(y * 0.011 + p[3]);
    if (y < 300) hw = lerp(76, hw, y / 300);
    Lx[y] = Math.max(5, cx - hw); Rx[y] = Math.min(W - 5, cx + hw);
  }
  const types = OBJECTS.filter(o => !o.weather || o.weather === weather.id);
  const objs = [], recent = [];
  const mk = (def, x, y, r, sprite) => {
    const o = { def, x, x0: x, y, r, sprite: sprite || def.sprite, dead: false, hitT: -9, phase: rng.range(0, 6.28), amp: 0, w: 0 };
    if (def.move === 'side') { o.amp = rng.range(8, 18); o.w = rng.range(1.2, 2.4); }
    if (def.move === 'slow') { o.amp = rng.range(4, 8); o.w = rng.range(0.3, 0.5); }
    return o;
  };
  const place = o => {
    for (const q of recent) if (Math.hypot(q.x - o.x, q.y - o.y) < q.r + o.r + 3 + q.amp + o.amp) return false;
    objs.push(o); recent.push(o); if (recent.length > 12) recent.shift();
    return true;
  };
  let y = 220, nextTube = 1800;
  while (y < len - 300) {
    // t : taille des objets (grossit sur les 1 600 premiers mètres) ; danger : part d'obstacles
    const t = Math.min(1, y / 16000), danger = Math.min(1, y / 30000);
    y += rng.range(6, 12) * (1 + t * 0.4);
    const L = Lx[y | 0], R = Rx[y | 0];
    if (y > nextTube) { nextTube += rng.range(1600, 2800); place(mk(SURV_OBJ.tube, rng.range(L + 14, R - 14), y, 3)); continue; }
    if (y > 1500 && rng.chance(0.015 + danger * 0.05)) {
      const def = rng.chance(0.5) ? SURV_OBJ.pics : SURV_OBJ.baril;
      place(mk(def, rng.range(L + 10, R - 10), y, def.r)); continue;
    }
    let tot = 0;
    const ws = types.map(o => { const w = o.w * Math.exp(-(((Math.max(t, 0.05) - o.tp) / (o.s + 0.15)) ** 2)) * (o.prickly || o.rock ? 1 + danger * 2 : 1); tot += w; return w; });
    let pick = rng.next() * tot, def = types[0];
    for (let i = 0; i < types.length; i++) { pick -= ws[i]; if (pick <= 0) { def = types[i]; break; } }
    let o;
    if (def.rock) {
      const want = clamp(3 + t * 14 + rng.range(-4, 6) + danger * 4, 3, 20);
      const Rr = ROCK_SIZES.reduce((a, b) => Math.abs(b - want) < Math.abs(a - want) ? b : a);
      o = mk(OBJ.rocher, rng.range(L + 8, R - 8), y, Rr * 0.9, `rock_${Rr}_${rng.int(0, 1)}`);
    } else o = mk(def, rng.range(L + 8, R - 8), y, def.r);
    o.x = o.x0 = clamp(o.x, L + o.r + o.amp + 2, R - o.r - o.amp - 2);
    place(o);
  }
  objs.sort((a, b) => a.y - b.y);
  // événements surprise réguliers (sans mirage : il n'y a pas de terrier)
  const evs = [], kinds = eventKinds(dayKey());
  for (let ey = 3200; ey < len - 1000; ey += rng.range(2600, 4200)) evs.push({ type: rng.pick(kinds), y: Math.round(ey), seed: rng.int(1, 1e6) });
  return {
    seed, weather, legend: LEGENDS[0], len, holeY: len + 5000, holeX: W / 2, Lx, Rx, objects: objs, counts: {},
    windPh: [rng.range(0, 6.28), rng.range(0, 6.28)], events: evs,
  };
}
