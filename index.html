  async scr_leaderboard() {
    const tab = this.lbTab, me = this.p.name, champ = await Leaderboard.champion(this.today);
    const who = name => `${esc(name)}${name === champ ? ' 👑' : ''}`;
    let body = '', extra = '';
    if (tab === 'day') {
      const lb = await Leaderboard.day(this.today);
      const rx = lb.online ? await Online.reactions(this.today) : null;
      const rxTxt = id => { const c = rx && rx.counts[id]; return c ? `<span class="rx">${REACTIONS.filter(e => c[e]).map(e => e + c[e]).join(' ')}</span>` : ''; };
      body = lb.length ? lb.map((e, i) => {
        const pick = rx && e.name !== me;
        let row = `<tr class="${e.name === me ? 'me' : ''} ${pick ? 'pick' : ''}" ${pick ? `data-a="reactsel" data-v="${esc(e.id)}"` : ''}><td>${medal(i)}</td><td>${who(e.name)}${rxTxt(e.id)}${pick && !rx.mine[e.id] ? '<span class="rx-add">+👏</span>' : ''}</td><td>${e.run && e.run.terrier ? '🕳️' : ''}${e.run && e.run.legend ? '✨' : ''}</td><td class="r">${fmtSize(e.score)}</td></tr>`;
        if (pick && this.reactSel === e.id) row += `<tr><td colspan="4"><div class="reacts">${REACTIONS.map(r => `<button class="${rx.mine[e.id] === r ? 'on' : ''}" data-a="react" data-v="${r}">${r}</button>`).join('')}</div></td></tr>`;
        return row;
      }).join('') : '<tr><td colspan="4" class="center tiny">Personne n\'a encore joué aujourd\'hui.</td></tr>';
      const titles = dayTitles(lb);
      if (titles.length) extra = `<div class="panel"><div class="label">Titres du jour</div><table class="lb titles">${titles.map(t => `<tr><td>${t.icon}</td><td>${esc(t.label)}</td><td>${who(t.name)}</td><td class="r tiny">${esc(t.value)}</td></tr>`).join('')}</table></div>`;
      if (rx && lb.some(e => e.name !== me)) extra += '<div class="tiny center">Touche la ligne d\'un collègue pour lui envoyer une réaction 👏 😂 💩 🔥</div>';
    } else if (tab === 'week') {
      const lb = await Leaderboard.week(weekKey(this.today));
      body = lb.length ? lb.map((e, i) => `<tr class="${e.name === me ? 'me' : ''}"><td>${medal(i)}</td><td>${who(e.name)}</td><td class="tiny ${e.played >= WEEK_BEST ? 'good' : ''}">${Math.min(e.played, WEEK_BEST)}/${WEEK_BEST}</td><td class="r">${fmtSize(e.total)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="center tiny">Rien cette semaine.</td></tr>';
      extra = `<div class="tiny center">Semaine = tes ${WEEK_BEST} meilleurs jours additionnés. Le vainqueur porte la 👑 toute la semaine suivante ; le podium gagne ${PODIUM_COINS.join(' / ')} 🟡.</div>`;
      const pod = await Leaderboard.podium(addDays(weekKey(this.today), -7));
      if (pod && pod.top.length) extra += `<div class="panel"><div class="label">Podium de la semaine dernière <span class="tiny">(${fmtWeek(pod.wk)})</span></div>
        <table class="lb">${pod.top.map((e, i) => `<tr class="${e.name === me ? 'me' : ''}"><td>${medal(i)}</td><td>${esc(e.name)}${i === 0 ? ' 👑' : ''}</td><td class="tiny gold">+${PODIUM_COINS[i]} 🟡</td><td class="r">${fmtSize(e.total)}</td></tr>`).join('')}</table></div>`;
      extra += '<button class="btn ghost" data-a="go" data-v="palmares">📜 Palmarès des champions</button>';
    } else if (tab === 'teams') {
      const lb = await Leaderboard.teams(weekKey(this.today)), mine = nameKey(this.p.team || '');
      body = lb.length ? lb.map((e, i) => `<tr class="${nameKey(e.team) === mine ? 'me' : ''}"><td>${medal(i)}</td><td>${esc(e.team)}</td><td class="tiny">${e.players} j.</td><td class="r">${fmtSize(e.avg)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="center tiny">Aucune équipe cette semaine.</td></tr>';
      extra = `<div class="tiny center">Moyenne par joueur sur la semaine. ${this.p.team ? '' : 'Rejoins une équipe depuis ton profil 👤.'}</div>`;
    } else if (tab === 'surv') {
      const lb = (await Online.survivalTop()) || [];
      body = lb.length ? lb.map((e, i) => `<tr class="${e.name === me ? 'me' : ''}"><td>${medal(i)}</td><td>${who(e.name)}</td><td></td><td class="r">${e.best} m</td></tr>`).join('')
        : '<tr><td colspan="4" class="center tiny">Personne n\'a encore tenté La Grande Fuite.</td></tr>';
      extra = '<div class="tiny center">La Grande Fuite : le plus long parcours de chacun.</div>';
    } else {
      const lb = await Leaderboard.records();
      extra = '<div class="tiny center">Records = ta meilleure boule de tous les temps · 🔥 ta plus longue série · ✨ trésors trouvés.</div>';
      body = lb.map((e, i) => `<tr class="${e.name === me ? 'me' : ''}"><td>${medal(i)}</td><td>${who(e.name)}</td><td class="tiny">🔥${e.bestStreak} ✨${e.legends}</td><td class="r">${fmtSize(e.best)}</td></tr>`).join('');
    }
    const tabs = [['day', 'Jour'], ['week', 'Semaine'], ...(TEAMS_ON ? [['teams', 'Équipes']] : []), ['all', 'Records'], ...(SURVIVAL_ON ? [['surv', 'Survie']] : [])]
      .map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-a="lbtab" data-v="${k}">${l}</button>`).join('');
    return `<div class="screen">
      ${this.back('Classement')}
      <div class="tabs">${tabs}</div>
      <div class="panel"><table class="lb">${body}</table></div>
      ${extra}
      <div class="tiny center">${Online.live ? 'Classement en ligne : tous les joueurs.' : 'Hors ligne : classement des joueurs de cet appareil.'}</div>
    </div>`;
  },

  // Nouvelles depuis la dernière visite : qui m'a dépassé, mon rang d'hier
  async news(lb) {
    const p = this.p, key = `bousier_seen_${ONLINE_ENV}_${nameKey(p.name)}`;
    if (!lb.online) return '';
    const i = lb.findIndex(e => e.name === p.name), above = i < 0 ? [] : lb.slice(0, i).map(e => e.name);
    let prev = null;
    try { prev = JSON.parse(safeStorageGet(key) || 'null'); } catch (e) { prev = null; }
    safeStorageSet(key, JSON.stringify({ day: this.today, above, rank: i + 1 }));
    if (!prev) return '';
    if (prev.day === this.today) {
      // seulement si j'étais déjà classé à ma dernière visite
      const fresh = i < 0 || !prev.rank ? [] : above.filter(n => !prev.above.includes(n));
      if (fresh.length === 1) return `😈 ${fresh[0]} t'a dépassé !`;
      if (fresh.length > 1) return `😈 ${fresh.slice(0, 2).join(' et ')}${fresh.length > 2 ? '…' : ''} t'ont dépassé !`;
      return '';
    }
    const y = await Online.day(addDays(this.today, -1));
    const r = y ? y.findIndex(e => e.name === p.name) + 1 : 0;
    return r ? `📰 Hier, tu as fini ${r}${r === 1 ? 'er' : 'e'} sur ${y.length}.` : '';
  },

  scr_collection() {
    const p = this.p;
    const obj = o => ({ id: o.id, name: o.name, sprite: o.rock ? 'rock_6_0' : o.sprite, desc: o.desc, n: p.collection[o.id] || 0, wx: o.weather, season: o.season });
    const leg = l => ({ id: l.id, name: l.name, sprite: l.sprite, desc: l.desc, n: p.legends[l.id] || 0, legend: true, season: l.season });
    const list = OBJECTS.map(obj), legs = LEGENDS.map(leg);
    // objets de saison : à part, ils ne comptent pas pour compléter la Bousipédia
    const seasonal = SEASON_OBJECTS.map(obj).concat(leg(SUGAR_SKULL)).filter(e => e.n || isHalloween(this.today));
    const classic = list.concat(legs), all = classic.concat(seasonal);
    const sel = all.find(e => e.id === this.colSel && e.n > 0);
    const tile = e => `<button class="tile ${e.n ? '' : 'locked'} ${e.legend ? 'leg' : ''} ${this.colSel === e.id ? 'sel' : ''}" data-a="colsel" data-v="${e.id}">
        ${spriteImg(e.sprite, SPR[e.sprite].width > 20 ? 1 : 2, !e.n)}
        <span>${e.n ? esc(e.name) : '???'}</span></button>`;
    const hint = e => e.season ? '🎃 Semaine Halloween' : e.wx ? `Seulement par météo ${WEATHER[e.wx].icon}` : e.legend ? 'Trésor du jour' : '';
    const selEntry = all.find(e => e.id === this.colSel);
    return `<div class="screen">
      ${this.back('Bousipédia')}
      <div class="tiny center">${classic.filter(e => e.n).length} / ${classic.length} découverts</div>
      ${selEntry ? `<div class="panel detail">
        <div>${spriteImg(selEntry.sprite, 3, !sel)}</div>
        <div><b>${sel ? esc(sel.name) : '???'}</b><div class="tiny">${sel ? esc(sel.desc) : 'Pas encore découvert.'}</div>
        <div class="tiny">${sel ? `Avalé ${sel.n} fois` : ''} ${esc(hint(selEntry))}</div></div>
      </div>` : ''}
      <div class="label">Objets</div>
      <div class="grid">${list.map(tile).join('')}</div>
      <div class="label">Trésors légendaires</div>
      <div class="grid">${legs.map(tile).join('')}</div>
      ${seasonal.length ? `<div class="label">🎉 Objets de saison <span class="tiny">(ne comptent pas pour compléter la Bousipédia)</span></div>
      <div class="tiny">🎃 Halloween 2026 · ${seasonal.filter(e => e.n).length} / ${seasonal.length}</div>
      <div class="grid">${seasonal.map(tile).join('')}</div>` : ''}
    </div>`;
  },

  scr_shop() {
    const p = this.p, type = this.shopTab;
    // les secrets n'apparaissent qu'une fois obtenus
    const items = COSMETICS[type].filter(it => (!it.secret || Store.owns(p, type, it)) && (!it.survival || SURVIVAL_ON)
      && (!it.season || isHalloween(this.today) || Store.owns(p, type, it)));
    const eq = t => findCos(t, p.equip[t]);
    const prev = this.shopSel ? findCos(type, this.shopSel) : null;
    const look = t => type === t && prev ? prev : eq(t);
    const mascot = (skin, hat, outfit, trail, R, scale) => {
      const w = R * 2 + 16, h = R * 2 + 18 + (trail.fx ? 14 : 0);
      return pix(mascotUrl(skin, hat, R, outfit, trail), w * scale, h * scale);
    };
    const swatch = (t, k) => pix(imgUrl('th_' + t.id, () => themeSwatch(t)), 36 * k, 22 * k);
    const tileImg = it => type === 'theme' ? swatch(it, 1.5)
      : mascot(type === 'ball' ? it : eq('ball'), type === 'hat' ? it : HATS[0], type === 'outfit' ? it : OUTFITS[0], type === 'trail' ? it : TRAILS[0], 8, 1.2);
    const status = it => {
      if (p.equip[type] === it.id) return '<span class="good">Équipé</span>';
      if (Store.owns(p, type, it)) return 'Possédé';
      if (it.badge) return `🔒 ${BADGES.find(b => b.id === it.badge).icon}`;
      if (it.price) return `🟡 ${it.price}`;
      if (it.mystery) return '❓ Mystère';
      if (it.prog) { const [a, b] = it.prog(p); return `🔒 ${Math.min(a, b)}/${b}`; }
      return '🔒';
    };
    const tile = it => {
      const owned = Store.owns(p, type, it);
      return `<button class="tile shop ${p.equip[type] === it.id ? 'sel' : ''} ${owned ? '' : 'locked-soft'} ${this.shopSel === it.id ? 'sel2' : ''}" data-a="shopitem" data-v="${it.id}">${tileImg(it)}<span>${esc(it.name)}</span><span class="tiny">${status(it)}</span></button>`;
    };
    let bar = '';
    if (prev) {
      if (prev.badge) { const b = BADGES.find(x => x.id === prev.badge); bar = `<div class="panel tiny">🔒 Se débloque avec le badge ${b.icon} <b>${esc(b.name)}</b> : ${esc(b.desc)}</div>`; }
      else if (prev.price) bar = `<button class="btn big" data-a="buy" ${p.coins < prev.price ? 'disabled' : ''}>Acheter ${esc(prev.name)} — ${prev.price} 🟡</button>${p.coins < prev.price ? `<div class="tiny center">Il te manque ${prev.price - p.coins} 🟡</div>` : ''}`;
      else if (prev.mystery) bar = `<div class="panel tiny">❓ <b>${esc(prev.name)}</b> : comment l'obtenir ? Mystère… Un indice : <i>${esc(prev.mystery)}</i></div>`;
      else if (prev.prog) { const [a, b] = prev.prog(p); bar = `<div class="panel tiny">🔒 <b>${esc(prev.name)}</b> : ${esc(prev.text)} (${Math.min(a, b)}/${b})</div>`; }
    }
    const tabs = [['ball', 'Boules'], ['hat', 'Chapeaux'], ['outfit', 'Tenues'], ['trail', 'Traînées'], ['theme', 'Décors']]
      .map(([k, l]) => `<button class="tab ${type === k ? 'on' : ''}" data-a="shoptab" data-v="${k}">${l}</button>`).join('');
    const found = Object.keys(COSMETICS).reduce((n, t) => n + COSMETICS[t].filter(it => it.secret && Store.owns(p, t, it)).length, 0);
    return `<div class="screen">
      ${this.back('Style')}
      <div class="topbar end"><span class="chip gold">🟡 ${p.coins}</span></div>
      <div class="mascot">${type === 'theme' ? swatch(prev || eq('theme'), 3) : '<canvas id="preview" width="64" height="84" class="pix" style="width:calc(var(--u)*96);height:calc(var(--u)*126)"></canvas>'}</div>
      ${bar}
      <div class="tabs">${tabs}</div>
      <div class="grid three">${items.map(tile).join('')}</div>
      <div class="tiny center">Gagne des 🟡 en jouant, en finissant les quêtes et en trouvant les trésors. Certains objets se méritent autrement…</div>
      <div class="tiny center">🤫 Secrets trouvés : ${found} / ${SECRET_COUNT}</div>
    </div>`;
  },

  scr_badges() {
    const p = this.p;
    return `<div class="screen">
      ${this.back('Badges')}
      <div class="tiny center">${Object.keys(p.badges).length} / ${BADGES.length} obtenus</div>
      <div class="badges">${BADGES.map(b => `<div class="panel bdg ${p.badges[b.id] ? '' : 'locked'}">
        <div class="bico">${b.icon}</div><div><b>${esc(b.name)}</b>${b.id === 'champion' && p.counters.champion ? ` <span class="gold">×${p.counters.champion}</span>` : ''}<div class="tiny">${esc(b.desc)}</div>
        ${b.reward ? `<div class="tiny gold">Récompense : ${esc(b.reward)}</div>` : ''}</div></div>`).join('')}</div>
    </div>`;
  },

  async scr_profile() {
    const p = this.p, cur = p.name;
    const list = Object.keys(Store.data.profiles).map(n => `<button class="btn ${n === cur ? '' : 'ghost'}" data-a="switchp" data-v="${esc(n)}">${n === cur ? '✔ ' : ''}${esc(n)}</button>`).join('');
    // équipes connues, pour les proposer à la saisie
    const recs = TEAMS_ON ? await Leaderboard.records() : [];
    this.knownTeams = [...new Map(recs.filter(e => e.team).map(e => [nameKey(e.team), e.team])).values()];
    const account = p.account
      ? '<div class="good">🔒 Connecté. Pour jouer sur un autre téléphone, mets ton pseudo et ton mot de passe.</div>'
      : `<p>Choisis un mot de passe : sans lui, tu perds ton pseudo si tu changes de téléphone ou réinstalles le jeu.</p>
        <input id="spass" type="password" minlength="6" placeholder="Mot de passe (6 caractères min.)" autocomplete="new-password" onkeydown="if(event.key==='Enter')App.doSecure()">
        <div class="tiny bad form-err"></div>
        <button class="btn" data-a="secure">🔒 Choisir mon mot de passe</button>`;
    return `<div class="screen">
      ${this.back('Profil')}
      <div class="panel">
        <div class="label">Mon compte</div>
        ${account}
      </div>
      ${TEAMS_ON ? `<div class="panel">
        <div class="label">Mon équipe</div>
        <input id="team" maxlength="14" placeholder="Ex. : Compta, Marketing…" value="${esc(p.team || '')}" list="teams">
        <datalist id="teams">${this.knownTeams.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
        <button class="btn" data-a="saveteam">Enregistrer</button>
      </div>` : ''}
      <div class="panel">
        <div class="label">Joueurs de cet appareil</div>
        <div class="col">${list}</div>
        <button class="btn ghost" data-a="go" data-v="name">➕ Autre joueur ou autre compte</button>
      </div>
      <div class="panel">
        <button class="btn ghost" data-a="sound">${Sound.on ? '🔊 Son activé' : '🔇 Son coupé'}</button>
        <div class="tiny">Commandes : glisse ton doigt (ou la souris) à gauche/droite. Clavier : ← → ou Q/D. Pause : Échap.</div>
      </div>
      ${p.account ? '<button class="btn ghost" data-a="logout">🚪 Se déconnecter</button>' : ''}
    </div>`;
  },
};

// Titres comiques du jour, d'après la meilleure partie de chacun
const COPYRIGHT = '<div class="copy">© 2026 zodiacfbo · Tous droits réservés</div>';

function dayTitles(lb) {
  const runs = lb.filter(e => e.run);
  if (runs.length < 2) return [];
  const top = f => {
    let best = null;
    for (const e of runs) { const v = f(e.run); if (v > 0 && (!best || v > best.v)) best = { name: e.name, v }; }
    return best;
  };
  // titres liés au terrier : sur les 3 essais du jour de chacun
  const tries = lb.filter(e => e.runs && e.runs.length);
  const low = f => {
    let best = null;
    for (const e of tries) for (const r of e.runs) { const v = f(r); if (v != null && (!best || v < best.v)) best = { name: e.name, v }; }
    return best;
  };
  const most = f => {
    let best = null;
    for (const e of tries) { const v = f(e.runs); if (v > 0 && (!best || v > best.v)) best = { name: e.name, v }; }
    return best;
  };
  const missed = most(rs => rs.filter(r => !r.terrier).length);
  return [
    ['🎯', 'Dans le mille', low(r => r.terrier && r.holeOff != null ? r.holeOff : null), v => `${Math.round(100 - v / HOLE_TOL * 100)} %`, 'bullseye'],
    ['🙈', 'Raté de peu', low(r => !r.terrier && r.missBy != null ? r.missBy : null), v => v < 2 ? 'd\'un cheveu' : v < 6 ? 'de très peu' : 'de peu', 'close'],
    ['🕳️', 'Le terrier, c\'est pour les autres', missed && missed.v >= 2 ? missed : null, v => v + ' ratés', 'nohole'],
    ['🐢', 'Le plus lent', top(r => r.time), v => fmtTime(v), 'slow'],
    ['💥', 'Roi des chocs', top(r => (r.bumps || 0) + (r.wallHits || 0)), v => v + ' chocs', 'bumps'],
    ['🧲', 'L\'aspirateur', top(r => r.absorbed), v => v + ' objets', 'vacuum'],
    ['🌵', 'L\'ami des cactus', top(r => r.pricks || 0), v => v + ' piqûre' + (v > 1 ? 's' : ''), 'cactus'],
  ].filter(t => t[2]).map(([icon, label, b, fmt, key]) => ({ icon, label, key, name: b.name, value: fmt(b.v) }));
}

function medal(i) { return ['🥇', '🥈', '🥉'][i] || (i + 1) + '.'; }
