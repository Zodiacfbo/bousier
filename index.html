function lowerBound(arr, y) {
  let lo = 0, hi = arr.length;
  while (lo < hi) { const m = (lo + hi) >> 1; if (arr[m].y < y) lo = m + 1; else hi = m; }
  return lo;
}

// --- Le jeu -----------------------------------------------------------------
class Game {
  constructor(canvas, hooks) {
    this.cv = canvas; this.ctx = canvas.getContext('2d');
    this.hooks = hooks || {};
    this.state = 'idle'; this.paused = false;
    this.input = { targetX: null, keys: 0 };
    this.acc = 0; this.last = 0; this.frame = 0;
    this.particles = []; this.texts = []; this.fx = [];
    this.resize(320);
    requestAnimationFrame(ts => this.loop(ts));
  }

  resize(H) {
    this.H = H; this.cv.width = W; this.cv.height = H;
    this.ctx.imageSmoothingEnabled = false;
    this.img = this.ctx.createImageData(W, H);
    this.buf = new Uint32Array(this.img.data.buffer);
    this.initFx();
  }

  setPalette(theme, weather) {
    const tint = weather && weather.id === 'pluie' ? ['#34466e', 0.2] : weather && weather.id === 'canicule' ? ['#ff8a30', 0.1] : null;
    const conv = h => { let c = hexToRgb(h); if (tint) c = mixRgb(c, hexToRgb(tint[0]), tint[1]); return pack(c); };
    this.pal = {};
    for (const k of ['sand', 'sandDark', 'sandLight', 'wall', 'wallDark', 'wallLight']) this.pal[k] = conv(theme[k]);
    this.theme = theme;
  }

  // Écran d'accueil : la dune défile doucement derrière les menus
  showAttract(config, theme) {
    this.state = 'attract'; this.paused = false;
    this.course = config.course; this.objs = config.course.objects.map(o => ({ ...o }));
    this.wx = config.weather; this.setPalette(theme, config.weather);
    this.camY = 0; this.t = 0; this.particles = []; this.texts = [];
    this.initFx();
  }

  start(config, opts) {
    this.config = config; this.course = config.course;
    this.objs = config.course.objects.map(o => ({ ...o }));
    this.wx = config.weather; this.opts = opts;
    this.skin = opts.skin; this.hat = opts.hat; this.specks = genSpecks(opts.skin);
    this.outfit = opts.outfit || null; this.trail = opts.trail && opts.trail.fx ? opts.trail : null; this.trailPts = [];
    this.setPalette(opts.theme, config.weather);
    this.surv = config.mode === 'survival' ? { dist: 0, nextHalt: SURV.haltEvery, fx: {}, shields: 0, hunger: 1, speedPact: 1, allies: [], taken: [] } : null;
    this.minArea = this.surv ? 0 : START_AREA;
    this.ghosts = (opts.ghosts || []).filter(g => g.ghost && g.ghost.x).slice(0, 3);
    for (const g of this.ghosts) g.passed = false;
    const startX = (this.course.Lx[60] + this.course.Rx[60]) / 2;
    const area0 = this.surv ? SURV.startArea : START_AREA;
    this.ball = { x: startX, y: 60, vx: 0, vy: 0, area: area0, r: Math.sqrt(area0), roll: 0, lastWall: -9, lastHurt: -9, stuck: [], scale: 1, anim: 0 };
    this.input.targetX = null;
    this.run = { absorbed: 0, byType: {}, bumps: 0, pricks: 0, wallHits: 0, terrier: false, legend: false, finished: false, time: 0, sizeCm: 0, score: 0 };
    this.rec = { x: [], y: [], r: [] };
    this.t = 0; this.playTicks = 0; this.phase = 'count'; this.countT = 3.2; this.lastCount = 4;
    this.evs = (this.course.events || []).map(e => ({ ...e }));
    this.resetEvents(); this.lastSay = -9;
    this.shake = 0; this.particles = []; this.texts = [];
    this.eatable = new Set(OBJECTS.filter(o => o.r <= this.ball.r * 0.8).map(o => o.id));
    this.state = 'run'; this.paused = false; this.phaseT = 0; this.hint = !!opts.hint;
    this.initFx();
  }

  windAt(t) {
    if (!this.wx.wind) return 0;
    const [a, b] = this.course.windPh;
    return this.wx.wind * (0.65 * Math.sin(t * 0.55 + a) + 0.35 * Math.sin(t * 1.7 + b));
  }

  edge(y) { const i = clamp(y | 0, 0, this.course.len - 1); return [this.course.Lx[i], this.course.Rx[i]]; }

  objX(o) { return o.amp ? o.x0 + Math.sin(this.t * o.w + o.phase) * o.amp : o.x; }

  loop(ts) {
    requestAnimationFrame(t => this.loop(t));
    const dt = Math.min(0.1, (ts - (this.last || ts)) / 1000); this.last = ts;
    if (!this.paused) {
      this.acc += dt;
      let n = 0;
      while (this.acc >= TICK && n < 6 && !this.paused) { this.step(); this.acc -= TICK; n++; }
      if (n === 6) this.acc = 0;
    }
    this.render();
    this.frame++;
  }

  // ------------------------------------------------------------------------
  step() {
    this.updateFx();
    if (this.state === 'attract') {
      this.t += TICK; this.camY += 26 * TICK;
      if (this.camY > this.course.holeY - this.H) this.camY = 0;
      this.updateParticles();
      return;
    }
    if (this.state !== 'run') return;
    const b = this.ball;
    this.t += TICK; this.phaseT += TICK;
    if (this.phase === 'count') {
      this.countT -= TICK;
      const c = Math.ceil(this.countT);
      if (c !== this.lastCount && c > 0) { this.lastCount = c; Sound.play('count'); }
      if (this.countT <= 0) { this.phase = 'play'; Sound.play('go'); this.notice('ROULE !', '#fff4a8', 1, 2); }
      this.updateParticles();
      return;
    }
    if (this.phase === 'play') this.stepPlay(b);
    else if (this.phase === 'hole') {
      const k = clamp(this.phaseT / 0.9, 0, 1);
      b.x = lerp(b.x, this.course.holeX, 0.15); b.y = lerp(b.y, this.course.holeY, 0.15);
      b.scale = 1 - k;
      if (this.frame % 3 === 0) this.burst(b.x, b.y, 2, [this.theme.sandLight, '#fff4a8'], 40);
      if (this.phaseT > 1.5) this.finish();
    } else if (this.phase === 'miss') {
      b.vy *= 0.9; b.vx *= 0.9; b.y += b.vy * TICK; b.x += b.vx * TICK;
      if (this.phaseT > 1.4) this.finish();
    }
    this.updateParticles();
    if (this.shake > 0) this.shake = Math.max(0, this.shake - TICK * 12);
  }

  stepPlay(b) {
    const wx = this.wx, r = b.r;
    this.playTicks++; this.run.time += TICK;
    if (this.input.keys) this.input.targetX = clamp((this.input.targetX == null ? b.x : this.input.targetX) + this.input.keys * 150 * TICK, 0, W);
    let target = this.input.targetX == null ? b.x : this.input.targetX;
    if (this.mirror) target = 2 * b.x - target;
    const maxLat = Math.max(42, 150 - r * 3.4);
    const desired = clamp((target - b.x) * 7, -maxLat, maxLat);
    const foamy = this.foam && b.y > this.foam.y0 && b.y < this.foam.y1;
    const acc = 900 / (1 + r * 0.09) * (wx.grip || 1) * (foamy ? 0.2 : 1);
    if (this.coffeeT > 0) { this.coffeeT -= TICK; if (this.frame % 3 === 0) this.particles.push({ x: b.x + (Math.random() - 0.5) * 4, y: b.y - b.r - 2, vx: (Math.random() - 0.5) * 10, vy: -30, g: 0, life: 0.4, col: '#ffffff', s: 1 }); }
    if (this.siren > 0) this.siren -= TICK;
    if (this.blackout) this.blackout += TICK;
    b.vx += clamp(desired - b.vx, -acc * TICK, acc * TICK);
    const vyT = (46 + r * 2.3) * (wx.speed || 1) * (this.surv ? this.survSpeed() : 1) * (this.coffeeT > 0 ? 1.4 : 1);
    b.vy += clamp(vyT - b.vy, -150 * TICK, 45 * TICK);
    b.x += (b.vx + this.windAt(this.t)) * TICK;
    b.y += b.vy * TICK;
    if (this.surv) this.stepSurvival(b);
    b.roll += b.vy * TICK / Math.max(2, r);
    b.anim += b.vy * TICK * 0.12;
    if (wx.shrink) b.area = Math.max(this.minArea, b.area - wx.shrink * TICK * (1 + r * 0.06));
    this.updateEvents(b);
    this.updateKevins(b);
    if (this.trail) {
      if (this.trail.fx === 'rainbow') { this.trailPts.push({ x: b.x, y: b.y - b.r - 8 }); if (this.trailPts.length > 45) this.trailPts.shift(); }
      else emitTrail(this, this.trail, b);
    }
    // les gouttes rebondissent sur le parapluie
    if (this.hat && this.hat.id === 'parapluie' && wx.id === 'pluie' && this.frame % 4 === 0)
      this.particles.push({ x: b.x + (Math.random() - 0.5) * 9, y: b.y - b.r - 10, vx: (Math.random() - 0.5) * 50, vy: -35, g: 260, life: 0.3, col: '#dce8ff', s: 1 });

    // bords de la dune
    const [L, R] = this.edge(b.y);
    if (R - L < 2 * r) b.x = (L + R) / 2;
    else if (b.x - r < L) { b.x = L + r; if (b.vx < 0) b.vx *= -0.3; this.wallHit(-1); }
    else if (b.x + r > R) { b.x = R - r; if (b.vx > 0) b.vx *= -0.3; this.wallHit(1); }

    // objets proches
    const objs = this.objs;
    for (let i = lowerBound(objs, b.y - 45); i < objs.length && objs[i].y < b.y + 45; i++) {
      const o = objs[i];
      if (o.dead || o.deco) continue;
      const ox = this.objX(o), dx = ox - b.x, dy = o.y - b.y, d = Math.hypot(dx, dy) || 0.01;
      const canEat = edible(o, b);
      if (canEat) { if (d < b.r + o.r * 0.5) this.absorb(o, dx, dy, d); }
      else if (d < b.r + o.r * 0.85) this.bump(o, dx, dy, d);
    }
    b.r = Math.sqrt(b.area);

    // nouveaux objets avalables -> message
    for (const def of OBJECTS) {
      if (def.rock || this.eatable.has(def.id) || def.r > b.r * 0.8) continue;
      this.eatable.add(def.id);
      if (def.r >= 4.5 && (this.course.counts[def.id] || 0) > 0 && (!def.weather || def.weather === wx.id)) {
        this.notice(`Miam : ${def.name} !`, '#c8ff8a', 1.6, 1); Sound.play('unlock');
      }
    }

    // traînée de sable
    if (this.frame % 2 === 0) {
      this.particles.push({ x: b.x + (Math.random() - 0.5) * b.r * 1.6, y: b.y - b.r * 0.6, vx: (Math.random() - 0.5) * 20, vy: -10 - Math.random() * 10, g: 0, life: 0.5, col: Math.random() < 0.5 ? this.theme.sandLight : this.theme.sandDark, s: 1 });
    }

    this.watchGhosts(b);
    if (this.course.holeY - b.y < 700 && !this.saidEnd) { this.saidEnd = true; this.say('end', 1); }

    if (this.playTicks % GHOST_EVERY === 0) {
      this.rec.x.push(Math.round(b.x * 10)); this.rec.y.push(Math.round(b.y)); this.rec.r.push(Math.round(b.r * 10));
    }
    if (this.playTicks % 5 === 0 && this.hooks.hud) this.hooks.hud(this.hudState());

    // arrivée
    if (b.y >= this.course.holeY - 2) {
      this.run.sizeCm = radiusToCm(b.r);
      if (Math.abs(b.x - this.course.holeX) <= HOLE_TOL) {
        this.run.terrier = true; this.run.holeOff = Math.abs(b.x - this.course.holeX); this.phase = 'hole'; Sound.play('win');
        this.notice('DANS LE TERRIER !', '#fff4a8', 2, 3);
        for (let i = 0; i < 4; i++) this.rec.x.push(Math.round(this.course.holeX * 10)), this.rec.y.push(this.course.holeY), this.rec.r.push(0);
      } else {
        this.run.missBy = Math.abs(b.x - this.course.holeX) - HOLE_TOL;
        this.phase = 'miss'; Sound.play('miss'); this.notice('RATE... SCORE / 2', '#ff9a8a', 2, 3);
      }
      this.phaseT = 0;
      if (this.hooks.hud) this.hooks.hud(this.hudState());
    }
  }

  hudState() {
    const b = this.ball;
    const st = {
      sizeCm: radiusToCm(b.r), progress: clamp(b.y / this.course.holeY, 0, 1),
      time: this.run.time, legend: this.run.legend, wind: this.windAt(this.t),
    };
    // survie : la barre devient la vie (10 cm = vide, 80 cm et plus = pleine)
    if (this.surv) Object.assign(st, { dist: this.surv.dist, life: clamp((st.sizeCm - 10) / 70, 0, 1) });
    return st;
  }

  wallHit(side) {
    const b = this.ball;
    if (this.t - b.lastWall < 0.4) return;
    b.lastWall = this.t;
    this.run.wallHits++;
    this.say('wall', 0.25);
    b.area = Math.max(this.minArea, b.area * 0.975);
    b.vy *= 0.85;
    this.shake = 1.5;
    this.burst(b.x + side * b.r, b.y, 5, [this.theme.sandLight, this.theme.sand], 50);
    Sound.play('bump');
  }

  bump(o, dx, dy, d) {
    const b = this.ball, sv = this.surv;
    if (sv && sv.fx.fantome) return;  // la boule fantôme traverse tout
    if (sv && (sv.fx.feu || sv.fx.pacteFeu) && !o.def.hazard) {  // le feu brûle l'obstacle
      o.dead = true; this.burst(o.x, o.y, 14, ['#ff4a2a', '#ff9a3a', '#ffe14a'], 70); Sound.play('pop', 3); return;
    }
    // L'obstacle dévie la boule sur le côté et la freine, sans jamais la bloquer
    const over = b.r + o.r * 0.85 - d, nx = -dx / d, ny = -dy / d, side = dx > 0 ? -1 : 1;
    b.x += side * Math.min(over, 3);
    if (dy > 0) b.vy = Math.min(b.vy, 30);
    if (this.t - o.hitT < 0.6 || this.t - b.lastHurt < 0.5) return;
    o.hitT = this.t; b.lastHurt = this.t;
    const speed = Math.hypot(b.vx, b.vy);
    let loss = (o.def.prickly ? 0.12 : 0.06) * (0.5 + Math.min(1, speed / 100));
    if (sv) {
      // en survie les obstacles font plus mal, sauf pansement ou boule rebondissante
      loss *= o.def.hazard ? 2.2 : 1.6;
      if (sv.shields > 0) { sv.shields--; loss = 0; this.floatText('PANSEMENT !', b.x, b.y - b.r - 10, '#8ae0ff'); }
      else if (sv.fx.rebond) { loss = 0; b.vx += (dx > 0 ? -1 : 1) * 120; }
    }
    b.area = Math.max(this.minArea, b.area * (1 - loss));
    b.vy *= 0.35; b.vx += nx * 70;
    this.run.bumps++;
    this.say('bump', 0.4);
    if (o.def.prickly) { this.run.pricks++; Sound.play('prick'); this.floatText('AIE !', b.x, b.y - b.r - 10, '#ff8a7a'); }
    else Sound.play('bump');
    this.shake = 3;
    try { if (navigator.vibrate && (!navigator.userActivation || navigator.userActivation.hasBeenActive)) navigator.vibrate(30); } catch (e) { }
    // la boule perd quelques objets collés
    const lost = b.stuck.splice(-Math.min(b.stuck.length, 1 + Math.floor(Math.random() * 2)));
    for (const s of lost) this.particles.push({ x: b.x, y: b.y, vx: (Math.random() - 0.5) * 80, vy: -40 - Math.random() * 30, g: 160, life: 0.7, spr: s.spr });
    this.burst(b.x - nx * b.r, b.y - ny * b.r, 8, [this.theme.sandLight, '#ffffff', this.theme.sandDark], 70);
  }

  absorb(o, dx, dy, d) {
    const b = this.ball, run = this.run;
    o.dead = true;
    if (o.def.boost) { this.coffeeT = 2.5; Sound.play('unlock'); this.floatText('TURBO !', b.x, b.y - b.r - 10, '#fff4a8'); this.burst(o.x, o.y, 8, ['#ffffff', '#c99a2e'], 50); return; }
    if (o.def.pickup) { Sound.play('unlock'); this.burst(o.x, o.y, 16, ['#74f088', '#ffffff', '#dcffe0'], 70); this.applyBonus(BONUS.mystere, true); return; }
    // rendements décroissants : plus la boule est grosse, moins chaque objet compte
    const gain = o.def.legendary ? 10 : ((this.wx.absorb || 1) * 0.3 * o.r * o.r + 0.6) * 9 / (9 + b.r);
    b.area += gain;
    run.absorbed++;
    run.byType[o.def.id] = (run.byType[o.def.id] || 0) + 1;
    // point de contact -> coordonnées sur la sphère (inverse de la rotation de roulement)
    const sx = clamp(dx / d, -1, 1) * 0.95, sy = clamp(dy / d, -1, 1) * 0.95;
    const sz = Math.sqrt(Math.max(0, 1 - sx * sx - sy * sy)), th = b.roll;
    b.stuck.push({ spr: o.sprite, p: [sx, sy * Math.cos(th) - sz * Math.sin(th), sy * Math.sin(th) + sz * Math.cos(th)] });
    if (b.stuck.length > 60) b.stuck.shift();
    if (o.def.legendary) {
      run.legend = true;
      Sound.play('legend');

      this.notice(`TRESOR : ${o.def.name} !`, '#ffe066', 2.2, 3);
      this.burst(b.x + dx, b.y + dy, 24, ['#fff4a8', '#ffe066', '#ffffff'], 90);
    } else {
      Sound.play('pop', o.r);
      this.burst(b.x + dx, b.y + dy, Math.min(10, 2 + o.r), ['#ffffff', '#fff4a8'], 40);
      if (o.r >= 5 && !this.alert && this.texts.length < 2) this.floatText(o.def.name, b.x + dx, b.y + dy - 6, '#ffffff');
      if (o.r >= 6) this.say('big', 0.5);
    }
  }

  finish() {
    if (this.state !== 'run') return;
    this.state = 'done';
    this.resetEvents();
    const run = this.run;
    run.finished = true;
    run.score = Math.round(run.sizeCm * (run.terrier ? 1 : 0.5) * (run.legend ? 1.1 : 1) * 10) / 10;
    if (this.surv) { run.mode = 'survival'; run.dist = Math.floor(this.surv.dist); run.taken = this.surv.taken; run.score = run.dist; }
    run.weather = this.wx.id;
    run.ghost = this.rec;
    if (this.hooks.onFinish) this.hooks.onFinish(run);
  }

  abort() { this.state = 'done'; this.resetEvents(); }

  // --- La Grande Fuite ------------------------------------------------------------
  survSpeed() {
    const sv = this.surv;
    let k = (1 + Math.min(0.8, sv.dist / 3500)) * sv.speedPact;  // accélère avec la distance
    if (sv.fx.cafe) k *= 1.5;
    if (sv.fx.matrix) k *= 0.55;
    return k;
  }

  stepSurvival(b) {
    const sv = this.surv, dy = b.vy * TICK;
    sv.dist += dy / 10 * (sv.fx.raccourci ? 2 : 1);
    for (const k in sv.fx) if ((sv.fx[k] -= TICK) <= 0) {
      delete sv.fx[k];
      if (k === 'pacteGeant' || k === 'mystereInv') this.mirror = false;
    }
    // la faim : la boule fond doucement, de plus en plus vite
    const hunger = (0.9 + sv.dist / 1800) * sv.hunger * (sv.fx.pacteFeu ? 2 : 1);
    b.area = Math.max(0, b.area - hunger * TICK * (1 + b.r * 0.04));
    // aimant : ce qui se mange glisse vers la boule
    if (sv.fx.aimant) for (let i = lowerBound(this.objs, b.y - 50); i < this.objs.length && this.objs[i].y < b.y + 60; i++) {
      const o = this.objs[i];
      if (o.dead || o.deco || !edible(o, b)) continue;
      const ox = this.objX(o), d = Math.hypot(ox - b.x, o.y - b.y);
      if (d < 55) { o.x0 += (b.x - ox) * 0.08; o.x = o.x0; if (o.y > b.y) o.y -= (o.y - b.y) * 0.05; }
    }
    // alliés (chameau, Kevin) : ils détruisent les obstacles sur leur passage
    for (const a of sv.allies) {
      a.t += TICK;
      a.y = b.y + (a.kind === 'chameau' ? 70 : 45 + Math.sin(a.t * 2) * 20);
      a.x = a.kind === 'chameau' ? lerp(a.x, b.x, 0.08) : b.x + Math.sin(a.t * 3.2) * 34;
      for (let i = lowerBound(this.objs, a.y - 14); i < this.objs.length && this.objs[i].y < a.y + 14; i++) {
        const o = this.objs[i];
        if (o.dead || o.deco || edible(o, b) || o.def.pickup) continue;
        if (Math.abs(this.objX(o) - a.x) < (a.kind === 'chameau' ? 18 : 12) + o.r) {
          o.dead = true; this.burst(this.objX(o), o.y, 10, [this.theme.sandLight, '#ffffff'], 60);
          if (Math.random() < 0.3) this.floatText(a.kind === 'chameau' ? 'MIAM' : 'YOUHOU', a.x, a.y - 10, '#ffffff');
        }
      }
    }
    sv.allies = sv.allies.filter(a => a.t < a.dur);
    // halte tous les 250 m : on choisit un bonus
    if (b.y >= sv.nextHalt) {
      sv.nextHalt += SURV.haltEvery;
      this.paused = true;
      if (this.hooks.halt) this.hooks.halt(this.drawCards());
    }
    // plus de boule : perdu ; bout de la dune : gagné (!)
    if (b.area < SURV.deathArea && this.phase === 'play') {
      this.phase = 'miss'; this.phaseT = 0; this.alert = null; Sound.play('miss');
      this.notice('PLUS DE BOULE !', '#ff9a8a', 2.5, 4);
    } else if (b.y > this.course.len - 400 && this.phase === 'play') {
      this.phase = 'miss'; this.phaseT = 0; this.notice('LE BOUT DU MONDE !', '#fff4a8', 2.5, 4);
    }
  }

  // 3 cartes au hasard (une « pacte » de temps en temps à partir de la 2e halte)
  drawCards() {
    const pool = BONUSES.slice(), cards = [];
    while (cards.length < 3) cards.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    if (this.surv.dist > 400 && Math.random() < 0.4) cards[2] = PACTS[Math.floor(Math.random() * PACTS.length)];
    return cards;
  }

  applyBonus(bon, fromTube) {
    const sv = this.surv, b = this.ball;
    if (!sv) return;
    if (bon.id === 'mystere') {
      // 70 % un bonus au hasard, 30 % une mauvaise surprise
      if (Math.random() < 0.7) return this.applyBonus(BONUSES[Math.floor(Math.random() * (BONUSES.length - 1))], fromTube);
      if (Math.random() < 0.5) { b.area *= 0.75; this.notice('OUPS : BOULE RETRECIE', '#ff9a8a', 2, 3); }
      else { sv.fx.mystereInv = 6; this.mirror = true; this.notice('OUPS : COMMANDES INVERSEES', '#ff9a8a', 2, 3); }
      sv.taken.push('🧪');
      return;
    }
    sv.taken.push(bon.icon);
    if (bon.dur) sv.fx[bon.id] = (sv.fx[bon.id] || 0) + bon.dur;
    switch (bon.id) {
      case 'bouclier': sv.shields += 3; break;
      case 'engrais': b.area *= 1.5; break;
      case 'pacteGeant': b.area *= 2; this.mirror = true; break;
      case 'pacteVitesse': sv.shields += 5; sv.speedPact *= 1.25; break;
      case 'chameau': case 'kevin': sv.allies.push({ kind: bon.id, t: 0, dur: bon.dur, x: b.x, y: b.y + 60 }); break;
    }
    this.notice((fromTube ? 'TUBE : ' : '') + bon.name.toUpperCase() + ' !', bon.pact ? '#ff9ad8' : '#c8ff8a', 1.8, 3);
  }

  drawSurvival(camY) {
    const ctx = this.ctx, sv = this.surv, b = this.ball;
    // effets actifs (en haut à gauche) et pansements
    let y = 48;
    for (const [k, left] of Object.entries(sv.fx)) {
      const bon = BONUS[k]; if (!bon) continue;
      drawText(ctx, `${bon.name.toUpperCase().slice(0, 14)} ${Math.ceil(left)}`, 4, y, bon.pact ? '#ff9ad8' : '#c8ff8a', 1, '#1d1416');
      y += 8;
    }
    if (sv.shields) drawText(ctx, `PANSEMENTS ${sv.shields}`, 4, y, '#8ae0ff', 1, '#1d1416');
    if (sv.fx.matrix) { ctx.fillStyle = 'rgba(90,140,255,0.12)'; ctx.fillRect(0, 0, W, this.H); }
    if (sv.fx.raccourci) drawText(ctx, 'X2', W - 14, 48, '#fff4a8', 1, '#1d1416');
  }

  drawSurvivalWorld() {
    const ctx = this.ctx, sv = this.surv, b = this.ball;
    for (const a of sv.allies) {
      const sp = a.kind === 'chameau' ? SPR.chameau : SPR.kevin;
      ctx.drawImage(sp, Math.round(a.x - sp.width / 2), Math.round(a.y - sp.height / 2));
    }
    if (sv.shields) { ctx.strokeStyle = 'rgba(138,224,255,0.8)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 3, 0, Math.PI * 2); ctx.stroke(); }
    if ((sv.fx.feu || sv.fx.pacteFeu) && this.frame % 2 === 0)
      this.particles.push({ x: b.x + (Math.random() - 0.5) * b.r * 2, y: b.y + (Math.random() - 0.5) * b.r * 2, vx: 0, vy: -30, g: 0, life: 0.35, col: ['#ff4a2a', '#ff9a3a', '#ffe14a'][this.frame % 3], s: 2 });
  }

  // --- Événements surprise ---------------------------------------------------
  resetEvents() {
    this.mirror = false; this.popup = null; this.mirage = null; this.kevins = []; this.saidEnd = false;
    this.alert = null; this.msg = null;
    this.blackout = 0; this.coffeeT = 0; this.foam = null; this.siren = 0; this.chaser = null; this.magnet = false; this.spooks = [];
  }

  updateEvents(b) {
    for (const ev of this.evs) {
      const def = EVENTS[ev.type];
      if (!ev.state && b.y >= ev.y - Math.max(110, b.vy * 2.5)) {
        ev.state = 'warn'; this.alert = { text: def.name, hint: def.hint, t: 0 }; Sound.play('count');
      }
      if (ev.state === 'warn' && b.y >= ev.y) { ev.state = 'on'; ev.t = 0; this.startEvent(ev, b); if (this.alert) { this.alert.on = true; this.alert.left = Math.max(def.dur, 1.2); } }
      if (ev.state === 'on') {
        ev.t += TICK;
        this.tickEvent(ev, b);
        if (ev.t >= def.dur) { ev.state = 'done'; this.endEvent(ev); }
      }
    }
    if (this.mirage && b.y > this.course.holeY - 120) {
      this.mirage = null; this.notice('C\'ETAIT UN MIRAGE !', '#c8ff8a', 1.6, 2);
      this.burst(b.x, b.y + 60, 12, ['#ffffff', '#fff4a8'], 50);
    }
  }

  // Ajoute un objet à la dune en gardant la liste triée
  spawn(def, x, y, r, sprite, extra) {
    const o = { def, x, x0: x, y, r, sprite: sprite || def.sprite, dead: false, hitT: -9, phase: 0, amp: 0, w: 0, ...extra };
    this.objs.splice(lowerBound(this.objs, y), 0, o);
    return o;
  }

  startEvent(ev, b) {
    const rng = makeRng(ev.seed), H = this.H;
    switch (ev.type) {
      case 'mirror': this.mirror = true; break;
      case 'camels': {
        for (let i = 0; i < 5; i++) {
          const y = ev.y + 100 + i * 26, [L, R] = this.edge(y), def = OBJ.chameau;
          this.spawn(def, (L + R) / 2, y, def.r, null, { amp: Math.max(0, (R - L) / 2 - def.r - 4), w: rng.range(0.9, 1.5), phase: rng.range(0, 6.28) });
        }
        break;
      }
      case 'poop': {
        for (let i = 0; i < 26; i++) {
          const y = ev.y + 70 + rng.range(0, 220), [L, R] = this.edge(y);
          this.spawn(OBJ.crottin, rng.range(L + 6, R - 6), y, OBJ.crottin.r);
        }
        for (let i = 0; i < 2; i++) {
          const y = ev.y + 120 + i * 90, [L, R] = this.edge(y);
          this.spawn(OBJ.cactus, rng.range(L + 12, R - 12), y, OBJ.cactus.r);
        }
        break;
      }
      case 'kevin': {
        const dir = rng.chance(0.5) ? 1 : -1, y = ev.y + 85, [L, R] = this.edge(y);
        this.kevins.push({ y, x0: dir > 0 ? L - 8 : R + 8, x1: dir > 0 ? R + 8 : L - 8, dir, t: 0, hit: false });
        break;
      }
      case 'meeting': {
        const w = 132, h = 46;
        this.popup = { x: Math.round(rng.range(4, W - w - 4)), y: Math.round(rng.range(H * 0.2, H * 0.55)), w, h };
        Sound.play('unlock');
        break;
      }
      case 'power': this.blackout = 1; Sound.play('miss'); break;
      case 'copier': {
        // chaque objet un peu plus loin reçoit une copie à côté de lui
        const copies = [];
        for (let i = lowerBound(this.objs, ev.y + 40); i < this.objs.length && this.objs[i].y < ev.y + 400; i++) {
          const o = this.objs[i];
          if (o.dead || o.deco || o.def.legendary || o.def.id === 'flag') continue;
          copies.push(o);
        }
        for (const o of copies) {
          const y = o.y + 6, [L, R] = this.edge(y), side = o.x < (L + R) / 2 ? 1 : -1;
          const x = clamp(o.x + side * (o.r * 2 + 4), L + o.r + o.amp + 2, R - o.r - o.amp - 2);
          this.spawn(o.def, x, y, o.r, o.sprite, { amp: o.amp, w: o.w, phase: o.phase + 1 });
        }
        Sound.play('unlock');
        break;
      }
      case 'coffee': {
        for (let i = 0; i < 5; i++) {
          const y = ev.y + 90 + i * 45, [L, R] = this.edge(y);
          this.spawn(CAFE, rng.range(L + 10, R - 10), y, CAFE.r);
        }
        break;
      }
      case 'alarm': {
        const y0 = ev.y + 70, y1 = y0 + 240, blobs = [];
        for (let y = y0; y < y1; y += 9) {
          const [L, R] = this.edge(y);
          for (let k = 0; k < 4; k++) blobs.push({ x: rng.range(L + 3, R - 3), y: y + rng.range(-4, 4), r: rng.int(4, 8) });
        }
        this.foam = { y0, y1, blobs }; this.siren = 1.6;
        break;
      }
      case 'chaser': {
        const [L, R] = this.edge(b.y - 70);
        this.chaser = { x: clamp(b.x + (rng.chance(0.5) ? 30 : -30), L + 8, R - 8), y: b.y - 70, hit: false };
        break;
      }
      case 'magnet': this.magnet = true; Sound.play('unlock'); break;
      case 'spooky': {
        // des fantômes de toutes tailles passent devant l'écran ; le plus gros s'arrête pour faire BOUH
        const H = this.H, n = rng.int(4, 5);
        for (let i = 0; i < n; i++) {
          const left = i % 2 === 0, big = i === 0;
          this.spooks.push({
            s: big ? 6 : rng.int(2, 4), y: big ? H * 0.42 : rng.range(H * 0.18, H * 0.85),
            x: left ? -30 - i * 25 : W + 30 + i * 25, vx: (left ? 1 : -1) * rng.range(28, 55), ph: rng.range(0, 6.28),
            big, delay: big ? 0.6 : rng.range(0, 1.6), t: 0,
          });
        }
        Sound.play('miss');
        break;
      }
      case 'mirage': {
        const hy = this.course.holeY, side = rng.chance(0.5) ? 1 : -1;
        const [L, R] = this.edge(hy);
        let mx = this.course.holeX + side * rng.range(36, 48);
        if (mx < L + 18 || mx > R - 18) mx = this.course.holeX - side * rng.range(36, 48);
        this.mirage = { x: clamp(mx, L + 18, R - 18) };
        break;
      }
    }
  }

  tickEvent(ev, b) {
    if (ev.type === 'tornado') {
      b.vx += Math.sin(ev.t * 7) * 520 * TICK;
      b.roll += 0.25;
      if (this.frame % 2 === 0) {
        const a = ev.t * 9;
        this.particles.push({ x: b.x + Math.cos(a) * (b.r + 8), y: b.y + Math.sin(a) * (b.r + 4), vx: -Math.sin(a) * 60, vy: Math.cos(a) * 30, g: 0, life: 0.5, col: this.theme.sandLight, s: 1 });
      }
    } else if (ev.type === 'quake') {
      this.shake = Math.max(this.shake, 3);
      b.vx += Math.sin(ev.t * 23) * 160 * TICK;
    } else if (ev.type === 'chaser' && this.chaser) {
      // le scorpion rattrape la boule par derrière ; on l'esquive en changeant de côté
      const c = this.chaser, dx = b.x - c.x, dy = b.y - c.y;
      c.x += clamp(dx, -38 * TICK, 38 * TICK);
      c.y += Math.max(b.vy + 14, 30) * TICK;
      c.y = Math.min(c.y, b.y + 4);
      const d = Math.hypot(dx, dy) || 1;
      if (!c.hit && d < b.r + 5) {
        c.hit = true;
        this.bump({ def: { prickly: true }, r: 5, hitT: -9 }, -dx, -dy, d);
      }
    } else if (ev.type === 'spooky') {
      for (const g of this.spooks) {
        g.t += TICK;
        if (g.t < g.delay) continue;
        if (g.big) {
          // le gros fantôme vient se planter au milieu de l'écran, fait BOUH, puis repart
          const k = g.t - g.delay, tx = W / 2;
          if (k < 1.1) g.x = lerp(g.x, tx, 0.06);
          else if (k > 2.4) g.x += g.vx * 2.2 * TICK;
          if (k > 1.1 && !g.boo) { g.boo = true; Sound.play('bump'); this.shake = 4; }
        } else g.x += g.vx * TICK;
      }
    } else if (ev.type === 'magnet') {
      // les petits objets juste devant glissent vers la boule
      for (let i = lowerBound(this.objs, b.y - 10); i < this.objs.length && this.objs[i].y < b.y + 70; i++) {
        const o = this.objs[i];
        if (o.dead || o.deco || !edible(o, b)) continue;
        const dx = b.x - this.objX(o), step = clamp(dx, -110 * TICK, 110 * TICK);
        o.x += step; o.x0 += step;
        if (this.frame % 6 === 0) this.particles.push({ x: this.objX(o), y: o.y, vx: dx * 1.5, vy: -20, g: 0, life: 0.25, col: '#d8463a', s: 1 });
      }
    }
  }

  endEvent(ev) {
    if (ev.type === 'mirror') this.mirror = false;
    if (ev.type === 'meeting') this.popup = null;
    if (ev.type === 'power') this.blackout = 0;
    if (ev.type === 'chaser') this.chaser = null;
    if (ev.type === 'magnet') this.magnet = false;
    if (ev.type === 'spooky') this.spooks = [];
  }

  updateKevins(b) {
    for (const k of this.kevins) {
      k.t += TICK;
      k.x = lerp(k.x0, k.x1, k.t / 3);
      if (!k.hit && Math.hypot(k.x - b.x, k.y - b.y) < b.r + 5) {
        k.hit = true; this.run.kevinHit = true;
        this.bump({ def: {}, r: 4, hitT: -9 }, k.x - b.x, k.y - b.y, Math.hypot(k.x - b.x, k.y - b.y) || 1);
        this.floatText('PARDON !', k.x, k.y - 14, '#ffffff');
      }
    }
    this.kevins = this.kevins.filter(k => k.t < 3);
  }

  // Le commentateur parle (pas trop souvent)
  say(kind, chance) {
    if (Math.random() > chance || this.t - this.lastSay < 3) return;
    const c = COMMENTS[kind];
    this.sayText(c[Math.floor(Math.random() * c.length)]);
  }
  sayText(text) {
    if (this.alert || (this.msg && this.msg.t > 0)) return;  // le commentateur se tait si autre chose est affiché
    this.lastSay = this.t; this.notice(text, '#ffffff', 2, 0);
  }

  // Dépassements de fantômes : de quoi faire parler le commentateur
  watchGhosts(b) {
    const idx = Math.floor(this.playTicks / GHOST_EVERY);
    for (const g of this.ghosts) {
      const gh = g.ghost;
      if (idx >= gh.x.length || idx < 20) continue;
      const gy = gh.y[idx], role = g.role || 'rival', n = g.name.slice(0, 8);
      if (!g.passed && b.y > gy + 6) { g.passed = true; this.sayText((COMMENTS.pass[role] || COMMENTS.pass.rival)(n)); }
      else if (g.passed && b.y < gy - 6) { g.passed = false; this.sayText((COMMENTS.passed[role] || COMMENTS.passed.rival)(n)); }
    }
  }

  // Un seul message à la fois : un message plus important remplace le courant,
  // un moins important attend qu'il n'y ait plus rien (sinon il est ignoré)
  notice(text, col, dur, pri = 1) {
    if (this.msg && this.msg.t > 0 && pri < this.msg.pri) return;
    this.msg = { text, col, t: dur, dur, pri };
  }
  floatText(text, x, y, col) { this.texts.push({ text, x, y, col, life: 0.9 }); }
  burst(x, y, n, cols, sp) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random() * 0.7);
      this.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, g: 0, life: 0.3 + Math.random() * 0.4, col: cols[i % cols.length], s: 1 });
    }
  }
  updateParticles() {
    const ps = this.particles;
    for (let i = ps.length - 1; i >= 0; i--) {
      const p = ps[i]; p.life -= TICK;
      if (p.life <= 0) { ps.splice(i, 1); continue; }
      p.x += p.vx * TICK; p.y += p.vy * TICK; p.vy += (p.g || 0) * TICK; p.vx *= 0.96; if (!p.g) p.vy *= 0.96;
    }
    for (let i = this.texts.length - 1; i >= 0; i--) { const t = this.texts[i]; t.life -= TICK; t.y -= 18 * TICK; if (t.life <= 0) this.texts.splice(i, 1); }
    if (this.msg && (this.msg.t -= TICK) <= 0) this.msg = null;
    // l'alerte reste affichée pendant l'événement (au moins 1,2 s)
    if (this.alert) { this.alert.t += TICK; if (this.alert.on && (this.alert.left -= TICK) <= 0) this.alert = null; }
  }

  // --- Effets météo (espace écran) ----------------------------------------
  initFx() {
    this.fx = [];
    for (let i = 0; i < 60; i++) this.fx.push({ x: Math.random() * W, y: Math.random() * (this.H || 320), v: 0.6 + Math.random() * 0.8, l: 2 + Math.random() * 5 });
  }
  updateFx() {
    const id = this.wx && this.wx.id, H = this.H;
    for (const f of this.fx) {
      if (id === 'pluie') { f.y += 280 * f.v * TICK; f.x -= 50 * TICK; }
      else if (id === 'tempete') { const w = this.state === 'run' ? this.windAt(this.t) : 40; f.x += (w * 4 + Math.sign(w || 1) * 60) * f.v * TICK; f.y += 15 * TICK; }
      else if (id === 'ventarriere') { f.y -= 220 * f.v * TICK; }
      else if (id === 'nuit') { f.x += Math.sin(this.t * f.v + f.l) * 6 * TICK; f.y += Math.cos(this.t * f.v * 0.7 + f.l) * 6 * TICK; }
      else { f.y -= 10 * f.v * TICK; }
      if (f.y > H + 10) f.y -= H + 20; if (f.y < -10) f.y += H + 20;
      if (f.x > W + 10) f.x -= W + 20; if (f.x < -10) f.x += W + 20;
    }
  }

  // ------------------------------------------------------------------------
  render() {
    if (!this.course) return;
    const ctx = this.ctx, H = this.H;
    let camY;
    if (this.state === 'attract') camY = this.camY;
    else {
      camY = this.ball.y - H * 0.3;
      if (this.shake) camY += (Math.random() - 0.5) * this.shake * 2;
    }
    this.drawBackground(Math.round(camY));
    ctx.save();
    ctx.translate(0, -Math.round(camY));
    if (this.theme.wallDeco) {
      // décor de saison posé sur les bords de la dune, en alternance gauche / droite
      const sp = SPR[this.theme.wallDeco];
      for (let k = Math.floor((camY - 30) / 170); k * 170 < camY + H + 30; k++) {
        const wy = k * 170 + 40, [L, R] = this.edge(wy), left = k % 2 === 0;
        const x = left ? L - 12 : R + 12;
        if (left ? L < 18 : R > W - 18) continue;
        ctx.fillStyle = 'rgba(255,200,80,0.18)'; ctx.fillRect(Math.round(x) - 7, wy - 6, 15, 13);
        ctx.drawImage(sp, Math.round(x - sp.width / 2), Math.round(wy - sp.height / 2));
      }
    }
    this.drawHole();
    if (this.foam) {
      for (const f of this.foam.blobs) {
        if (f.y < camY - 10 || f.y > camY + H + 10) continue;
        ctx.fillStyle = '#c8d0e0'; ctx.fillRect(Math.round(f.x - f.r), Math.round(f.y - f.r / 2 + 1), f.r * 2, f.r);
        ctx.fillStyle = '#f4f6ff'; ctx.fillRect(Math.round(f.x - f.r + 1), Math.round(f.y - f.r / 2), f.r * 2 - 2, f.r - 1);
      }
    }
    if (this.mirage && this.frame % 12 < 10) this.drawHole(this.mirage.x + Math.round(Math.sin(this.t * 6)));

    const objs = this.objs, top = camY - 50, bot = camY + H + 50;
    const by = this.state === 'attract' ? Infinity : this.ball.y;
    const i0 = lowerBound(objs, top);
    let i = i0;
    for (; i < objs.length && objs[i].y < Math.min(bot, by); i++) this.drawObj(objs[i]);
    if (this.state !== 'attract') {
      this.drawGhosts();
      if (this.surv && this.surv.fx.fantome) ctx.globalAlpha = 0.45;
      this.drawPlayer();
      ctx.globalAlpha = 1;
      if (this.surv) this.drawSurvivalWorld();
      if (this.chaser) {
        const sp = SPR[this.chaser.x < this.ball.x ? 'scorpion' : 'scorpionF'], c = this.chaser;
        ctx.drawImage(sp, Math.round(c.x - sp.width), Math.round(c.y - sp.height) + (this.frame % 8 < 4 ? 0 : 1), sp.width * 2, sp.height * 2);
      }
      for (const k of this.kevins) {
        const sp = SPR[k.dir > 0 ? 'kevin' : 'kevinF'];
        ctx.drawImage(sp, Math.round(k.x - sp.width / 2), Math.round(k.y - sp.height / 2) - (Math.floor(k.t * 10) % 2));
      }
    }
    for (; i < objs.length && objs[i].y < bot; i++) this.drawObj(objs[i]);
    this.drawParticles();
    ctx.restore();

    this.drawWeather(camY);
    if (this.theme.mist) { ctx.fillStyle = this.theme.mist; ctx.fillRect(0, 0, W, H); }
    if (this.blackout && !(this.blackout < 0.35 && this.frame % 6 < 3)) {
      // coupure de courant : on ne voit plus que sa boule
      const LR = this.ball.r + 9, m = lightMask(LR), S = m.width, mx = Math.round(this.ball.x - LR), my = Math.round(this.ball.y - camY - LR);
      ctx.drawImage(m, mx, my);
      ctx.fillStyle = 'rgba(4,4,10,0.97)';
      ctx.fillRect(0, 0, W, Math.max(0, my)); ctx.fillRect(0, my + S, W, H);
      ctx.fillRect(0, my, Math.max(0, mx), S); ctx.fillRect(mx + S, my, W, S);
    }
    for (const g of this.spooks || []) {
      if (g.t < g.delay) continue;
      const sp = SPR.fantome, w = sp.width * g.s, h = sp.height * g.s;
      const x = Math.round(g.x - w / 2), y = Math.round(g.y - h / 2 + Math.sin(this.t * 4 + g.ph) * 2 * g.s);
      ctx.globalAlpha = 0.88;
      if (g.vx < 0 && !g.big) { ctx.save(); ctx.translate(x + w, y); ctx.scale(-1, 1); ctx.drawImage(sp, 0, 0, w, h); ctx.restore(); }
      else ctx.drawImage(sp, x, y, w, h);
      ctx.globalAlpha = 1;
      if (g.boo && g.t - g.delay < 2.4) drawText(ctx, 'BOUH !', W / 2, y - 12, '#ffffff', 2, '#1d1416', 'center');
    }
    if (this.siren > 0 && this.frame % 20 < 10) { ctx.fillStyle = 'rgba(255,40,30,0.18)'; ctx.fillRect(0, 0, W, H); }
    ctx.save(); ctx.translate(0, -Math.round(camY));
    for (const t of this.texts) drawText(ctx, t.text, t.x, t.y, t.col, 1, '#1d1416', 'center');
    ctx.restore();
    if (this.state === 'run') this.drawOverlayHud(camY);
    if (this.state === 'run' && this.surv) this.drawSurvival(camY);
  }

  drawBackground(camY) {
    const buf = this.buf, H = this.H, P = this.pal, Lx = this.course.Lx, Rx = this.course.Rx, len = this.course.len;
    const heat = this.wx && this.wx.id === 'canicule';
    const T = this.t || 0;
    for (let sy = 0; sy < H; sy++) {
      const wy = camY + sy, yi = wy < 0 ? 0 : wy >= len ? len - 1 : wy;
      const L = Lx[yi] | 0, R = Rx[yi] | 0;
      const off = heat ? Math.round(Math.sin(wy * 0.3 + T * 5) * 0.9) : 0;
      const wyo = wy + 1000000;
      let p = sy * W;
      for (let x = 0; x < W; x++, p++) {
        const wx = x + off;
        if (wx < L || wx > R) {
          const d = wx < L ? L - wx : wx - R;
          if (d <= 1) buf[p] = P.wallDark;
          else if (d <= 4) buf[p] = P.wallLight;
          else {
            const s = (wyo + wx * (wx < L ? 2 : -2) + RIP[(wx * 3) & 255] * 3) % 28;
            buf[p] = s < 2 ? P.wallDark : s < 4 && ((x + sy) & 1) ? P.wallDark : P.wall;
          }
        } else {
          const e = wx - L < R - wx ? wx - L : R - wx;
          if (e < 3) { buf[p] = (e < 2 || ((x + sy) & 1)) ? P.sandDark : P.sand; continue; }
          const s = (wyo + RIP[(wx + (wyo >> 4) * 5) & 255]) % 13;
          buf[p] = s === 0 ? P.sandDark : s === 1 ? P.sandLight : P.sand;
        }
      }
    }
    this.ctx.putImageData(this.img, 0, 0);
  }

  drawHole(x = this.course.holeX) {
    const ctx = this.ctx, hx = Math.round(x), hy = this.course.holeY;
    const ell = (rx, ry, col) => {
      ctx.fillStyle = col;
      for (let j = -ry; j <= ry; j++) { const hw = Math.round(rx * Math.sqrt(1 - (j / (ry + 0.5)) ** 2)); ctx.fillRect(hx - hw, hy + j, hw * 2 + 1, 1); }
    };
    ell(17, 10, this.theme.sandLight);
    ell(15, 8, '#4a2a1a');
    ell(13, 7, '#2a160e');
    ctx.fillStyle = '#4a2a1a'; ctx.fillRect(hx - 9, hy + 4, 19, 1);
  }

  drawObj(o) {
    if (o.dead) return;
    const ctx = this.ctx;
    let key = o.sprite;
    if (o.amp && o.def.move && Math.cos(this.t * o.w + o.phase) < 0 && SPR[key + 'F']) key += 'F';
    const s = SPR[key]; if (!s) return;
    const x = Math.round(this.objX(o) - s.width / 2), y = Math.round(o.y - s.height / 2);
    if (!o.deco) {
      ctx.fillStyle = 'rgba(70,35,10,0.25)';
      const sw = Math.round(s.width * 0.8);
      ctx.fillRect(x + ((s.width - sw) >> 1), y + s.height - 1, sw, 2);
    }
    if (this.state === 'run' && !o.deco && !o.def.pickup && o.y > this.ball.y - 15 && o.y < this.ball.y + 110 && !edible(o, this.ball)) {
      const red = OUTLINE_CACHE[key] || (OUTLINE_CACHE[key] = silhouette(s, o.def.hazard ? '#ff2a2a' : '#ff5a4a'));
      for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(red, x + ox, y + oy);
    }
    ctx.drawImage(s, x, y);
    if (o.def.legendary && this.frame % 12 === 0)
      this.particles.push({ x: this.objX(o) + (Math.random() - 0.5) * 14, y: o.y + (Math.random() - 0.5) * 10, vx: 0, vy: -12, g: 0, life: 0.6, col: Math.random() < 0.5 ? '#fff4a8' : '#ffffff', s: 1 });
  }

  drawBall(skin, specks, x, y, R, th, alpha) {
    const ctx = this.ctx;
    R = Math.max(1, Math.round(R));
    const prevAlpha = ctx.globalAlpha;
    if (alpha !== 1) ctx.globalAlpha = alpha * prevAlpha;
    ctx.drawImage(ballBase(skin, R), Math.round(x) - R, Math.round(y) - R);
    if (specks) {
      const c = Math.cos(th), sn = Math.sin(th), sz = R > 9 ? 2 : 1, rr = R - 1.2;
      for (const s of specks) {
        const [px, py, pz] = s.p;
        const z2 = -py * sn + pz * c;
        if (z2 < 0.2) continue;
        const y2 = py * c + pz * sn;
        ctx.fillStyle = s.col;
        ctx.fillRect(Math.round(x + px * rr - (sz >> 1)), Math.round(y + y2 * rr - (sz >> 1)), s.big ? sz + (R > 14 ? 1 : 0) : sz, s.big ? sz : sz);
      }
    }
    ctx.globalAlpha = prevAlpha;
  }

  drawPlayer() {
    const ctx = this.ctx, b = this.ball;
    const R = b.r * b.scale;
    if (R < 0.6 && this.phase === 'hole') return;
    const bx = Math.round(b.x), by = Math.round(b.y);
    // bousier derrière la boule
    const hop = this.phase === 'hole' ? -Math.abs(Math.sin(this.phaseT * 9)) * 6 : 0;
    const beetle = beetleSprite(this.outfit, Math.floor(b.anim) % 2);
    const btop = Math.round(by - b.r - 11 + hop + (this.phase === 'hole' ? this.phaseT * 14 : 0));
    if (this.trail && this.trail.fx === 'rainbow' && this.phase === 'play') drawRainbow(ctx, this.trailPts, b.r, this.t);
    if (this.phase !== 'hole' || this.phaseT < 1.1) {
      if (this.outfit && this.outfit.cape) drawCape(ctx, bx, btop, this.t);
      ctx.drawImage(beetle, bx - 5, btop);
      drawHat(ctx, this.hat, bx, btop);
    }
    // ombre
    ctx.fillStyle = 'rgba(70,35,10,0.3)';
    const rr = Math.round(R);
    ctx.fillRect(bx - rr + 2, by + rr - 1, rr * 2 - 1, 2);
    ctx.fillRect(bx - rr + 4, by + rr + 1, rr * 2 - 5, 1);
    drawBallFx(ctx, this.skin, b.x, b.y, R, this.t, 'back');
    this.drawBall(this.skin, this.specks, b.x, b.y, R, b.roll, 1);
    // objets collés (avec projection sur la sphère)
    const c = Math.cos(b.roll), sn = Math.sin(b.roll), list = [];
    for (const st of b.stuck) {
      const [px, py, pz] = st.p, z2 = -py * sn + pz * c;
      if (z2 < -0.05) continue;
      list.push([z2, st.spr, px, py * c + pz * sn]);
    }
    list.sort((a, b2) => a[0] - b2[0]);
    for (const [z2, key, px, y2] of list) {
      const s = SPR[key]; if (!s) continue;
      if (z2 > 0.7 && s.width > R * 1.1) continue; // les gros objets ne dépassent que sur les bords
      ctx.drawImage(s, Math.round(b.x + px * R * 0.92 - s.width / 2), Math.round(b.y + y2 * R * 0.92 - s.height / 2));
    }
    drawBallFx(ctx, this.skin, b.x, b.y, R, this.t, 'front');
  }

  drawGhosts() {
    if (!this.ghosts.length || this.phase === 'count') return;
    const idx = Math.floor(this.playTicks / GHOST_EVERY);
    const labels = [];
    this.ghosts.forEach(g => {
      const gh = g.ghost;
      if (idx >= gh.x.length) return;
      const x = gh.x[idx] / 10, y = gh.y[idx], r = gh.r[idx] / 10;
      if (r < 1) return;
      this.drawBall(GHOST_SKIN, null, x, y, r, 0, 0.42);
      // étiquette les 6 premières secondes, ensuite seulement quand le fantôme est tout près
      if (this.run.time < 6 || Math.abs(y - this.ball.y) < 40) labels.push({ g, x, y: y - r - 9 });
    });
    // les étiquettes qui se chevauchent sont empilées
    labels.sort((a, b) => b.y - a.y);
    for (let i = 0; i < labels.length; i++) for (let j = 0; j < i; j++)
      if (Math.abs(labels[i].x - labels[j].x) < 50 && Math.abs(labels[i].y - labels[j].y) < 8) labels[i].y = labels[j].y - 8;
    for (const l of labels) {
      const role = GHOST_ROLES[l.g.role] || GHOST_ROLES.other;
      drawText(this.ctx, role.label(l.g.name), l.x, l.y, role.col, 1, '#1d1416', 'center');
    }
  }

  drawParticles() {
    const ctx = this.ctx;
    for (const p of this.particles) {
      if (p.spr) { const s = SPR[p.spr]; if (s) ctx.drawImage(s, Math.round(p.x - s.width / 2), Math.round(p.y - s.height / 2)); continue; }
      if (p.txt) { drawText(ctx, p.txt, p.x, p.y, p.col, 1, null); continue; }
      ctx.fillStyle = p.col; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s, p.s);
    }
  }

  drawWeather(camY) {
    const ctx = this.ctx, H = this.H, id = this.wx.id;
    if (id === 'pluie') {
      ctx.fillStyle = 'rgba(40,60,120,0.12)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(200,220,255,0.55)';
      for (const f of this.fx) { const x = Math.round(f.x), y = Math.round(f.y); for (let k = 0; k < f.l; k++) ctx.fillRect(x - (k >> 2), y + k, 1, 1); }
    } else if (id === 'tempete') {
      ctx.fillStyle = 'rgba(230,170,80,0.16)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255,235,190,0.6)';
      for (const f of this.fx) ctx.fillRect(Math.round(f.x), Math.round(f.y), Math.round(f.l * 1.5), 1);
    } else if (id === 'ventarriere') {
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      for (const f of this.fx) if (f.v > 1) ctx.fillRect(Math.round(f.x), Math.round(f.y), 1, Math.round(f.l * 2));
    } else if (id === 'canicule') {
      ctx.fillStyle = 'rgba(255,140,40,0.07)'; ctx.fillRect(0, 0, W, H);
    } else if (id === 'nuit') {
      let lx, ly, LR;
      if (this.state === 'attract') { lx = W / 2; ly = H * 0.45; LR = 70; }
      else { lx = this.ball.x; ly = this.ball.y - camY; LR = 44 + this.ball.r * 1.3; }
      const m = lightMask(LR), S = m.width, mx = Math.round(lx - LR), my = Math.round(ly - LR);
      ctx.drawImage(m, mx, my);
      ctx.fillStyle = 'rgba(8,8,28,0.9)';
      ctx.fillRect(0, 0, W, Math.max(0, my)); ctx.fillRect(0, my + S, W, H);
      ctx.fillRect(0, my, Math.max(0, mx), S); ctx.fillRect(mx + S, my, W, S);
      // étoiles, objets lumineux, luciole
      ctx.fillStyle = 'rgba(255,255,220,0.7)';
      for (const f of this.fx) if (f.v > 1.25) ctx.fillRect(Math.round(f.x), Math.round(f.y), 1, 1);
      ctx.save(); ctx.translate(0, -Math.round(camY));
      for (let i = lowerBound(this.objs, camY - 20); i < this.objs.length && this.objs[i].y < camY + H + 20; i++) {
        const o = this.objs[i];
        if (o.dead || !(o.def.glow || o.def.legendary)) continue;
        const s = SPR[o.sprite], x = Math.round(this.objX(o)), y = Math.round(o.y);
        ctx.fillStyle = 'rgba(255,240,150,0.18)'; ctx.fillRect(x - 6, y - 6, 13, 13); ctx.fillRect(x - 8, y - 3, 17, 7);
        ctx.drawImage(s, x - (s.width >> 1), y - (s.height >> 1));
      }
      // le terrier luit faiblement
      ctx.fillStyle = 'rgba(255,220,140,0.25)';
      ctx.fillRect(Math.round(this.course.holeX) - 17, this.course.holeY - 1, 35, 2);
      ctx.restore();
      if (this.state !== 'attract') {
        const a = this.t * 2.2, fx = lx + Math.cos(a) * (this.ball.r + 9), fy = ly - 4 + Math.sin(a * 1.3) * (this.ball.r * 0.6 + 4);
        ctx.fillStyle = 'rgba(220,255,120,0.3)'; ctx.fillRect(Math.round(fx) - 2, Math.round(fy) - 1, 5, 3); ctx.fillRect(Math.round(fx) - 1, Math.round(fy) - 2, 3, 5);
        ctx.fillStyle = '#f4ff9a'; ctx.fillRect(Math.round(fx), Math.round(fy), 1, 1);
      }
    }
  }

  // Grande alerte d'événement : bandeau, triangle qui clignote, texte en gros
  drawAlert(a) {
    const ctx = this.ctx, y = 32, blink = Math.floor(a.t * 6) % 2 === 0;
    ctx.fillStyle = 'rgba(29,20,22,0.82)'; ctx.fillRect(0, y, W, 30);
    ctx.fillStyle = '#ffb04a'; ctx.fillRect(0, y, W, 1); ctx.fillRect(0, y + 29, W, 1);
    if (blink || a.on) for (const x of [10, W - 21]) {
      ctx.fillStyle = '#ffb04a';
      for (let j = 0; j < 10; j++) ctx.fillRect(x + 5 - (j >> 1), y + 5 + j, (j >> 1) * 2 + 1, 1);
      ctx.fillStyle = '#1d1416'; ctx.fillRect(x + 5, y + 8, 1, 4); ctx.fillRect(x + 5, y + 13, 1, 1);
    }
    drawText(ctx, a.text, W / 2, y + 5, '#ffb04a', 2, '#1d1416', 'center');
    drawText(ctx, a.hint, W / 2, y + 20, '#ffffff', 1, null, 'center');
  }

  drawOverlayHud(camY) {
    const ctx = this.ctx, H = this.H;
    if (this.state === 'run' && this.phase === 'count') {
      const c = Math.ceil(this.countT);
      if (c >= 1 && c <= 3) drawText(ctx, String(c), W / 2, H * 0.45, '#fff4a8', 5, '#1d1416', 'center');
      // rappel des règles pendant le compte à rebours
      drawText(ctx, 'GLISSE LE DOIGT POUR DIRIGER', W / 2, H * 0.62, '#ffffff', 1, '#1d1416', 'center');
      drawText(ctx, 'AVALE PLUS PETIT QUE TOI', W / 2, H * 0.62 + 9, '#c8ff8a', 1, '#1d1416', 'center');
      drawText(ctx, 'VISE LE TERRIER AU BOUT !', W / 2, H * 0.62 + 18, '#fff4a8', 1, '#1d1416', 'center');
    }
    // première course : flèches animées « glisse ton doigt » pendant les premières secondes
    if (this.hint && this.state === 'run' && this.phase === 'play' && this.run.time < 5) {
      const y = H * 0.7, dx = Math.round(Math.sin(this.run.time * 4) * 10);
      if (this.frame % 30 < 22) {
        drawText(ctx, '<', W / 2 - 52 + Math.min(0, dx), y, '#fff4a8', 3, '#1d1416', 'center');
        drawText(ctx, '>', W / 2 + 52 + Math.max(0, dx), y, '#fff4a8', 3, '#1d1416', 'center');
      }
      drawText(ctx, 'GLISSE TON DOIGT', W / 2, y + 2, '#ffffff', 1, '#1d1416', 'center');
      drawText(ctx, 'A GAUCHE / A DROITE', W / 2, y + 10, '#ffffff', 1, '#1d1416', 'center');
    }
    // flèche vers le terrier
    const b = this.ball, dist = this.course.holeY - b.y;
    if (this.state === 'run' && this.phase === 'play' && !this.mirage && dist < 1100 && this.course.holeY - camY > H - 12) {
      const x = Math.round(clamp(this.course.holeX, 10, W - 10)), y = H - 16 + (Math.floor(this.t * 4) % 2);
      ctx.fillStyle = '#1d1416'; ctx.fillRect(x - 4, y - 1, 9, 3); ctx.fillRect(x - 3, y + 2, 7, 2); ctx.fillRect(x - 2, y + 4, 5, 2); ctx.fillRect(x - 1, y + 6, 3, 1);
      ctx.fillStyle = '#fff4a8'; ctx.fillRect(x - 3, y, 7, 1); ctx.fillRect(x - 2, y + 2, 5, 1); ctx.fillRect(x - 1, y + 4, 3, 1); ctx.fillRect(x, y + 5, 1, 1);
      drawText(ctx, 'TERRIER ' + Math.max(0, Math.round(dist / 10)) + 'M', x, y - 8, '#fff4a8', 1, '#1d1416', 'center');
    }
    if (this.popup) {
      const { x, y, w, h } = this.popup;
      ctx.fillStyle = '#1d1416'; ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
      ctx.fillStyle = '#f2f2f2'; ctx.fillRect(x, y, w, h);
      ctx.fillStyle = '#2d6aa8'; ctx.fillRect(x, y, w, 9);
      drawText(ctx, 'MESSAGERIE', x + 3, y + 2, '#ffffff', 1, null);
      ctx.fillStyle = '#d8463a'; ctx.fillRect(x + w - 8, y + 2, 5, 5);
      drawText(ctx, 'REUNION DANS 5 MIN', x + w / 2, y + 15, '#1d1416', 1, null, 'center');
      drawText(ctx, 'SALLE 3 - VENEZ NOMBREUX', x + w / 2, y + 23, '#5a5560', 1, null, 'center');
      ctx.fillStyle = '#5a5560'; ctx.fillRect(x + w / 2 - 9, y + 32, 19, 10);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x + w / 2 - 8, y + 33, 17, 8);
      drawText(ctx, 'OK', x + w / 2, y + 35, '#1d1416', 1, null, 'center');
    }
    if (this.alert) this.drawAlert(this.alert);
    else if (this.msg) {
      const n = this.msg;
      if (n.t > 0.15 || this.frame % 4 < 2) drawText(ctx, n.text, W / 2, 34, n.col, 1, '#1d1416', 'center');
    }
    // temps restant des événements qui durent
    let yy = this.alert ? 78 : 46;
    for (const ev of this.evs || []) {
      if (ev.state !== 'on' || !EVENTS[ev.type].dur) continue;
      const k = 1 - ev.t / EVENTS[ev.type].dur, w = 60;
      ctx.fillStyle = '#1d1416'; ctx.fillRect(W / 2 - w / 2 - 1, yy - 1, w + 2, 4);
      ctx.fillStyle = '#ffb04a'; ctx.fillRect(W / 2 - w / 2, yy, Math.round(w * k), 2);
      yy += 6;
    }
  }
}

// Étiquette et couleur de chaque fantôme selon son rôle
const OUTLINE_CACHE = {};
const GHOST_ROLES = {
  leader: { col: '#ffd25a', label: n => '1ER ' + n.slice(0, 8) },
  rival: { col: '#ffb0d8', label: n => 'RIVAL ' + n.slice(0, 8) },
  self: { col: '#c9b8ff', label: () => 'TON RECORD' },
  other: { col: '#8ae0ff', label: n => n.slice(0, 10) },
};
const RIP = new Int8Array(256).map((_, i) => Math.round(3 * Math.sin(i * 0.21) + 2 * Math.sin(i * 0.07)));

</script>
<script>
'use strict';
// ---------------------------------------------------------------------------
// Interface : menus, résultats, classement, collection, style, badges
// ---------------------------------------------------------------------------

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IMG_CACHE = {};
function imgUrl(key, canvasFn) {
  if (!IMG_CACHE[key]) IMG_CACHE[key] = (canvasFn ? canvasFn() : SPR[key]).toDataURL();
  return IMG_CACHE[key];
}
function pix(url, w, h, extra = '') {
  return `<img class="pix" src="${url}" style="width:calc(var(--u)*${w});height:calc(var(--u)*${h})" ${extra} alt="">`;
}
function spriteImg(key, scale = 2, sil = false) {
  const s = SPR[key];
  return pix(imgUrl(key + (sil ? '_sil' : ''), sil ? () => silhouette(s) : null), s.width * scale, s.height * scale);
}
function themeSwatch(t) {
  const [c, x] = newCanvas(36, 22);
  for (let j = 0; j < 22; j++) for (let i = 0; i < 36; i++) {
    let col;
    if (i < 6 || i > 29) { const d = i < 6 ? 6 - i : i - 29; col = d <= 1 ? t.wallDark : d <= 3 ? t.wallLight : t.wall; }
    else { const s = (j * 1 + RIP[(i * 5) & 255] + 50) % 7; col = s === 0 ? t.sandDark : s === 1 ? t.sandLight : t.sand; }
    x.fillStyle = col; x.fillRect(i, j, 1, 1);
  }
  return c;
}
function mascotUrl(skin, hat, R = 9, outfit = OUTFITS[0], trail = TRAILS[0]) {
  return imgUrl(`m_${skin.id}_${hat.id}_${outfit.id}_${trail.id}_${R}`, () => renderMascot(skin, hat, R, 1, outfit, trail));
}

const App = {
  init() {
    buildSprites();
    Store.load();
    Sound.on = Store.data.settings.sound !== false;
    this.appEl = document.getElementById('app');
    this.ui = document.getElementById('ui');
    this.hud = {
      root: document.getElementById('hud'), size: document.getElementById('hud-size'),
      bar: document.getElementById('hud-bar'), beetle: document.getElementById('hud-beetle'),
      wx: document.getElementById('hud-wx'), tryEl: document.getElementById('hud-try'), time: document.getElementById('hud-time'),
    };
    this.game = new Game(document.getElementById('screen'), {
      hud: s => this.onHud(s),
      onFinish: run => this.onFinish(run),
      halt: cards => this.onHalt(cards),
    });
    this.lbTab = 'day'; this.shopTab = 'ball';
    this.fit();
    window.addEventListener('resize', () => this.fit());
    this.bindInput();
    this.loadDay();
    document.getElementById('hud-pause').addEventListener('click', e => { e.stopPropagation(); this.pause(); });
    document.addEventListener('visibilitychange', () => { if (document.hidden) this.pause(); });
    this.ui.addEventListener('click', e => this.onClick(e));
    setInterval(() => this.tick(), 1000);
    if (!Store.profile() || this.devRefused(Store.profile())) this.show('name'); else this.show('home');
    this.syncOnStart();
  },

  // Récupère la progression jouée sur un autre appareil
  // Version de test : seul le compte de l'organisateur peut y entrer
  devRefused(p) { return DEV_LOCKED && (!p || p.uid !== ADMIN_UID); },

  async syncOnStart() {
    const p = this.p;
    if (this.devRefused(p)) return;
    if (p && await Online.pullProfile(p)) { this.loadDay(); if (this.screen === 'home') this.show('home'); }
    const g = p && await Online.claimGifts(p);
    if (g) {
      Store.save(); Sound.play('unlock');
      const what = [g.coins ? `+${g.coins} 🟡` : '', ...(g.items || []).map(k => { const [t, id] = k.split(':'); return findCos(t, id).name; })].filter(Boolean).join(', ');
      this.toast(`🎁 Cadeau de l'organisateur : ${what}${g.msg ? ' — ' + g.msg : ''}`);
      if (this.screen === 'home') this.show('home');
    }
  },

  fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const H = clamp(Math.round(W * vh / vw), 320, 400);
    let s = Math.min(vw / W, vh / H);
    if (s >= 3) s = Math.floor(s);
    this.appEl.style.width = W * s + 'px'; this.appEl.style.height = H * s + 'px';
    document.documentElement.style.setProperty('--u', s + 'px');
    if (H !== this.game.H) this.game.resize(H);
  },

  loadDay() {
    this.today = dayKey();
    Store.prune(this.today);
    this.cfg = dailyConfig(this.today);
    const p = Store.profile();
    this.game.showAttract(this.cfg, dayTheme(p ? p.equip.theme : 'doree'));
    this.dailyAwards();
  },

  // Une fois par jour : titres et 1re place d'hier, champion de la semaine passée
  async dailyAwards() {
    const p = this.p;
    if (!p || p.awardsDay === this.today || this.awarding) return;
    this.awarding = true;
    try {
      const lb = await Online.day(addDays(this.today, -1));
      if (!lb) return;  // hors ligne : on réessaiera
      const ct = p.counters, inc = k => { ct[k] = (ct[k] || 0) + 1; };
      for (const t of dayTitles(lb)) if (t.name === p.name) inc('t_' + t.key);
      let roi = false;
      if (lb.length >= 2 && lb[0].name === p.name) {
        inc('firsts');
        // badge Roi Bousier : 1er du classement final de la veille
        if (!p.badges.roi) { p.badges.roi = this.today; roi = true; }
      }
      await this.weeklyAwards();
      p.awardsDay = this.today;
      const fresh = Store.checkUnlocks(p);
      Store.save();
      if (fresh.length || roi) {
        Sound.play('unlock');
        this.toast([roi ? '🥇 Badge : Roi Bousier !' : '', fresh.length ? `🎁 Débloqué : ${fresh.map(f => f.item.name).join(', ')} !` : ''].filter(Boolean).join(' '));
        if (this.screen === 'home') this.show('home');
      }
    } finally { this.awarding = false; }
  },

  // Podium des semaines terminées : pièces, titres de champion, message à l'accueil
  async weeklyAwards() {
    const p = this.p, prev = addDays(weekKey(this.today), -7);
    let wk = weekKey(p.created > FIRST_WEEK ? p.created : FIRST_WEEK);
    for (; wk <= prev; wk = addDays(wk, 7)) {
      if (p.weeks[wk] != null) continue;
      const pod = await Leaderboard.podium(wk);
      if (!pod) return;  // hors ligne : on réessaiera
      const i = pod.top.findIndex(e => e.name === p.name);
      p.weeks[wk] = i + 1;
      if (i < 0) continue;
      p.coins += PODIUM_COINS[i];
      p.weekMsg = { wk, place: i, coins: PODIUM_COINS[i] };
      if (i === 0 && !p.badges.champion) p.badges.champion = this.today;
    }
    p.counters.champion = Object.values(p.weeks).filter(v => v === 1).length;
  },

  tick() {
    if (dayKey() !== this.today && this.game.state !== 'run') { this.loadDay(); if (this.screen === 'home') this.show('home'); }
    const el = document.getElementById('countdown');
    if (el) el.textContent = fmtCountdown(msToMidnight());
  },

  get p() { return Store.profile(); },

  // --- Entrées tactiles / clavier ------------------------------------------
  bindInput() {
    const toX = e => { const r = this.game.cv.getBoundingClientRect(); return (e.clientX - r.left) * W / r.width; };
    const active = () => this.game.state === 'run' && !this.game.paused;
    this.appEl.addEventListener('pointerdown', e => {
      Sound.init();
      if (!active() || e.target.closest('button')) return;
      this.game.input.targetX = toX(e);
    });
    this.appEl.addEventListener('pointermove', e => {
      if (!active()) return;
      if (e.pointerType === 'mouse' && !e.buttons) return;
      this.game.input.targetX = toX(e);
    });
    const keys = new Set();
    const upd = () => { this.game.input.keys = (keys.has('r') ? 1 : 0) - (keys.has('l') ? 1 : 0); };
    window.addEventListener('keydown', e => {
      const k = { ArrowLeft: 'l', KeyA: 'l', KeyQ: 'l', ArrowRight: 'r', KeyD: 'r' }[e.code];
      if (k) { keys.add(k); upd(); }
      if (e.code === 'Escape' || e.code === 'KeyP') this.pause();
    });
    window.addEventListener('keyup', e => {
      const k = { ArrowLeft: 'l', KeyA: 'l', KeyQ: 'l', ArrowRight: 'r', KeyD: 'r' }[e.code];
      if (k) { keys.delete(k); upd(); }
    });
  },

  // --- Navigation ------------------------------------------------------------
  async show(name, arg) {
    this.screen = name;
    this.halloweenDeco(name);
    const tok = this.showTok = (this.showTok || 0) + 1;
    const html = await this['scr_' + name](arg);
    if (tok !== this.showTok) return;  // un autre écran a été demandé entre-temps
    this.ui.innerHTML = html;
    this.ui.classList.toggle('passive', name === 'none');
    const sc = this.ui.querySelector('.screen'); if (sc) sc.scrollTop = 0;
    if (name === 'shop') this.startPreview();
    if (name === 'results') this.countCoins();
    if (name === 'name') { const i = this.ui.querySelector('input'); if (i) setTimeout(() => i.focus(), 50); }
  },

  // Semaine Halloween : menus aux couleurs de la fête ; toiles, chauves-souris et araignée sur l'accueil
  halloweenDeco(name) {
    const on = isHalloween(dayKey()), app = this.appEl;
    app.classList.toggle('halloween', on);
    if (!this.hwBack) {
      this.hwBack = document.createElement('div'); this.hwBack.className = 'hw-layer';
      this.hwFront = document.createElement('div'); this.hwFront.className = 'hw-layer'; this.hwFront.style.zIndex = 5;
      app.insertBefore(this.hwBack, this.ui); app.appendChild(this.hwFront);
    }
    const home = on && name === 'home';
    if (!home) { this.hwBack.innerHTML = ''; this.hwFront.innerHTML = ''; clearTimeout(this.hwT); this.hwShown = false; return; }
    if (this.hwShown) return;
    this.hwShown = true;
    this.hwBack.innerHTML = `<div class="hw-web">${spriteImg('toile', 3)}</div><div class="hw-web r">${spriteImg('toile', 3)}</div>`
      + [[22, 0], [58, 5.5], [40, 11]].map(([y, d]) => `<div class="hw-bat" style="top:${y}%;animation-delay:${d}s">${spriteImg('chauvesouris', 2)}</div>`).join('');
    // l'araignée descend de temps en temps (le 31 : le crâne en sucre, qui fait un clin d'œil)
    const skull = dayKey() === HALLOWEEN.night;
    const H = app.clientHeight, th = Math.round(H * 0.6);
    this.hwFront.innerHTML = `<div class="hw-spider" style="top:${-th}px;--drop:${Math.round(H * 0.24)}px"><div class="thread" style="height:${th}px"></div><div class="body">${spriteImg(skull ? 'cranesucre' : 'araignee', 3)}</div></div>`;
    const sp = this.hwFront.querySelector('.hw-spider');
    const cycle = () => {
      if (!sp.isConnected) return;
      sp.classList.remove('up'); sp.classList.add('down');
      if (skull) setTimeout(() => { const img = sp.querySelector('img'); if (img) { img.src = imgUrl('cranesucreWink', null); setTimeout(() => { img.src = imgUrl('cranesucre', null); }, 500); } }, 3200);
      this.hwT = setTimeout(() => { sp.classList.remove('down'); this.hwT = setTimeout(cycle, 7000 + Math.random() * 6000); }, 6000);
    };
    sp.addEventListener('click', e => { e.stopPropagation(); clearTimeout(this.hwT); sp.classList.add('up'); sp.classList.remove('down'); Sound.play('click'); this.hwT = setTimeout(cycle, 9000); });
    this.hwT = setTimeout(cycle, 1500);
  },

  onClick(e) {
    const el = e.target.closest('[data-a]');
    if (!el) return;
    Sound.init(); Sound.play('click');
    const a = el.dataset.a, v = el.dataset.v;
    const acts = {
      go: () => this.show(v),
      play: () => this.startDaily(),
      practice: () => this.startPractice(),
      survival: () => this.startSurvival(),
      pickcard: () => this.pickCard(+v),
      lbtab: () => { this.lbTab = v; this.show('leaderboard'); },
      shoptab: () => { this.shopTab = v; this.shopSel = null; this.show('shop'); },
      shopitem: () => this.shopItem(v),
      buy: () => this.buy(),
      colsel: () => { this.colSel = v; this.show('collection'); },
      resume: () => this.resume(),
      abandon: () => this.abandon(),
      sound: () => { Sound.on = !Sound.on; Store.data.settings.sound = Sound.on; Store.save(); this.show('profile'); },
      switchp: () => this.switchTo(v),
      create: () => this.doCreate(),
      logout: () => this.doLogout(),
      login: () => this.doLogin(),
      ideatype: () => { this.ideaType = v; for (const b of this.ui.querySelectorAll('[data-a="ideatype"]')) b.classList.toggle('on', b.dataset.v === v); },
      sendidea: () => this.sendIdea(),
      hwok: () => { safeStorageSet('bousier_hw_' + ONLINE_ENV, this.today); this.show('home'); },
      podok: () => { safeStorageSet('bousier_pod_' + ONLINE_ENV, v); if (this.p.weekMsg) { delete this.p.weekMsg; Store.save(); } this.show('home'); },
      annok: () => { safeStorageSet('bousier_ann_' + ONLINE_ENV, v); this.show('home'); },
      eye: () => { for (const i of this.ui.querySelectorAll('input.pw')) i.type = i.type === 'password' ? 'text' : 'password'; },
      secure: () => this.doSecure(),
      saveteam: () => this.saveTeam(),
      tuto: () => {
        if (v === 'done') { Store.data.settings.tutoDone = true; Store.save(); this.show('home'); }
        else this.show('tuto', +v);
      },
      reactsel: () => { this.reactSel = this.reactSel === v ? null : v; this.show('leaderboard'); },
      react: () => this.doReact(v),
    };
    if (acts[a]) acts[a]();
  },

  // Message sous le formulaire du champ indiqué
  formError(msg, field) {
    const box = field && this.ui.querySelector(field);
    const el = (box && box.closest('.panel') || this.ui).querySelector('.form-err');
    if (el) el.textContent = msg || '';
  },

  formValues() {
    const v = id => (this.ui.querySelector('#' + id) || {}).value || '';
    return { name: v('pname').trim(), pw: v('ppass'), pw2: v('ppass2') };
  },

  async doCreate() {
    const { name, pw, pw2 } = this.formValues();
    if (!name) return this.formError('Choisis un pseudo.');
    const pb = nameProblem(name);
    if (pb) return this.formError(pb);
    if (pw.length < 6) return this.formError('Mot de passe : 6 caractères minimum.');
    if (pw !== pw2) return this.formError('Les deux mots de passe ne sont pas identiques.');
    this.formError('Un instant…');
    const r = await Online.create(name, pw);
    if (r.error) return this.formError(r.error);
    Store.data.settings.seenVersion = visibleNews()[0].v;
    this.loadDay();
    Online.submitPlayer(this.p);
    if (!Store.data.settings.tutoDone) return this.show('tuto', 0);
    this.toast(`Bienvenue, ${r.name} !`);
    this.show('home');
  },

  async doLogin() {
    const { name, pw } = this.formValues();
    if (!name || !pw) return this.formError('Pseudo et mot de passe, s\'il te plaît.');
    this.formError('Connexion…');
    const r = await Online.login(name, pw);
    if (r.error) return this.formError(r.error);
    if (this.devRefused(this.p)) {
      delete Store.data.profiles[this.p.name]; Store.data.current = null; Store.save();
      return this.formError('Version de test réservée à l\'organisateur.');
    }
    this.loadDay();
    this.toast(`Content de te revoir, ${r.name} !`);
    this.show('home');
  },

  async sendIdea() {
    const ta = this.ui.querySelector('#idea'), text = ta ? ta.value.trim() : '';
    if (text.length < 5) return this.formError('Écris un peu plus, s\'il te plaît.');
    const today = dayKey(), sent = Store.data.settings.ideasSent || {};
    if (sent.day === today && sent.n >= 5) return this.formError('5 idées par jour maximum : reviens demain !');
    this.formError('Envoi…');
    const ok = await Online.sendIdea(this.p, this.ideaType || 'idee', text);
    if (!ok) return this.formError('Envoi impossible (pas de connexion ?).');
    Store.data.settings.ideasSent = { day: today, n: (sent.day === today ? sent.n : 0) + 1 };
    Store.save();
    this.toast('Merci ! Ton message est bien arrivé 💡');
    this.show('ideas');
  },

  async doLogout() {
    const p = this.p;
    if (!p.account) return this.toast('Choisis d\'abord un mot de passe, sinon tu perdrais ton pseudo.');
    if (!confirm(`Se déconnecter de ${p.name} ? Tu retrouveras tout en te reconnectant.`)) return;
    this.toast('Déconnexion…');
    const err = await Online.logout(p);
    if (err) return this.toast(err);
    // le profil quitte l'appareil (il reste en ligne) ; les autres profils restent
    delete Store.data.profiles[p.name];
    Store.data.current = null;
    Store.save();
    this.toast('Déconnecté. À bientôt !');
    this.show('name');
  },

  // Changer de joueur : un compte protégé qui n'est pas celui connecté demande son mot de passe
  async switchTo(name) {
    const t = Store.data.profiles[name];
    if (!t) return;
    const uid = await Online.currentUid();
    if (t.account && uid && t.uid && t.uid !== uid) return this.show('login', name);
    Store.switchProfile(name); this.loadDay(); this.show('home');
  },

  async doSecure() {
    const pw = (this.ui.querySelector('#spass') || {}).value || '';
    if (pw.length < 6) return this.formError('6 caractères minimum.');
    this.formError('Un instant…');
    const err = await Online.secure(this.p, pw);
    if (err) return this.formError(err);
    this.toast('Profil protégé ! 🔒');
    this.show('profile');
  },

  saveTeam() {
    const v = ((this.ui.querySelector('#team') || {}).value || '').trim();
    if (v) { const pb = nameProblem(v); if (pb) return this.toast(pb.replace('De 2 à 14', 'Équipe : 2 à 14')); }
    const p = this.p;
    // même orthographe que l'équipe existante si on la retrouve (majuscules)
    const known = (this.knownTeams || []).find(t => nameKey(t) === nameKey(v));
    p.team = known || v;
    Store.save();
    Online.submitPlayer(p);
    this.toast(v ? `Équipe : ${p.team}` : 'Plus d\'équipe');
    this.show('profile');
  },

  async doReact(e) {
    const target = this.reactSel;
    if (!target) return;
    const ok = await Online.react(this.today, this.p, target, e);
    if (!ok) this.toast('Réaction impossible hors ligne');
    this.reactSel = null;
    this.show('leaderboard');
  },

  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('on'), 2200);
  },

  // --- Lancer une partie -------------------------------------------------------
  async startDaily() {
    const p = this.p, d = Store.dayData(p, this.today);
    if (d.attempts >= 3) return;
    // la série se met à jour au premier essai du jour
    if (p.lastDay !== this.today) {
      p.streak = p.lastDay === addDays(this.today, -1) ? p.streak + 1 : 1;
      p.bestStreak = Math.max(p.bestStreak, p.streak);
      p.lastDay = this.today;
      p.stats.days = (p.stats.days || 0) + 1;  // jours joués (statistique pour l'organisateur)
    }
    d.attempts++;  // l'essai est consommé dès le départ (pas de triche en rechargeant)
    Store.save();
    const ghosts = await Leaderboard.ghosts(this.today, p);
    this.mode = 'daily';
    this.launch(this.cfg, ghosts, `ESSAI ${d.attempts}/3`);
  },

  startSurvival() {
    this.mode = 'survival';
    this.survCfg = survivalConfig();
    this.launch(this.survCfg, [], 'GRANDE FUITE');
  },

      this.hud.size.textContent = `${Math.floor(s.dist)} m · ${fmtSize(s.sizeCm)}`;
      this.hud.bar.style.width = (s.life * 100).toFixed(1) + '%';
      this.hud.bar.style.background = s.life > 0.5 ? '#9be27a' : s.life > 0.2 ? '#ffb04a' : '#ff5a4a';
      return;
    }
    this.hud.size.textContent = fmtSize(s.sizeCm);

  // --- Fin de partie : récompenses ---------------------------------------------
  async onFinish(run) {
    const p = this.p, res = { run, mode: this.mode, coins: 0, quests: [], badges: [], newBest: false };
    this.hud.root.classList.add('hidden');
    // exploits et compteurs pour les objets à débloquer (pas en entraînement : aucune récompense)
    const ct = p.counters, inc = k => { ct[k] = (ct[k] || 0) + 1; }, now = new Date();
    if (this.mode !== 'practice') {
      if (this.mode === 'daily' && run.weather === 'pluie') inc('rain');
      if (this.mode === 'daily' && run.weather === 'canicule' && run.terrier) inc('heat');
      if (run.kevinHit) inc('kevin');
      if (!run.terrier && run.missBy != null && run.missBy <= 3) inc('presque');
      if (run.terrier && run.bumps === 0 && run.wallHits === 0) inc('parfait');
      if (run.absorbed < 5) inc('ratee');
      if (!Sound.on) inc('silence');
      if (now.getHours() === 13 && now.getMinutes() === 37) inc('leet');
    }
    if (this.mode === 'daily') {
      const d = Store.dayData(p, this.today), cfg = this.cfg;
      const summary = runSummary(run);
      d.runs.push(summary);
      const faster = run.score === d.best && d.bestRun && run.time < d.bestRun.time;
      if (run.score > d.best || faster) { res.newBest = d.best > 0 || true; d.best = run.score; d.bestRun = summary; d.ghost = run.ghost; }
      // collection
      for (const id in run.byType) {
        if (LEGEND[id]) continue;
        if (!p.collection[id]) res.discovered = (res.discovered || []).concat(id);
        p.collection[id] = (p.collection[id] || 0) + run.byType[id];
      }
      const parts = res.parts = [];  // détail des pièces, affiché ligne par ligne
      if (run.legend) {
        if (!d.legend) { res.coins += 30; parts.push(['✨', 'Trésor trouvé', 30]); }
        d.legend = true;
        p.legends[cfg.legend.id] = (p.legends[cfg.legend.id] || 0) + 1;
      }
      p.weathers[run.weather] = (p.weathers[run.weather] || 0) + 1;
      if (isHalloween(this.today)) inc('halloween');
      if (this.today === HALLOWEEN.night && run.terrier) inc('sorciere');
      const st = p.stats;
      st.runs++; st.absorbed += run.absorbed; st.best = Math.max(st.best, run.score);
      if (run.terrier) st.terriers++;
      st.camels += run.byType.chameau || 0;
      res.coins += Math.floor(run.score / 4);
      parts.unshift(['🪲', 'Ta boule', Math.floor(run.score / 4)]);
      // quêtes
      for (const q of cfg.quests) {
        if (d.quests[q.id] || !q.check(run)) continue;
        d.quests[q.id] = true; res.coins += QUEST_REWARD; res.quests.push(q.text);
        parts.push(['✅', 'Quête : ' + q.text, QUEST_REWARD]);
      }
      if (cfg.quests.every(q => d.quests[q.id]) && !d.questBonus) { d.questBonus = true; res.coins += QUEST_ALL_BONUS; parts.push(['🌟', 'Toutes les quêtes du jour', QUEST_ALL_BONUS]); }
      p.coins += res.coins;
      // badges
      // envoyé à chaque partie : rattrape aussi un envoi raté hors connexion
      await Online.submitScore(p, this.today);
      const lb = await Leaderboard.day(this.today);
      res.rank = lb.findIndex(e => e.name === p.name) + 1;
      res.players = lb.length;
      res.online = lb.online;
      const cond = {
        premier: true, terrier: run.terrier, metre: run.sizeCm >= 100, geant: run.sizeCm >= 200, titan: run.sizeCm >= 300,
        legende: Object.keys(p.legends).length >= 1, archeo: Object.keys(p.legends).length >= 4,
        intouchable: run.bumps === 0 && run.wallHits === 0,
        serie3: p.streak >= 3, serie7: p.streak >= 7, serie30: p.streak >= 30,
        meteo: Object.keys(p.weathers).length >= WEATHERS.length,
        tempete: run.terrier && run.weather === 'tempete', nuit: run.terrier && run.weather === 'nuit',
        chameaux: st.camels >= 10, collection: Store.discovered(p) >= 26,
        parfait: cfg.quests.every(q => d.quests[q.id]),
      };
      for (const b of BADGES) if (!p.badges[b.id] && cond[b.id]) { p.badges[b.id] = this.today; res.badges.push(b); }
      res.attemptsLeft = 3 - d.attempts;
      Store.save();
      Online.submitPlayer(p);
    }
    if (this.mode === 'survival') {
      const sv = p.survival;
      res.dist = run.dist; res.prevBest = sv.best; res.newRecord = run.dist > sv.best;
      sv.runs++;
      if (res.newRecord) sv.best = run.dist;
      res.coins = Math.floor(run.dist / 25);
      p.coins += res.coins;
      Store.save();
      if (res.newRecord) await Online.submitSurvival(p);
      res.top = await Online.survivalTop();
    }
    res.unlocked = this.mode === 'practice' ? [] : Store.checkUnlocks(p);
    Store.save();
    this.lastRes = res;
    setTimeout(() => this.show('results'), 200);
  },

  // Écran de fin : les pièces s'additionnent au rythme des lignes qui apparaissent
  countCoins() {
    const r = this.lastRes, el = document.getElementById('coinsum');
    if (!el || !r || !r.parts) return;
    let total = 0;
    r.parts.forEach(([ico, , n], i) => setTimeout(() => {
      if (this.screen !== 'results') return;
      const from = total; total += n;
      Sound.play(ico === '🪲' ? 'pop' : 'unlock');
      for (let k = 1; k <= 8; k++) setTimeout(() => { el.textContent = Math.round(from + (total - from) * k / 8); }, k * 35);
    }, (0.4 + i * 0.5) * 1000));
  },

  // Aperçu animé de la boutique : le personnage roule sur place, la dune défile
  startPreview() {
    const cv = this.ui.querySelector('#preview');
    if (!cv) return;
    const p = this.p, type = this.shopTab, sel = this.shopSel ? findCos(type, this.shopSel) : null;
    const look = t => type === t && sel ? sel : findCos(t, p.equip[t]);
    const skin = look('ball'), hat = look('hat'), outfit = look('outfit'), trail = look('trail'), theme = findCos('theme', p.equip.theme);
    const ctx = cv.getContext('2d'), Wp = cv.width, Hp = cv.height, specks = genSpecks(skin);
    ctx.imageSmoothingEnabled = false;
    const st = { ctx, particles: [], frame: 0, t: 0 }, pts = [], R = 10, speed = 40;
    const draw = () => {
      if (!cv.isConnected) return;  // l'écran a changé : on arrête
      requestAnimationFrame(draw);
      st.t += TICK; st.frame++;
      const scroll = st.t * speed;
      ctx.fillStyle = theme.sand; ctx.fillRect(0, 0, Wp, Hp);
      ctx.fillStyle = theme.sandDark;
      for (let k = 0; k < 14; k++) { const y = Math.round((k * 23 - scroll) % (Hp + 10) + Hp + 10) % (Hp + 10) - 5; ctx.fillRect((k * 37) % Wp, y, 3, 1); }
      const b = { x: Wp / 2 + Math.sin(st.t * 1.4) * 4, y: Hp - R - 8, r: R, roll: st.t * 4 };
      // traînée : les particules restent sur place pendant que la dune défile
      if (trail.fx === 'rainbow') {
        for (const q of pts) q.y -= speed * TICK;
        pts.push({ x: b.x, y: b.y - R - 8 }); if (pts.length > 40) pts.shift();
        drawRainbow(ctx, pts, R, st.t);
      } else if (trail.fx) emitTrail(st, trail, b);
      for (let i = st.particles.length - 1; i >= 0; i--) {
        const q = st.particles[i]; q.life -= TICK;
        if (q.life <= 0) { st.particles.splice(i, 1); continue; }
        q.x += q.vx * TICK; q.y += (q.vy - speed) * TICK;
      }
      Game.prototype.drawParticles.call(st);
      const bx = Math.round(b.x), btop = Math.round(b.y - R - 11);
      if (outfit.cape) drawCape(ctx, bx, btop, st.t);
      ctx.drawImage(beetleSprite(outfit, Math.floor(st.t * 6) % 2), bx - 5, btop);
      drawHat(ctx, hat, bx, btop);
      ctx.fillStyle = 'rgba(70,35,10,0.3)'; ctx.fillRect(bx - R + 2, b.y + R - 1, R * 2 - 1, 2);
      drawBallFx(ctx, skin, b.x, b.y, R, st.t, 'back');
      Game.prototype.drawBall.call(st, skin, specks, b.x, b.y, R, b.roll, 1);
      drawBallFx(ctx, skin, b.x, b.y, R, st.t, 'front');
    };
    draw();
  },

      ${podShow || mine ? `<div class="banner">${podShow ? `👑 Champion de la semaine dernière : <b>${esc(pod.top[0].name)}</b> (${fmtSize(pod.top[0].total)}) !${pod.top.slice(1).map((e, i) => ` ${medal(i + 1)} ${esc(e.name)}`).join('')}<div class="tiny">Podium récompensé : ${PODIUM_COINS.join(' / ')} 🟡</div>` : ''}${mine ? `<div>🎉 Tu as fini <b>${placeTxt(mine.place)}</b> de la semaine ${mine.wk === prevWk ? 'dernière' : esc(fmtWeek(mine.wk))} : <b>+${mine.coins} 🟡</b> !</div>` : ''} <button class="btn ghost small" data-a="podok" data-v="${prevWk}">OK</button></div>` : ''}

      <div class="row2">
