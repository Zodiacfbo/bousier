  launch(cfg, ghosts, label) {
    const p = this.p;
    Sound.init();
    const hint = cfg.mode !== 'survival' && !Store.data.settings.hintDone && !(p.stats.runs > 0);
    if (hint) { Store.data.settings.hintDone = true; Store.save(); }
    this.game.start(cfg, { hint,
      skin: findCos('ball', p.equip.ball), hat: findCos('hat', p.equip.hat), theme: dayTheme(p.equip.theme), ghosts,
      outfit: findCos('outfit', p.equip.outfit), trail: findCos('trail', p.equip.trail),
    });
    this.hud.wx.textContent = cfg.weather.icon;
    this.hud.tryEl.textContent = label;
    this.hud.root.classList.remove('hidden');
    this.hud.root.classList.toggle('surv', cfg.mode === 'survival');
    this.hud.bar.style.background = '';
    this.onHud(this.game.hudState());
    this.show('none');
  },

  onHud(s) {
    this.hud.time.textContent = fmtTime(s.time || 0);
    if (s.dist != null) {
      // survie : distance + taille, et la barre devient la vie
      this.hud.size.textContent = `${Math.floor(s.dist)} m · ${fmtSize(s.sizeCm)}`;
      this.hud.bar.style.width = (s.life * 100).toFixed(1) + '%';
      this.hud.bar.style.background = s.life > 0.5 ? '#9be27a' : s.life > 0.2 ? '#ffb04a' : '#ff5a4a';
      return;
    }
    this.hud.size.textContent = fmtSize(s.sizeCm);
    this.hud.bar.style.width = (s.progress * 100).toFixed(1) + '%';
    this.hud.beetle.style.left = (s.progress * 100).toFixed(1) + '%';
  },

  pause() {
    if (this.game.state !== 'run' || this.game.paused || this.cards) return;
    this.game.paused = true;
    this.show('pause');
  },
  resume() { this.game.paused = false; this.game.last = 0; this.show('none'); },
  abandon() {
    this.game.paused = false; this.game.abort();
    this.hud.root.classList.add('hidden');
    this.game.showAttract(this.cfg, dayTheme(this.p.equip.theme));
    this.show('home');
  },

  // --- Fin de partie : récompenses ---------------------------------------------
  async onFinish(run) {
    const p = this.p, res = { run, mode: this.mode, coins: 0, quests: [], badges: [], newBest: false };
    this.hud.root.classList.add('hidden');
    // exploits et compteurs pour les objets à débloquer (pas en entraînement : aucune récompense)
    const ct = p.counters, inc = k => { ct[k] = (ct[k] || 0) + 1; }, now = new Date();
    if (this.mode !== 'practice') {
      if (this.mode === 'daily' && run.weather === 'pluie') inc('rain');
      if (this.mode === 'daily' && run.weather === 'canicule' && run.terrier) inc('heat');
      if (run.kevinHit) inc('kevin');
      if (!run.terrier && run.missBy != null && run.missBy <= 3) inc('presque');
      if (run.terrier && run.bumps === 0 && run.wallHits === 0) inc('parfait');
      if (run.absorbed < 5) inc('ratee');
      if (!Sound.on) inc('silence');
      if (now.getHours() === 13 && now.getMinutes() === 37) inc('leet');
    }
    if (this.mode === 'daily') {
      const d = Store.dayData(p, this.today), cfg = this.cfg;
      const summary = runSummary(run);
      d.runs.push(summary);
      const faster = run.score === d.best && d.bestRun && run.time < d.bestRun.time;
      if (run.score > d.best || faster) { res.newBest = d.best > 0 || true; d.best = run.score; d.bestRun = summary; d.ghost = run.ghost; }
      // collection
      for (const id in run.byType) {
        if (LEGEND[id] || id === 'megot') continue;
        if (!p.collection[id]) res.discovered = (res.discovered || []).concat(id);
        p.collection[id] = (p.collection[id] || 0) + run.byType[id];
      }
      const parts = res.parts = [];  // détail des pièces, affiché ligne par ligne
      if (run.legend) {
        if (!d.legend) { res.coins += 30; parts.push(['✨', 'Trésor trouvé', 30]); }
        d.legend = true;
        p.legends[cfg.legend.id] = (p.legends[cfg.legend.id] || 0) + 1;
      }
      p.weathers[run.weather] = (p.weathers[run.weather] || 0) + 1;
      if (run.terrier && WEEKLY_WEATHERS.includes(run.weather)) inc('hole_' + run.weather);
      if (run.ghostPass) inc('ghostpass');
      if (run.byType.megot && !d.megot) { d.megot = true; inc('megot'); }  // un seul mégot compté par jour
      if (this.today >= EGG.from) {
        if (run.chat) inc('chat');
        if (now.getHours() < 7) inc('early');
        if (now.getHours() >= 23) inc('owl');
        const m = x => (run.score / 100).toFixed(2) === x;
        if (Math.round(run.score * 10) === 100) ct.pp10 = 1;
        if (m('1.00')) ct.pp100 = 1;
        if (m('2.00')) ct.pp200 = 1;
        if (m('3.00')) ct.pp300 = 1;
        if (run.terrier && d.runs.length >= maxAttempts(p, this.today) && d.runs.slice(0, -1).every(x => !x.terrier)) inc('lastchance');
        if (run.terrier && !run.byType.feuille && !run.byType.cactus) inc('vege');
      }
      if (isHalloween(this.today) && run.byType.chauvesouris) ct.bats = (ct.bats || 0) + run.byType.chauvesouris;
      if (isHalloween(this.today)) { inc('halloween'); res.pumpkins = run.byType.citrouille || 0; d.pumpkins = (d.pumpkins || 0) + res.pumpkins; d.bonbons = (d.bonbons || 0) + (run.byType.bonbon || 0); }
      if (this.today === HALLOWEEN.night && run.terrier) inc('sorciere');
      const st = p.stats;
      st.runs++; st.absorbed += run.absorbed; st.best = Math.max(st.best, run.score);
      if (run.terrier) st.terriers++;
      st.camels += run.byType.chameau || 0;
      addRunStats(st, summary, this.today);
      res.coins += Math.floor(run.score / 4);
      parts.unshift(['🪲', 'Ta boule', Math.floor(run.score / 4)]);
      // quêtes
      for (const q of cfg.quests) {
        if (d.quests[q.id] || !q.check(run)) continue;
        d.quests[q.id] = true; res.coins += QUEST_REWARD; res.quests.push(q.text);
        parts.push(['✅', 'Quête : ' + q.text, QUEST_REWARD]);
      }
      if (cfg.quests.every(q => d.quests[q.id]) && !d.questBonus) { d.questBonus = true; res.coins += QUEST_ALL_BONUS; parts.push(['🌟', 'Toutes les quêtes du jour', QUEST_ALL_BONUS]); }
      p.coins += res.coins;
      // badges
      // envoyé à chaque partie : rattrape aussi un envoi raté hors connexion
      if (await Online.submitScore(p, this.today)) d.runsSent = true;
      if (p.invitedBy && d.attempts === 1) this.parrainage();  // nouveau jour joué : l'invité avance vers ses 3 jours
      const lb = await Leaderboard.day(this.today);
      res.rank = lb.findIndex(e => e.name === p.name) + 1;
      res.players = lb.length;
      res.online = lb.online;
      const cond = {
        premier: true, terrier: run.terrier, metre: run.sizeCm >= 100, geant: run.sizeCm >= 200, titan: run.sizeCm >= 300,
        legende: Object.keys(p.legends).length >= 1, archeo: Object.keys(p.legends).length >= 4,
        intouchable: run.bumps === 0 && run.wallHits === 0,
        serie3: p.streak >= 3, serie7: p.streak >= 7, serie30: p.streak >= 30,
        meteo: WEATHERS.every(w => p.weathers[w.id]),
        tempetes: WEEKLY_WEATHERS.every(id => p.weathers[id]),
        tempete: run.terrier && run.weather === 'tempete', nuit: run.terrier && run.weather === 'nuit',
        chameaux: st.camels >= 10, collection: Store.discovered(p) >= 26,
        parfait: cfg.quests.every(q => d.quests[q.id]),
      };
      for (const b of BADGES) if (!p.badges[b.id] && cond[b.id]) { p.badges[b.id] = this.today; res.badges.push(b); }
      res.attemptsLeft = maxAttempts(p, this.today) - d.attempts; res.maxAttempts = maxAttempts(p, this.today);
      Store.save();
      Online.submitPlayer(p);
    }
    if (this.mode === 'practice') { p.stats.practice = (p.stats.practice || 0) + 1; if (run.byType.plot) ct.plots = (ct.plots || 0) + run.byType.plot; Store.save(); }
    if (run.timide && this.today >= EGG.from) ct.timide = (ct.timide || 0) + 1;
    if (this.mode === 'survival') {
      const sv = p.survival;
      res.dist = run.dist; res.prevBest = sv.best; res.newRecord = run.dist > sv.best;
      sv.runs++;
      if (res.newRecord) sv.best = run.dist;
      res.coins = Math.floor(run.dist / 25);
      p.coins += res.coins;
      Store.save();
      if (res.newRecord) await Online.submitSurvival(p);
      res.top = await Online.survivalTop();
    }
    res.unlocked = Store.checkUnlocks(p);
    this.queueFirsts(res.unlocked);
    Store.save();
    this.lastRes = res;
    setTimeout(() => this.show('results'), 200);
  },

  // Écran de fin : les pièces s'additionnent au rythme des lignes qui apparaissent
  countCoins() {
    const r = this.lastRes, el = document.getElementById('coinsum');
    if (!el || !r || !r.parts) return;
    let total = 0;
    r.parts.forEach(([ico, , n], i) => setTimeout(() => {
      if (this.screen !== 'results') return;
      const from = total; total += n;
      Sound.play(ico === '🪲' ? 'pop' : 'unlock');
      for (let k = 1; k <= 8; k++) setTimeout(() => { el.textContent = Math.round(from + (total - from) * k / 8); }, k * 35);
    }, (0.4 + i * 0.5) * 1000));
  },

  // --- Boutique ---------------------------------------------------------------
  // onglet Classement : le type est celui du groupe touché (cadre, couleur, titre)
  shopType() { return this.shopTab === 'rank' ? this.rankType || 'frame' : this.shopTab; },
  shopItem(id) {
    const p = this.p, type = this.shopType(), item = findCos(type, id);
    if (Store.owns(p, type, item)) {
      p.equip[type] = id; Store.save();
      if (type === 'theme') this.game.showAttract(this.cfg, item);
      else { clearTimeout(this.lookT); this.lookT = setTimeout(() => Online.submitPlayer(this.p), 4000); }  // apparence visible sur le podium
    }
    this.shopSel = id;
    this.show('shop');

  buy() {
    const p = this.p, type = this.shopType(), item = findCos(type, this.shopSel);
    if (!item.price || p.coins < item.price || Store.owns(p, type, item)) return;
    if ((item.from && this.today < item.from) || (item.week && !(weekShop(this.today) || []).some(e => e.item === item))) return;
    p.coins -= item.price; p.owned[type].push(item.id); p.equip[type] = item.id;
    if (type !== 'theme') { clearTimeout(this.lookT); this.lookT = setTimeout(() => Online.submitPlayer(this.p), 4000); }
    Store.save(); Sound.play('unlock');
    if (type === 'theme') this.game.showAttract(this.cfg, item);
    this.toast(`${item.name} débloqué !`);
    this.shopSel = null;
    this.show('shop');
  },

  // Aperçu animé de la boutique : le personnage roule sur place, la dune défile
  startPreview() {
    const cv = this.ui.querySelector('#preview');
    if (!cv) return;
    const p = this.p, type = this.shopTab, sel = this.shopSel ? findCos(type, this.shopSel) : null;
    const look = t => type === t && sel ? sel : findCos(t, p.equip[t]);
    const skin = look('ball'), hat = look('hat'), outfit = look('outfit'), trail = look('trail'), theme = findCos('theme', p.equip.theme);
    const ctx = cv.getContext('2d'), Wp = cv.width, Hp = cv.height, specks = genSpecks(skin);
    ctx.imageSmoothingEnabled = false;
    const st = { ctx, particles: [], frame: 0, t: 0 }, pts = [], R = 10, speed = 40;
    const draw = () => {
      if (!cv.isConnected) return;  // l'écran a changé : on arrête
      requestAnimationFrame(draw);
      st.t += TICK; st.frame++;
      const scroll = st.t * speed;
      ctx.fillStyle = theme.sand; ctx.fillRect(0, 0, Wp, Hp);
      ctx.fillStyle = theme.sandDark;
      for (let k = 0; k < 14; k++) { const y = Math.round((k * 23 - scroll) % (Hp + 10) + Hp + 10) % (Hp + 10) - 5; ctx.fillRect((k * 37) % Wp, y, 3, 1); }
      const b = { x: Wp / 2 + Math.sin(st.t * 1.4) * 4, y: Hp - R - 8, r: R, roll: st.t * 4 };
      // traînée : les particules restent sur place pendant que la dune défile
      if (trail.fx === 'rainbow') {
        for (const q of pts) q.y -= speed * TICK;
        pts.push({ x: b.x, y: b.y - R - 8 }); if (pts.length > 40) pts.shift();
        drawRainbow(ctx, pts, R, st.t);
      } else if (trail.fx) emitTrail(st, trail, b);
      if (hat.smoke && st.frame % 7 === 0) st.particles.push({ x: b.x + 4, y: b.y - R - 2, vx: 3 + Math.random() * 5, vy: -14, g: 0, life: 1, col: 'rgba(225,225,225,0.6)', s: 2 });
      for (let i = st.particles.length - 1; i >= 0; i--) {
        const q = st.particles[i]; q.life -= TICK;
        if (q.life <= 0) { st.particles.splice(i, 1); continue; }
        q.x += q.vx * TICK; q.y += (q.vy - speed) * TICK;
      }
      Game.prototype.drawParticles.call(st);
      const bx = Math.round(b.x), btop = Math.round(b.y - R - 11);
      if (outfit.cape) drawCape(ctx, bx, btop, st.t, outfit.capeCol);
      { const bs = beetleSprite(outfit, Math.floor(st.t * 6) % 2); ctx.drawImage(bs, bx - (bs.width >> 1), btop - (bs.height - 12)); if (outfit.body) drawCatFx(ctx, bx, btop - (bs.height - 12), st.t); }
      drawHat(ctx, hat, bx, btop);
      ctx.fillStyle = 'rgba(70,35,10,0.3)'; ctx.fillRect(bx - R + 2, b.y + R - 1, R * 2 - 1, 2);
      drawBallFx(ctx, skin, b.x, b.y, R, st.t, 'back');
      Game.prototype.drawBall.call(st, skin, specks, b.x, b.y, R, b.roll, 1);
      drawBallFx(ctx, skin, b.x, b.y, R, st.t, 'front');
    };
    draw();
  },

  // Apparence de chacun (cadre, couleur, titre) : en ligne d'après les records, sinon les profils de l'appareil
  async looks() {

      const recs = Online.live ? await Online.records() : null;
      if (recs) for (const r of recs) m[r.name] = r.look;
      else for (const q of Object.values(Store.data.profiles)) m[q.name] = q.equip;

    return m;
  },

          <tr class="wk-det ${e.name === me ? 'me' : ''} ${fr(e.name)}"><td></td><td colspan="3">${weekDetail(e.det, weekKey(this.today), this.today)}</td></tr>`).join('')

    } else if (tab === 'teams') {
      const lb = await Leaderboard.teams(weekKey(this.today)), mine = nameKey(this.p.team || '');
      body = lb.length ? lb.map((e, i) => `<tr class="${nameKey(e.team) === mine ? 'me' : ''}"><td>${medal(i)}</td><td>${esc(e.team)}</td><td class="tiny">${e.players} j.</td><td class="r">${fmtSize(e.avg)}</td></tr>`).join('')
        : '<tr><td colspan="4" class="center tiny">Aucune équipe cette semaine.</td></tr>';

      body = lb.length ? lb.map((e, i) => `<tr class="${e.name === me ? 'me' : ''} ${fr(e.name)}"><td>${medal(i)}</td><td>${who(e.name)}</td><td></td><td class="r">${e.best} m</td></tr>`).join('')

  // Nouvelles depuis la dernière visite : qui m'a dépassé, mon rang d'hier
  async news(lb) {
    const p = this.p, key = `bousier_seen_${ONLINE_ENV}_${nameKey(p.name)}`;
    if (!lb.online) return '';
    const i = lb.findIndex(e => e.name === p.name), above = i < 0 ? [] : lb.slice(0, i).map(e => e.name);
    let prev = null;
    try { prev = JSON.parse(safeStorageGet(key) || 'null'); } catch (e) { prev = null; }
    safeStorageSet(key, JSON.stringify({ day: this.today, above, rank: i + 1 }));
    if (!prev) return '';
    if (prev.day === this.today) {
      // seulement si j'étais déjà classé à ma dernière visite
      const fresh = i < 0 || !prev.rank ? [] : above.filter(n => !prev.above.includes(n));
      if (fresh.length === 1) return `😈 ${fresh[0]} t'a dépassé !`;
      if (fresh.length > 1) return `😈 ${fresh.slice(0, 2).join(' et ')}${fresh.length > 2 ? '…' : ''} t'ont dépassé !`;
      return '';
    }
    const y = await Online.day(addDays(this.today, -1));
    const r = y ? y.findIndex(e => e.name === p.name) + 1 : 0;
    return r ? `📰 Hier, tu as fini ${r}${r === 1 ? 'er' : 'e'} sur ${y.length}.` : '';
  },

  scr_collection() {
    const p = this.p;
    const obj = o => ({ id: o.id, name: o.name, sprite: o.rock ? 'rock_6_0' : o.sprite, desc: o.desc, n: p.collection[o.id] || 0, wx: o.weather, season: o.season });
    const leg = l => ({ id: l.id, name: l.name, sprite: l.sprite, desc: l.desc, n: p.legends[l.id] || 0, legend: true, season: l.season });
    const list = OBJECTS.filter(o => !o.bonus).map(obj), legs = LEGENDS.map(leg);
    // objets des météos spéciales : section à part, ne comptent pas pour compléter la Bousipédia
    const bonus = OBJECTS.filter(o => o.bonus).map(obj);
    // objets de saison : à part, ils ne comptent pas pour compléter la Bousipédia
    const seasonal = SEASON_OBJECTS.map(obj).concat(leg(SUGAR_SKULL)).filter(e => e.n || isHalloween(this.today));
    const classic = list.concat(legs), all = classic.concat(seasonal, bonus);
    const sel = all.find(e => e.id === this.colSel && e.n > 0);
    const tile = e => `<button class="tile ${e.n ? '' : 'locked'} ${e.legend ? 'leg' : ''} ${this.colSel === e.id ? 'sel' : ''}" data-a="colsel" data-v="${e.id}">
        ${spriteImg(e.sprite, SPR[e.sprite].width > 20 ? 1 : 2, !e.n)}
        <span>${e.n ? esc(e.name) : '???'}</span></button>`;
    const hint = e => e.season ? '🎃 Semaine Halloween' : e.wx ? `Seulement par météo ${WEATHER[e.wx].icon}` : e.legend ? 'Trésor du jour' : '';
    const selEntry = all.find(e => e.id === this.colSel);
    return `<div class="screen">
      ${this.back('Bousipédia')}

      ${selEntry ? `<div class="panel detail">
        <div>${spriteImg(selEntry.sprite, 3, !sel)}</div>
        <div><b>${sel ? esc(sel.name) : '???'}</b><div class="tiny">${sel ? esc(sel.desc) : 'Pas encore découvert.'}</div>
        <div class="tiny">${sel ? `Avalé ${sel.n} fois` : ''} ${esc(hint(selEntry))}</div></div>
      </div>` : ''}
      <div class="label">Objets</div>
      <div class="grid">${list.map(tile).join('')}</div>
      <div class="label">Trésors légendaires</div>
      <div class="grid">${legs.map(tile).join('')}</div>
      ${this.today >= WX_ROTATION_FROM || bonus.some(e => e.n) ? `<div class="label">🌦️ Objets des météos spéciales <span class="tiny">(ne comptent pas pour compléter la Bousipédia)</span></div>
      <div class="tiny">${bonus.filter(e => e.n).length} / ${bonus.length}</div>
      <div class="grid">${bonus.map(tile).join('')}</div>` : ''}
      ${seasonal.length ? `<div class="label">🎉 Objets de saison <span class="tiny">(ne comptent pas pour compléter la Bousipédia)</span></div>
      <div class="tiny">🎃 Halloween 2026 · ${seasonal.filter(e => e.n).length} / ${seasonal.length}</div>
      <div class="grid">${seasonal.map(tile).join('')}</div>` : ''}
    </div>`;
  },

  scr_shop() {
    const p = this.p, open = this.today >= SHOP_FROM;
    if (this.shopTab === 'rank' && !open) this.shopTab = 'ball';
    const tab = this.shopTab, type = this.shopType(), rank = tab === 'rank';
    const shown = (t, it) => { const own = Store.owns(p, t, it); return (!it.secret || own) && (!it.survival || SURVIVAL_ON)
      && (!it.season || isHalloween(this.today) || own) && (!it.from || this.today >= it.from || own) && (!it.week || own) && (!it.gift || own) && (!it.devOnly || ONLINE_ENV === 'dev'); };
    const items = rank ? [] : COSMETICS[tab].filter(it => shown(tab, it));
    const eq = t => findCos(t, p.equip[t]);
    const prev = this.shopSel ? findCos(type, this.shopSel) : null;
    const mascot = (skin, hat, outfit, trail, R, scale) => {
      const w = R * 2 + 16, h = R * 2 + 18 + (trail.fx ? 14 : 0);
      return pix(mascotUrl(skin, hat, R, outfit, trail), w * scale, h * scale);
    };
    const swatch = (t, k) => pix(imgUrl('th_' + t.id, () => themeSwatch(t)), 36 * k, 22 * k);
    const tileImg = (it, t) => t === 'theme' ? swatch(it, 1.5)
      : mascot(t === 'ball' ? it : eq('ball'), t === 'hat' ? it : HATS[0], t === 'outfit' ? it : OUTFITS[0], t === 'trail' ? it : TRAILS[0], 8, 1.2);
    const status = (it, t) => {
      if (p.equip[t] === it.id) return '<span class="good">Équipé</span>';
      if (Store.owns(p, t, it)) return 'Possédé';
      if (it.badge) return `🔒 ${BADGES.find(b => b.id === it.badge).icon}`;
      if (it.price) return `${it.prestige ? '💎 ' : ''}🟡 ${it.price}`;
      if (it.mystery) return '❓ Mystère';
      if (it.prog) { const [a, b] = it.prog(p); return `🔒 ${Math.min(a, b)}/${b}`; }
      return '🔒';
    };
    const tile = (it, t = tab, act = 'shopitem', v = it.id) => {
      const owned = Store.owns(p, t, it), sel = this.shopSel === it.id && type === t;
      return `<button class="tile shop ${it.prestige ? 'prestige' : ''} ${p.equip[t] === it.id ? 'sel' : ''} ${owned ? '' : 'locked-soft'} ${sel ? 'sel2' : ''}" data-a="${act}" data-v="${v}">${it.rare ? '<span class="tag rare">RARE</span>' : ''}${tileImg(it, t)}<span>${esc(it.name)}</span><span class="tiny">${status(it, t)}</span></button>`;
    };
    let bar = '';
    if (prev && Store.owns(p, type, prev)) {
      // déjà obtenu : rappel de comment on l'a eu (rien pour un objet simplement acheté)
      const b = prev.badge && BADGES.find(x => x.id === prev.badge);
      const why = prev.got || prev.how || prev.text || (b ? `badge ${b.icon} ${b.name}` : '');
      if (why) bar = `<div class="panel tiny">${prev.secret ? '🤫' : '✅'} <b>${esc(prev.name)}</b> : ${esc(why)}</div>`;
    } else if (prev) {
      if (prev.badge) { const b = BADGES.find(x => x.id === prev.badge); bar = `<div class="panel tiny">🔒 Se débloque avec le badge ${b.icon} <b>${esc(b.name)}</b> : ${esc(b.desc)}</div>`; }
      else if (prev.price) bar = `<button class="btn big" data-a="buy" ${p.coins < prev.price ? 'disabled' : ''}>Acheter ${esc(prev.name)} — ${prev.price} 🟡</button>${p.coins < prev.price ? `<div class="tiny center">Il te manque ${prev.price - p.coins} 🟡</div>` : ''}`;
      else if (prev.mystery) bar = `<div class="panel tiny">❓ <b>${esc(prev.name)}</b> : comment l'obtenir ? Mystère… Un indice : <i>${esc(prev.mystery)}</i></div>`;
      else if (prev.prog) { const [a, b] = prev.prog(p); bar = `<div class="panel tiny">🔒 <b>${esc(prev.name)}</b> : ${esc(prev.text)} (${Math.min(a, b)}/${b})</div>`; }
    }
    // boutique de la semaine : visible sur tous les onglets
    const wk = weekShop(this.today);
    let wkHtml = '';
    if (wk) {
      const left = 7 - Math.round((dayFromKey(this.today) - dayFromKey(weekKey(this.today))) / 86400000);
      wkHtml = `<div class="panel wkshop"><div class="label">⭐ Boutique de la semaine <span class="tiny">· change lundi (${left === 1 ? 'demain' : `dans ${left} j`})</span></div>
        <div class="grid three">${wk.map(e => tile(e.item, e.type, 'wkitem', `${e.type}:${e.item.id}`)).join('')}</div>
        <div class="tiny center">Ces objets reviendront… un jour. Peut-être.</div></div>`;
    }
    const tabs = [['ball', 'Boules'], ['hat', 'Chapeaux'], ['outfit', 'Tenues'], ['trail', 'Traînées'], ['theme', 'Décors'], ...(open ? [['rank', 'Classement']] : [])]
      .map(([k, l]) => `<button class="tab ${tab === k ? 'on' : ''}" data-a="shoptab" data-v="${k}">${l}</button>`).join('');
    const found = Object.keys(COSMETICS).reduce((n, t) => n + COSMETICS[t].filter(it => it.secret && Store.owns(p, t, it)).length, 0);
    let top, body;
    if (rank) {
      // aperçu de sa ligne avec l'objet touché
      const look = {}; for (const t of RANK_TYPES) look[t] = (type === t && prev ? prev : eq(t)).id;
      top = `<div class="panel"><div class="tiny center">Aperçu de ta ligne au classement</div>
        <table class="lb"><tr class="${frameCls(look)}${ONLINE_ENV === 'dev' ? ' now' : ''}"><td>🥇</td><td>${nameHtml(p.name, look)}</td><td class="r">${fmtSize(p.stats.best || 0)}</td></tr></table></div>`;
      // chaque catégorie : d'abord ce qui s'achète, puis ce qui se gagne (🏅)
      const rstatus = (t, it) => !Store.owns(p, t, it) && it.prog ? `🏅 À gagner · ${Math.min(...it.prog(p))}/${it.prog(p)[1]}` : `${it.prog ? '🏅 ' : ''}${status(it, t)}`;
      const pill = (t, it) => `<button class="pill ${p.equip[t] === it.id ? 'on' : ''} ${this.shopSel === it.id && type === t ? 'sel2' : ''} ${Store.owns(p, t, it) ? '' : 'lock'} ${it.prog ? 'earn' : ''}" data-a="rankitem" data-v="${t}:${it.id}"><span class="pn">${t === 'color' ? `<span class="sw ${it.rainbow ? 'rainbow-bg' : ''}" style="${it.col ? 'background:' + it.col : ''}"></span> ` : t === 'frame' && it.col ? `<span class="sw" style="background:${it.col}"></span> ` : ''}${t === 'title' && it.id !== 'aucun' ? `« ${esc(it.name)} »` : esc(it.name)}</span><span class="tiny">${rstatus(t, it)}</span></button>`;
      const group = t => { const l = COSMETICS[t].filter(it => shown(t, it)); return l.filter(it => !it.prog).concat(l.filter(it => it.prog)).map(it => pill(t, it)).join(''); };
      body = `<div class="label">🖼️ Cadres</div><div class="pills rank">${group('frame')}</div>
        <div class="label">🎨 Couleurs du pseudo</div><div class="pills rank">${group('color')}</div>
        <div class="label">🏷️ Titres sous le pseudo</div><div class="pills rank">${group('title')}</div>
        <div class="tiny center">🏅 = ne s'achète pas, se gagne. Visible par tout le monde dans les classements.</div>`;
    } else {
      top = `<div class="mascot">${tab === 'theme' ? swatch(prev || eq('theme'), 3) : '<canvas id="preview" width="64" height="84" class="pix" style="width:calc(var(--u)*96);height:calc(var(--u)*126)"></canvas>'}</div>`;
      body = `<div class="grid three">${items.map(it => tile(it)).join('')}</div>
        <div class="tiny center">Gagne des 🟡 en jouant, en finissant les quêtes et en trouvant les trésors. Certains objets se méritent autrement…</div>
        <div class="tiny center">🤫 Secrets trouvés : ${found} / ${SECRET_COUNT}</div>`;
    }
    return `<div class="screen">
      ${this.back('Style')}
      <div class="topbar end"><span class="chip gold">🟡 ${p.coins}</span></div>
      ${top}
      ${bar}
      ${wkHtml}
      <div class="tabs">${tabs}</div>
      ${body}
    </div>`;
  },

  // Parrainage : créer un lien, suivre ses invités
  async scr_invites() {
    const r = await Online.myInvites();
    if (!r) return `<div class="screen">${this.back('Mes invitations', 'profile')}<div class="panel center">📶 Connecte-toi à internet pour voir tes invitations.</div></div>`;
    this.invLeft = r.left;
    const done = this.invDone, row = i => i.uid
      ? `<tr><td>✅ <b>${esc(i.usedBy)}</b></td><td class="tiny">${Math.min(i.days || 0, INVITE_DAYS)} / ${INVITE_DAYS} jours</td><td class="r tiny ${(i.days || 0) >= INVITE_DAYS ? 'good' : ''}">${(i.days || 0) >= INVITE_DAYS ? `+${INVITE_REWARD} 🟡 reçus` : `🎁 au ${INVITE_DAYS}e jour`}</td></tr>`
      : i.cancelled ? '' : `<tr><td>⏳ <b>${esc(i.label || 'Lien')}</b></td><td class="tiny">en attente</td><td class="r"><button class="btn ghost small" data-a="invcopy" data-v="${i.code}">📋</button> <button class="btn ghost small" data-a="invcancel" data-v="${i.code}">Annuler</button></td></tr>`;
    const rows = r.list.map(row).join('');
    return `<div class="screen">
      ${this.back('Mes invitations', 'profile')}
      <div class="panel"><div class="label">Nouvelle invitation <span class="tiny">(il t'en reste ${r.left || 0})</span></div>
        ${r.left > 0 ? `<input id="invlabel" maxlength="40" placeholder="Pour qui ? (facultatif, ex. Paul)">
        <div class="tiny bad form-err"></div>
        <button class="btn big" data-a="invnew">Créer le lien</button>` : '<div class="tiny">Plus d\'invitation pour l\'instant. Annuler un lien pas encore utilisé te la rend.</div>'}
        ${done ? `<div class="panel" style="margin-top:calc(var(--u)*3)">✅ Lien créé${done.label ? ` pour <b>${esc(done.label)}</b>` : ''} :<div class="tiny" style="word-break:break-all">${esc(inviteUrl(done.code))}</div>
          <div style="display:flex;gap:calc(var(--u)*2)"><button class="btn small" data-a="invcopy" data-v="${done.code}">📋 Copier</button>${navigator.share ? `<button class="btn ghost small" data-a="invshare" data-v="${done.code}">📤 Partager</button>` : ''}</div></div>` : ''}
      </div>
      ${rows ? `<div class="panel"><div class="label">Mes invités</div><table class="lb">${rows}</table></div>` : ''}
      <div class="tiny center">Chaque lien ne sert qu'une fois. Quand ton invité a joué ${INVITE_DAYS} jours, vous gagnez <b>${INVITE_REWARD} 🟡</b> chacun (et toi le titre « Recruteur 🎟️ » la première fois). Annuler un lien pas encore utilisé te rend l'invitation.</div>
      <div class="tiny center">Invite des gens de confiance : tu es un peu responsable de tes invités 😉</div>
    </div>`;
  },
  // Sondage : le vote est enregistré en ligne, puis le sondage disparaît de l'accueil (comme « OK »)
  async vote(v) {
    const [at, choice] = v.split(':');
    this.toast('Envoi du vote…');
    const ok = await Online.vote(this.p, at, +choice);
    if (!ok) return this.toast('Vote impossible pour le moment (pas de connexion ?).');
    safeStorageSet('bousier_annseen_' + ONLINE_ENV, JSON.stringify([...annSeen(), at].slice(-40)));
    this.toast('🗳️ Merci pour ton vote !');
    this.show('home');
  },
  async invNew() {
    const el = this.ui.querySelector('#invlabel'), label = el ? el.value.trim().slice(0, 40) : '';
    this.formError('Un instant…');
    const code = await Online.newInvite(this.p, label);
    if (!code) return this.formError('Impossible pour le moment (plus d\'invitation, invitations en pause, ou pas de connexion).');
    this.invDone = { code, label };
    this.show('invites');
  },
  async invCancel(code) {
    if (!confirm('Annuler ce lien ? Il ne pourra plus servir, et ton invitation te sera rendue.')) return;
    if (this.invDone && this.invDone.code === code) this.invDone = null;
    if (!await Online.cancelInvite(code)) return this.toast('Impossible pour le moment (pas de connexion ?).');
    this.show('invites');
  },
  async invCopy(code) {
    try { await navigator.clipboard.writeText(inviteUrl(code)); this.toast('Lien copié !'); }
    catch (e) { prompt('Copie ce lien :', inviteUrl(code)); }
  },

  // Dev seulement : choisir la date simulée (raccourcis vers les nouveautés et chaque météo spéciale)
  timeShiftPanel() {
    const marks = [['2026-10-26', '🎃 26 oct. Halloween, Style, pionniers'], ['2026-10-31', '🧙 31 oct. nuit d\'Halloween'], ['2026-11-02', '⚡ 2 nov. événements'], ['2026-11-09', '⭐ 9 nov. boutique de la semaine']];
    for (const id of WEEKLY_WEATHERS) {
      const w = ALL_WEATHERS.find(x => x.id === id);
      for (let k = WX_ROTATION_FROM; k < '2027'; k = addDays(k, 1)) if (weeklyWeather(k) >= 0 && ALL_WEATHERS[weeklyWeather(k)].id === id) {
        // même jour qu'un autre raccourci : on regroupe
        const m = marks.find(x => x[0] === k);
        if (m) m[1] += ` + ${w.icon} ${w.name.toLowerCase()}`; else marks.push([k, `${w.icon} ${+k.slice(8)}/${k.slice(5, 7)} ${w.name}`]);
        break;
      }
    }
    marks.sort((x, y) => x[0] < y[0] ? -1 : 1);
    return `<div class="panel"><div class="label">🕰️ Voyage dans le temps <span class="tiny">(dev seulement)</span></div>
      <div class="tiny">${TIME_SHIFT ? `Date simulée : <b>${esc(fmtDayLong(TIME_SHIFT))}</b>` : 'Date réelle.'} Le site officiel et ta progression de main ne sont jamais touchés. En date simulée, les scores en ligne peuvent être refusés.</div>
      <div class="pills">${marks.map(([k, l]) => `<button class="pill ${TIME_SHIFT === k ? 'on' : ''}" data-a="timeshift" data-v="${k}">${esc(l)}</button>`).join('')}</div>
      <div style="display:flex;gap:calc(var(--u)*2);align-items:center"><input id="tsdate" type="date" value="${TIME_SHIFT || ''}"><button class="btn ghost small" data-a="timeshift" data-v="pick">Aller à cette date</button></div>
      ${TIME_SHIFT ? '<button class="btn" data-a="timeshift" data-v="">⏪ Revenir à aujourd\'hui</button>' : ''}</div>`;
  },
};

// Titres comiques du jour, d'après la meilleure partie de chacun
const COPYRIGHT = '<div class="copy">© 2026 zodiacfbo · Tous droits réservés</div>';

function dayTitles(lb, day = dayKey()) {
  const runs = lb.filter(e => e.run);
  if (runs.length < 2) return [];
  const top = f => {
    let best = null;
    for (const e of runs) { const v = f(e.run); if (v > 0 && (!best || v > best.v)) best = { name: e.name, v }; }
    return best;
  };
  // titres liés au terrier : sur les 3 essais du jour de chacun
  const tries = lb.filter(e => e.runs && e.runs.length);
  const low = f => {
    let best = null;
    for (const e of tries) for (const r of e.runs) { const v = f(r); if (v != null && (!best || v < best.v)) best = { name: e.name, v }; }
    return best;
  };
  const most = f => {
    let best = null;
    for (const e of tries) { const v = f(e.runs); if (v > 0 && (!best || v > best.v)) best = { name: e.name, v }; }
    return best;
  };
  const missed = most(rs => rs.filter(r => !r.terrier).length);
  // nouveaux titres (à partir du 26 octobre)
  const fresh = day >= EGG.from;
  const zenBest = (() => { let best = null; for (const e of tries) for (const r of e.runs) if (r.terrier && r.score != null && r.bumps === 0 && r.wallHits === 0 && (!best || r.score > best.v)) best = { name: e.name, v: r.score }; return best; })();
  const miracle = most(rs => Math.max(0, ...rs.filter(r => r.terrier && r.bumps != null).map(r => r.bumps + (r.wallHits || 0))));
  // semaine Halloween : le plus de bonbons avalés sur la journée (tous essais)
  const sweet = isHalloween(day) && (() => { let best = null; for (const e of lb) if ((e.bonbons || 0) > (best ? best.v : 0)) best = { name: e.name, v: e.bonbons }; return best; })();
  const remont = most(rs => rs.length > 1 && rs.every(r => r.score != null) ? Math.max(...rs.map(r => r.score)) - rs[0].score : 0);
  return [
    ['🎯', 'Dans le mille', low(r => r.terrier && r.holeOff != null ? r.holeOff : null), v => `${Math.round(100 - v / HOLE_TOL * 100)} %`, 'bullseye'],
    ['🙈', 'Raté de peu', low(r => !r.terrier && r.missBy != null ? r.missBy : null), v => v < 2 ? 'd\'un cheveu' : v < 6 ? 'de très peu' : 'de peu', 'close'],
    ['🕳️', 'Le terrier, c\'est pour les autres', missed && missed.v >= 2 ? missed : null, v => v + ' ratés', 'nohole'],
    ['🐢', 'Le plus lent', top(r => r.time), v => fmtTime(v), 'slow'],
    ['💥', 'Roi des chocs', top(r => (r.bumps || 0) + (r.wallHits || 0)), v => v + ' chocs', 'bumps'],
    ['🧲', 'L\'aspirateur', top(r => r.absorbed), v => v + ' objets', 'vacuum'],
    ['🌵', 'L\'ami des cactus', top(r => r.pricks || 0), v => v + ' piqûre' + (v > 1 ? 's' : ''), 'cactus'],
    ['⚡', 'Le sprinteur', fresh && low(r => r.terrier && r.time ? r.time : null), v => fmtTime(v), 'sprint'],
    ['📈', 'La remontada', fresh && remont && remont.v >= 30 ? remont : null, v => '+' + fmtSize(v), 'remontada'],
    ['🧘', 'Le zen', fresh && zenBest, () => '0 choc', 'zen'],
    ['🍬', 'Le gourmand', sweet, v => v + ' bonbon' + (v > 1 ? 's' : ''), 'sweet'],
    ['🍀', 'Le miraculé', fresh && miracle && miracle.v >= 10 ? miracle : null, v => v + ' chocs et au terrier !', 'miracle'],
  ].filter(t => t[2]).map(([icon, label, b, fmt, key]) => ({ icon, label, key, name: b.name, value: fmt(b.v) }));
}

function medal(i) { return ['🥇', '🥈', '🥉'][i] || (i + 1) + '.'; }

window.addEventListener('load', () => { Online.connect(); App.init(); });

// Installable comme une appli (PWA) + jouable hors connexion
if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(() => { });

</script>
